source_of_truth: company/paperclip-agent-skill-bindings.yaml
description: >
  Paperclip agent skill 绑定治理清单。用于在公司导入、运行时重建或服务器迁移后，
  按稳定来源标识恢复 agent 的 desiredSkills，而不是依赖会变化的运行时 skill key。

bindings:
  - agent_name: "Research & Knowledge Lead"
    desired_skills:
      - skill_alias: "getnote-codex-local"
        source_type: "local_path"
        source_locator: "/opt/automation/app/mindsync/shared/skills/getnote"
        env_patch_required: true

  - agent_name: "Content Lead"
    desired_skills:
      - skill_alias: "getnote-codex-local"
        source_type: "local_path"
        source_locator: "/opt/automation/app/mindsync/shared/skills/getnote"
        env_patch_required: true

  - agent_name: "Engineer"
    desired_skills:
      - skill_alias: "getnote-codex-local"
        source_type: "local_path"
        source_locator: "/opt/automation/app/mindsync/shared/skills/getnote"
        env_patch_required: true
