# .paperclip.yaml - 墨予镜公司 Paperclip 配置
# 这是 MindSync Monorepo 工作空间的核心配置文件
# 定义了公司结构、Agents、Goals 和 Projects 的元数据
# 公司对象主数据以 company/项目注册表.yaml 为治理源；
# 本文件保留 Paperclip 运行时所需的映射和兼容配置。

