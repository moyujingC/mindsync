    projects:
      - "ada487d0-5b78-44c6-b308-b711c13407d8"

  - id: "8cadf9b9-969e-4d30-9c1b-2c6f8b051c02"
    title: "怀瑾握瑜产品化"
    projects:
      - "00403f31-add0-4b19-b715-6652a4b3dfe3"

  - id: "1c20b0f1-d8d6-4245-a5bb-54211b1a1bdf"
    title: "墨予镜影响力建设"
    projects:
      - "6947ac34-cf22-4a87-bc4c-ded2edc77772"

# Project 配置
projects:
  - id: "0570caa7-536b-460f-ac99-f270c1cd4640"
    name: "Onboarding"
    goal_id: "6c77fbb6-2c8f-4c4a-a07d-d70334b4537c"

  - id: "ada487d0-5b78-44c6-b308-b711c13407d8"
    name: "一镜一梳"
    goal_id: "5e306532-1d5c-4733-9a84-9804cfa2228d"
    directory: "projects/yijingyishu"
    repository: "https://github.com/MindSyncHub/ai-mandala"
    source_subdirectory: "src"

  - id: "00403f31-add0-4b19-b715-6652a4b3dfe3"
    name: "怀瑾握瑜"
    goal_id: "8cadf9b9-969e-4d30-9c1b-2c6f8b051c02"
    directory: "projects/huaijinnwooyu"
    repository: "https://github.com/MindSyncHub/ai-career"
    source_subdirectory: "src"

  - id: "6947ac34-cf22-4a87-bc4c-ded2edc77772"
    name: "墨予镜内容"
    goal_id: "1c20b0f1-d8d6-4245-a5bb-54211b1a1bdf"

# 同步配置
sync:
  # Agent 配置同步
  agents:
    paperclip_base: "${HOME}/.paperclip/instances/default/companies/e53a86d4-299d-4a9c-8db5-6e82c77b76c8/agents"
    mindsync_base: "agents"

  # 同步方向
  # export: 从 Paperclip 导出到 mindsync (用于 Git 提交)
  # import: 从 mindsync 导入到 Paperclip (应用到运行时)
  default_direction: "export"

# 工作空间配置
workspace:
  # 是否自动备份
  auto_backup: true

  # 备份间隔 (分钟)
  backup_interval: 30

  # 忽略的目录
  ignore_dirs:
    - "node_modules"
    - "__pycache__"
    - ".git"
    - "*.log"

  # 忽略的文件
  ignore_files:
    - ".DS_Store"
    - "*.tmp"
    - "*.temp"
