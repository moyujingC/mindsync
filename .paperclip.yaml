# .paperclip.yaml - 知行工坊 Paperclip 配置
# 这是 MindSync Monorepo 工作空间的核心配置文件
# 定义了公司结构、Agents、Goals 和 Projects 的元数据
# 公司对象主数据以 company/项目注册表.yaml 为治理源；
# 本文件保留 Paperclip 运行时所需的映射和兼容配置。

# 公司信息
company:
  id: "be191a6e-7447-4821-a93d-9114214c4a64"
  name: "知行工坊"
  description: "一人公司系统，以知促行，以行验知"
  mode: "remote_authenticated"
  host: "vm-0-11-opencloudos.tail176582.ts.net"
  port: 3100
  # 当前口径：
  # - control plane host 继续是 automation 节点
  # - server execution host 继续承接 server_automation
  # - local execution host 正式绑定到用户当前这台 Mac
  # - codex_local / claude_local / pi_local 对普通任务路径默认由 Mac 本地执行器承接
  # 对普通任务路径，不再把 *_local 默认解释成 automation 服务器本地。

# Agent 配置
agents:
  - id: "2014e2cd-af7a-4be1-bb60-e6a324b7c3c1"
    name: "CEO"
    role: "ceo"
    # 临时回退口径：Hermes session resume 存在上游 bug，先切回 claude_local 保证 CEO 可用。
    adapter: "claude_local"
    directory: "agents/ceo"

  - id: "81c0b428-1016-42b6-8393-9f23cb1dca49"
    name: "Idea Clarifier"
    role: "idea_clarifier"
    # 正式主链路：服务器侧 pi_local
    # 当前已验证通过的模型口径：
    # - provider/model: volcengine-coding-plan/Doubao-Seed-2.0-pro
    # - pi 运行时 HOME: /paperclip
    # - 通过自定义 Pi provider 走火山兼容的 openai-completions 链路
    # 运行时兜底：当 pi_local 因环境缺失失败时，Paperclip 应自动回退到 claude_local
    adapter: "pi_local"
    directory: "agents/idea-clarifier"

  - id: "499cd480-8072-42b7-b60b-ca94d2d4118c"
    name: "Business Lead"
    role: "business"
    adapter: "claude_local"
    directory: "agents/business-lead"

  - id: "bf010eca-064d-41a3-9b8d-401e71c69d23"
    name: "Product Spec Lead"
    role: "product_spec"
    adapter: "claude_local"
    directory: "agents/product-spec-lead"

  - id: "bad0ce29-22e4-4e2f-87b7-0fa26a0c4ba3"
    name: "UI / UX"
    role: "ui_ux"
    adapter: "claude_local"
    directory: "agents/ui-ux"

  - id: "da3da98c-79a7-4990-b26d-3530d2711c2e"
    name: "Research & Knowledge Lead"
    role: "research_knowledge"
    adapter: "claude_local"
    directory: "agents/research-knowledge-lead"

  - id: "a575d0ee-6528-4d48-81b2-b32ec062be49"
    name: "Architect"
    role: "architect"
    adapter: "claude_local"
    directory: "agents/architect"

  - id: "fd835fc1-7e14-487f-ba02-45eed5f6c221"
    name: "Engineer"
    role: "engineer"
    adapter: "codex_local"
    directory: "agents/engineer"

  - id: "74eec73d-6752-4478-bbe2-6215be534715"
    name: "Test / QA"
    role: "test_qa"
    adapter: "codex_local"
    directory: "agents/test-qa"

  - id: "2faf9d77-9454-44ec-97c2-dbd24d34a9e6"
