    source_subdirectory: "."
    # 运行态治理口径：
    # - agent 的执行工作目录由 project / issue 级 execution workspace policy 决定
    # - agent 自身 adapter 配置里的 cwd 仅保留为 legacy fallback
    # - 一镜一梳当前默认策略应为：
    #   - executionWorkspacePolicy.enabled = true
    #   - defaultMode = isolated_workspace
    #   - workspaceStrategy.type = git_worktree
    #   - workspaceStrategy.worktreeParentDir = /opt/automation/worktrees

  - id: "00403f31-add0-4b19-b715-6652a4b3dfe3"
