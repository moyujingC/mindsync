    repository: "https://github.com/MindSyncHub/mindsync"
    source_subdirectory: "projects/relayhub"

# 同步配置
sync:
  # Agent 配置同步
  agents:
    paperclip_base: "${HOME}/.paperclip/instances/default/companies/be191a6e-7447-4821-a93d-9114214c4a64/agents"
    mindsync_base: "agents"

  # 同步方向
  # export: 从 Paperclip 导出到 mindsync (用于 Git 提交)
  # import: 从 mindsync 导入到 Paperclip (应用到运行时)
  default_direction: "export"

# 工作空间配置
workspace:
  # 默认主工作区是 Monorepo 根目录；项目任务进入对应 projects/<slug>
  # 这里的“进入”表示 Paperclip 在 project / issue 层解析执行工作区后，
  # 再把最终 cwd 注入 agent 运行上下文；不要把它理解成 agent 自己写死工作目录。
  # 运行态 Agent 应优先读取：
  # 1. COMPANY.md
  # 2. company/项目注册表.yaml
  # 3. company/任务审阅与状态流转规范.md
  # 4. company/Paperclip任务系统优化方案.md
  # 5. company/任务类型与标签规范.md
  # 6. company/任务创建模板.md
  # 7. company/顶层任务收束规则.md
  # 8. company/标签与状态使用说明.md
  # 9. MONOREPO.md
  # 10. DOCS_GOVERNANCE.md
  # 11. 对应 projects/<slug>/PROJECT.md
  # 12. 当前阶段 artifact（spec / decisions / tasks / qa / delivery）

  # 是否自动备份
  auto_backup: true

  # 备份间隔 (分钟)
  backup_interval: 30

  # 忽略的目录
  ignore_dirs:
    - "node_modules"
    - "__pycache__"
    - ".git"
    - "*.log"

  # 忽略的文件
  ignore_files:
    - ".DS_Store"
    - "*.tmp"
    - "*.temp"
