<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
  /* 小红书 3:4 知识卡片 · 一镜一梳「暖愈」疗愈风
     视觉依据：课程输入稿 4.2（低饱和、柔和、圆与中心、自然生长感）
     用法：<body> 无需主题 class（单一暖愈主题），内容块 class 见下
     画布 1080×1440（3:4），适配 XHS 上传 */
  :root {
    --canvas: 1080px; --h: 1440px;
    --pad-x: 92px;
    /* 暖愈色系：奶油底 + 暖褐墨 + 陶土点缀，低饱和 */
    --bg: #f7f2ea; --ink: #42382e; --ink-soft: #8d8172;
    --hairline: #e7dccd; --label: #a2937f;
    --accent: #a9713f;
    --banner-bg: #efe0cb; --banner-ink: #5d4a35;
    --motif: #ecdfcb;   /* 曼陀罗纹样线条 */
    --serif: "Songti SC", "STSong", "Noto Serif CJK SC", serif;
    --sans: "PingFang SC", "苹方-简", sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: var(--canvas); height: var(--h); }
  body {
    background: var(--bg); color: var(--ink);
    font-family: var(--sans);
    position: relative; overflow: hidden;
    padding: 68px var(--pad-x) 120px;
  }
  /* 曼陀罗纹样：生命之花式同心圆，右上出血，垫底 */
  .mandala {
    position: absolute; top: 130px; right: -170px;
    width: 640px; height: 640px;
    pointer-events: none; z-index: 0;
  }
  /* 页眉 */
  .head {
    display: flex; justify-content: space-between; align-items: flex-start;
    padding-bottom: 24px; border-bottom: 1px solid var(--hairline);
    position: relative; z-index: 1;
  }
  .logo { font-family: var(--serif); font-size: 36px; font-weight: 700; letter-spacing: 6px; }
  .meta { text-align: right; font-size: 19px; letter-spacing: 2px; color: var(--label); line-height: 1.7; }
  /* 内容区 */
  .body { position: relative; z-index: 1; padding-top: 64px; }
  h1.title {
    font-family: var(--serif);
    font-size: 92px; font-weight: 700; line-height: 1.32;
    letter-spacing: 2px; margin-bottom: 44px;
  }
  /* 封面宣言卡/收尾卡巨型标题：必须 <br> 按词组断行，每行 3~5 字，不顶满版心 */
  h1.title-xl {
    font-family: var(--serif);
    font-size: 138px; font-weight: 700; line-height: 1.28;
    letter-spacing: 2px; margin-bottom: 52px;
  }
  .lead { font-size: 36px; font-weight: 600; line-height: 1.62; margin-bottom: 44px; }
  .lead-sm { font-size: 30px; line-height: 1.66; color: var(--ink); margin-bottom: 44px; }
  /* 小标签 + 正文 */
  .kicker {
    font-size: 22px; letter-spacing: 3px; color: var(--label);
    font-weight: 600; margin: 40px 0 16px;
  }
  .kicker b { font-weight: 700; color: var(--accent); }
  .kicker-text { font-size: 30px; line-height: 1.6; margin-bottom: 12px; }
  /* 编号项：① 加粗引导 + 暖灰说明 */
  .num-item { margin: 32px 0; }
  .num-item .t { font-size: 34px; font-weight: 700; margin-bottom: 8px; }
  .num-item .d { font-size: 27px; line-height: 1.55; color: var(--ink-soft); }
  /* 分组小标题 */
  .group-label { font-size: 24px; color: var(--label); margin: 36px 0 12px; letter-spacing: 3px; }
  /* 子弹列表：柔和圆点 + 发丝分隔线 */
  ul.blist { list-style: none; }
  ul.blist li {
    font-size: 30px; line-height: 1.58; padding: 17px 0 17px 40px;
    border-bottom: 1px solid var(--hairline); position: relative;
  }
  ul.blist li::before { content: "·"; position: absolute; left: 8px; top: 8px; font-size: 40px; color: var(--accent); }
  ul.blist li:last-child { border-bottom: none; }
  /* 金句横幅：陶土暖沙底 + 圆角，非黑底 */
  .banner {
    background: var(--banner-bg); color: var(--banner-ink);
    font-family: var(--serif);
    font-size: 38px; font-weight: 700; line-height: 1.58;
    padding: 36px 42px; margin-top: 52px;
    border-radius: 22px;
  }
  /* 页脚标语 */
  .foot {
    position: absolute; bottom: 50px; left: var(--pad-x); right: var(--pad-x);
    display: flex; justify-content: space-between;
    font-size: 19px; letter-spacing: 2px; color: var(--label);
  }
</style>
</head>
<body>
  <!-- 生命之花曼陀罗纹样：外环 + 七圆 + 中心点 -->
  <svg class="mandala" viewBox="0 0 640 640" xmlns="http://www.w3.org/2000/svg">
    <g fill="none" stroke="var(--motif)" stroke-width="2">
      <circle cx="320" cy="320" r="310"/>
      <circle cx="320" cy="320" r="230"/>
      <circle cx="320" cy="320" r="150"/>
      <circle cx="470" cy="320" r="150"/>
      <circle cx="395" cy="450" r="150"/>
      <circle cx="245" cy="450" r="150"/>
      <circle cx="170" cy="320" r="150"/>
      <circle cx="245" cy="190" r="150"/>
      <circle cx="395" cy="190" r="150"/>
      <circle cx="320" cy="320" r="70"/>
    </g>
    <circle cx="320" cy="320" r="8" fill="var(--motif)"/>
  </svg>
  <div class="head">
    <div class="logo">{{LOGO}}</div>
    <div class="meta">{{SERIES}}<br>{{PAGE}}</div>
  </div>
  <div class="body">
{{CONTENT}}
  </div>
  <div class="foot"><span>{{FOOT_L}}</span><span>{{FOOT_R}}</span></div>
</body>
</html>
