<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
  /* 小红书 3:4 知识卡片 · HA7CH 范式复刻
     用法：<body class="theme-light|theme-dark">，内容块 class 见下
     画布 1080×1440（3:4），适配 XHS 上传 */
  :root {
    --canvas: 1080px; --h: 1440px;
    --pad-x: 88px;
  }
  .theme-light {
    --bg: #f7f6f2; --ink: #141414; --ink-soft: #6f6f6a;
    --hairline: #e3e1da; --label: #8a8a84;
    --banner-bg: #141414; --banner-ink: #f7f6f2;
    --watermark: #efeee9;
  }
  .theme-dark {
    --bg: #0b0b0b; --ink: #f2f1ec; --ink-soft: #9a9a94;
    --hairline: #262624; --label: #7c7c76;
    --banner-bg: #f2f1ec; --banner-ink: #0b0b0b;
    --watermark: #161615;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: var(--canvas); height: var(--h); }
  body {
    background: var(--bg); color: var(--ink);
    font-family: "PingFang SC", "苹方-简", sans-serif;
    position: relative; overflow: hidden;
    padding: 64px var(--pad-x) 120px;
  }
  /* 页眉 */
  .head {
    display: flex; justify-content: space-between; align-items: flex-start;
    padding-bottom: 22px; border-bottom: 1px solid var(--hairline);
  }
  .logo { font-size: 34px; font-weight: 800; letter-spacing: 2px; font-style: italic; }
  .meta { text-align: right; font-size: 19px; letter-spacing: 3px; color: var(--label); line-height: 1.7; }
  /* 巨型水印页码 */
  .wm {
    position: absolute; top: 130px; right: -40px;
    font-size: 420px; font-weight: 800; color: var(--watermark);
    line-height: 1; letter-spacing: -20px; pointer-events: none; z-index: 0;
  }
  /* 内容区 */
  .body { position: relative; z-index: 1; padding-top: 56px; }
  h1.title {
    font-size: 104px; font-weight: 800; line-height: 1.2;
    letter-spacing: 1px; margin-bottom: 40px;
  }
  /* 巨型标题（封面宣言卡/收尾卡用）：每行 3~5 字成词组断行，text-wrap: balance 自动均衡 */
  h1.title-xl {
    font-size: 168px; font-weight: 800; line-height: 1.18;
    letter-spacing: 2px; margin-bottom: 48px; text-wrap: balance;
  }
  .lead { font-size: 36px; font-weight: 700; line-height: 1.5; margin-bottom: 40px; }
  .lead-sm { font-size: 30px; line-height: 1.6; color: var(--ink); margin-bottom: 40px; }
  /* 英文小标签 + 正文 */
  .kicker {
    font-size: 22px; letter-spacing: 4px; color: var(--label);
    font-weight: 600; margin: 36px 0 14px;
  }
  .kicker b { font-weight: 800; }
  .kicker-text { font-size: 30px; line-height: 1.55; margin-bottom: 12px; }
  /* 编号项：① 加粗引导 + 灰色说明 */
  .num-item { margin: 30px 0; }
  .num-item .t { font-size: 34px; font-weight: 800; margin-bottom: 6px; }
  .num-item .d { font-size: 27px; line-height: 1.5; color: var(--ink-soft); }
  /* 分组小标题（适合/不适合） */
  .group-label { font-size: 24px; color: var(--label); margin: 34px 0 10px; letter-spacing: 2px; }
  /* 子弹列表：‣ 项 + 发丝分隔线 */
  ul.blist { list-style: none; }
  ul.blist li {
    font-size: 30px; line-height: 1.5; padding: 16px 0 16px 40px;
    border-bottom: 1px solid var(--hairline); position: relative;
  }
  ul.blist li::before { content: "‣"; position: absolute; left: 4px; top: 12px; font-size: 28px; }
  ul.blist li:last-child { border-bottom: none; }
  /* 金句横幅 */
  .banner {
    background: var(--banner-bg); color: var(--banner-ink);
    font-size: 40px; font-weight: 800; line-height: 1.5;
    padding: 34px 38px; margin-top: 48px;
  }
  /* 页脚标语 */
  .foot {
    position: absolute; bottom: 48px; left: var(--pad-x); right: var(--pad-x);
    display: flex; justify-content: space-between;
    font-size: 19px; letter-spacing: 3px; color: var(--label);
  }
</style>
</head>
<body class="{{THEME}}">
  <div class="head">
    <div class="logo">{{LOGO}}</div>
    <div class="meta">{{SERIES}}<br>{{PAGE}}</div>
  </div>
  <div class="wm">{{INDEX}}</div>
  <div class="body">
{{CONTENT}}
  </div>
  <div class="foot"><span>{{FOOT_L}}</span><span>{{FOOT_R}}</span></div>
</body>
</html>
