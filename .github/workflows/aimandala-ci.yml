name: ci

on:
  pull_request:
    branches:
      - main
    paths:
      - "projects/aimandala/toC/**"
      - "projects/aimandala/fixtures/**"
      - "shared/tools/ci/**"
      - ".github/workflows/aimandala-ci.yml"
      - ".github/workflows/aimandala-auto-repair.yml"
  push:
    branches:
      - aimandala/dev
      - main
      - release
    paths:
      - "projects/aimandala/toC/**"
      - "projects/aimandala/fixtures/**"
      - "shared/tools/ci/**"
      - ".github/workflows/aimandala-ci.yml"
      - ".github/workflows/aimandala-auto-repair.yml"

concurrency:
  group: aimandala-ci-${{ github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PAPERCLIP_COMPANY_ID: "be191a6e-7447-4821-a93d-9114214c4a64"
  PAPERCLIP_PROJECT_NAME: "一镜一梳"

jobs:
  dev-branch-light-ci:
    name: dev-branch-light-ci
    if: github.event_name == 'push' && github.ref_name == 'aimandala/dev'
    runs-on:
      - self-hosted
      - linux
      - mindsync-ci
      - aimandala
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: projects/aimandala/toC/app/frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          set -euo pipefail
          npm --prefix projects/aimandala/toC/app/frontend ci

      - name: Run Frontend Lint
        run: |
          set -euo pipefail
          npm --prefix projects/aimandala/toC/app/frontend run lint

      - name: Run Frontend Typecheck
        run: |
          set -euo pipefail
          npm --prefix projects/aimandala/toC/app/frontend run typecheck

  workflow-quality:
    name: workflow-quality
    if: github.event_name != 'push' || github.ref_name != 'aimandala/dev'
    runs-on:
      - self-hosted
      - linux
      - mindsync-ci
      - aimandala
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify actionlint Availability
        id: actionlint_check
        continue-on-error: true
        run: |
          set -euo pipefail
          if ! command -v actionlint >/dev/null 2>&1; then
            echo "actionlint is not installed on this runner" | tee "$RUNNER_TEMP/actionlint-availability.log"
            exit 1
          fi

      - name: Run actionlint
        id: actionlint_run
        if: steps.actionlint_check.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          actionlint -config-file .github/actionlint.yaml \
            .github/workflows/aimandala-*.yml 2>&1 | tee "$RUNNER_TEMP/actionlint.log"

      - name: Resolve Workflow Result
        id: workflow_result
        if: always()
        run: |
          set -euo pipefail
          FAILED=0
          KIND="build-failure"
          FAILED_STEP=""
          REPRO_COMMAND=""
          SUMMARY_FILE=""

          if [[ "${{ steps.actionlint_check.outcome }}" != "success" ]]; then
            FAILED=1
            KIND="build-failure"
            FAILED_STEP="Verify actionlint Availability"
            REPRO_COMMAND="actionlint -config-file .github/actionlint.yaml .github/workflows/aimandala-*.yml"
            SUMMARY_FILE="$RUNNER_TEMP/actionlint-availability.log"
          elif [[ "${{ steps.actionlint_run.outcome }}" != "success" ]]; then
            FAILED=1
            KIND="lint-failure"
            FAILED_STEP="Run actionlint"
            REPRO_COMMAND="actionlint -config-file .github/actionlint.yaml .github/workflows/aimandala-*.yml"
            SUMMARY_FILE="$RUNNER_TEMP/actionlint.log"
          fi

          printf 'failed=%s\n' "$FAILED" >> "$GITHUB_OUTPUT"
          printf 'kind=%s\n' "$KIND" >> "$GITHUB_OUTPUT"
          printf 'failed_step=%s\n' "$FAILED_STEP" >> "$GITHUB_OUTPUT"
          printf 'repro_command=%s\n' "$REPRO_COMMAND" >> "$GITHUB_OUTPUT"
          printf 'summary_file=%s\n' "$SUMMARY_FILE" >> "$GITHUB_OUTPUT"

      - name: Sync Workflow Paperclip Issue
        if: always()
        env:
          PAPERCLIP_API_BASE: ${{ secrets.PAPERCLIP_API_BASE }}
          PAPERCLIP_API_KEY: ${{ secrets.PAPERCLIP_API_KEY }}
          PAPERCLIP_ENGINEER_AGENT_ID: ${{ secrets.PAPERCLIP_ENGINEER_AGENT_ID }}
        run: |
          set -euo pipefail
          PAPERCLIP_BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          SYNC_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          RESULT="resolved"
          if [[ "${{ steps.workflow_result.outputs.failed }}" == "1" ]]; then
            RESULT="failed"
          fi
          node shared/tools/ci/paperclip-ci-issue.mjs \
            --soft-fail \
            --company-id "$PAPERCLIP_COMPANY_ID" \
            --project-name "$PAPERCLIP_PROJECT_NAME" \
            --execution-adapter "github-actions/self-hosted-runner:ci" \
            --kind "${{ steps.workflow_result.outputs.kind }}" \
            --workflow "ci" \
            --repository "${{ github.repository }}" \
            --branch "$PAPERCLIP_BRANCH" \
            --job "workflow-quality" \
            --sha "${{ github.event.pull_request.head.sha || github.sha }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --event-time "$SYNC_TIME" \
            --commit-parent \
            --failed-step "${{ steps.workflow_result.outputs.failed_step }}" \
            --repro-command "${{ steps.workflow_result.outputs.repro_command }}" \
            --summary-file "${{ steps.workflow_result.outputs.summary_file }}" \
            --result "$RESULT" \
            --owner-agent-id "$PAPERCLIP_ENGINEER_AGENT_ID" \
            --owner-label "Engineer"

      - name: Fail Workflow Job
        if: steps.workflow_result.outputs.failed == '1'
        run: exit 1

  frontend-quality:
    name: frontend-quality
    if: github.event_name != 'push' || github.ref_name != 'aimandala/dev'
    runs-on:
      - self-hosted
      - linux
      - mindsync-ci
      - aimandala
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: projects/aimandala/toC/app/frontend/package-lock.json

      - name: Install Frontend Dependencies
        id: frontend_install
        continue-on-error: true
        run: |
          set -euo pipefail
          npm --prefix projects/aimandala/toC/app/frontend ci 2>&1 | tee "$RUNNER_TEMP/frontend-install.log"

      - name: Run Frontend Lint
        id: frontend_lint
        if: steps.frontend_install.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          npm --prefix projects/aimandala/toC/app/frontend run lint 2>&1 | tee "$RUNNER_TEMP/frontend-lint.log"

      - name: Run Frontend Format Check
        id: frontend_format
        if: steps.frontend_lint.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          npm --prefix projects/aimandala/toC/app/frontend run format:check 2>&1 | tee "$RUNNER_TEMP/frontend-format.log"

      - name: Run Vitest
        id: frontend_vitest
        if: steps.frontend_format.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          npm --prefix projects/aimandala/toC/app/frontend test 2>&1 | tee "$RUNNER_TEMP/frontend-vitest.log"

      - name: Run Vitest Coverage
        id: frontend_coverage
        if: steps.frontend_vitest.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          npm --prefix projects/aimandala/toC/app/frontend run test:coverage 2>&1 | tee "$RUNNER_TEMP/frontend-coverage.log"

      - name: Run Typecheck
        id: frontend_typecheck
        if: steps.frontend_coverage.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          npm --prefix projects/aimandala/toC/app/frontend run typecheck 2>&1 | tee "$RUNNER_TEMP/frontend-typecheck.log"

      - name: Run Mobile Web Build
        id: frontend_build
        if: steps.frontend_typecheck.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          npm --prefix projects/aimandala/toC/app/frontend run build:mobile-web 2>&1 | tee "$RUNNER_TEMP/frontend-build.log"

      - name: Resolve Frontend Result
        id: frontend_result
        if: always()
        run: |
          set -euo pipefail
          FAILED=0
          KIND="ci-test-failure"
          FAILED_STEP=""
          REPRO_COMMAND=""
          SUMMARY_FILE=""

          if [[ "${{ steps.frontend_install.outcome }}" != "success" ]]; then
            FAILED=1
            KIND="build-failure"
            FAILED_STEP="Install Frontend Dependencies"
            REPRO_COMMAND="npm --prefix projects/aimandala/toC/app/frontend ci"
            SUMMARY_FILE="$RUNNER_TEMP/frontend-install.log"
          elif [[ "${{ steps.frontend_lint.outcome }}" != "success" ]]; then
            FAILED=1
            KIND="lint-failure"
            FAILED_STEP="Run Frontend Lint"
            REPRO_COMMAND="npm --prefix projects/aimandala/toC/app/frontend run lint"
            SUMMARY_FILE="$RUNNER_TEMP/frontend-lint.log"
          elif [[ "${{ steps.frontend_format.outcome }}" != "success" ]]; then
            FAILED=1
            KIND="format-failure"
            FAILED_STEP="Run Frontend Format Check"
            REPRO_COMMAND="npm --prefix projects/aimandala/toC/app/frontend run format:check"
            SUMMARY_FILE="$RUNNER_TEMP/frontend-format.log"
          elif [[ "${{ steps.frontend_vitest.outcome }}" != "success" ]]; then
            FAILED=1
            FAILED_STEP="Run Vitest"
            REPRO_COMMAND="npm --prefix projects/aimandala/toC/app/frontend test"
            SUMMARY_FILE="$RUNNER_TEMP/frontend-vitest.log"
          elif [[ "${{ steps.frontend_coverage.outcome }}" != "success" ]]; then
            FAILED=1
            KIND="coverage-failure"
            FAILED_STEP="Run Vitest Coverage"
            REPRO_COMMAND="npm --prefix projects/aimandala/toC/app/frontend run test:coverage"
            SUMMARY_FILE="$RUNNER_TEMP/frontend-coverage.log"
          elif [[ "${{ steps.frontend_typecheck.outcome }}" != "success" ]]; then
            FAILED=1
            FAILED_STEP="Run Typecheck"
            REPRO_COMMAND="npm --prefix projects/aimandala/toC/app/frontend run typecheck"
            SUMMARY_FILE="$RUNNER_TEMP/frontend-typecheck.log"
          elif [[ "${{ steps.frontend_build.outcome }}" != "success" ]]; then
            FAILED=1
            KIND="build-failure"
            FAILED_STEP="Run Mobile Web Build"
            REPRO_COMMAND="npm --prefix projects/aimandala/toC/app/frontend run build:mobile-web"
            SUMMARY_FILE="$RUNNER_TEMP/frontend-build.log"
          fi

          printf 'failed=%s\n' "$FAILED" >> "$GITHUB_OUTPUT"
          printf 'kind=%s\n' "$KIND" >> "$GITHUB_OUTPUT"
          printf 'failed_step=%s\n' "$FAILED_STEP" >> "$GITHUB_OUTPUT"
          printf 'repro_command=%s\n' "$REPRO_COMMAND" >> "$GITHUB_OUTPUT"
          printf 'summary_file=%s\n' "$SUMMARY_FILE" >> "$GITHUB_OUTPUT"

      - name: Sync Frontend Paperclip Issue
        if: always()
        env:
          PAPERCLIP_API_BASE: ${{ secrets.PAPERCLIP_API_BASE }}
          PAPERCLIP_API_KEY: ${{ secrets.PAPERCLIP_API_KEY }}
          PAPERCLIP_ENGINEER_AGENT_ID: ${{ secrets.PAPERCLIP_ENGINEER_AGENT_ID }}
        run: |
          set -euo pipefail
          PAPERCLIP_BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          SYNC_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          RESULT="resolved"
          if [[ "${{ steps.frontend_result.outputs.failed }}" == "1" ]]; then
            RESULT="failed"
          fi
          node shared/tools/ci/paperclip-ci-issue.mjs \
            --soft-fail \
            --company-id "$PAPERCLIP_COMPANY_ID" \
            --project-name "$PAPERCLIP_PROJECT_NAME" \
            --execution-adapter "github-actions/self-hosted-runner:ci" \
            --kind "${{ steps.frontend_result.outputs.kind }}" \
            --workflow "ci" \
            --repository "${{ github.repository }}" \
            --branch "$PAPERCLIP_BRANCH" \
            --job "frontend-quality" \
            --sha "${{ github.event.pull_request.head.sha || github.sha }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --event-time "$SYNC_TIME" \
            --commit-parent \
            --failed-step "${{ steps.frontend_result.outputs.failed_step }}" \
            --repro-command "${{ steps.frontend_result.outputs.repro_command }}" \
            --summary-file "${{ steps.frontend_result.outputs.summary_file }}" \
            --result "$RESULT" \
            --owner-agent-id "$PAPERCLIP_ENGINEER_AGENT_ID" \
            --owner-label "Engineer"

      - name: Fail Frontend Job
        if: steps.frontend_result.outputs.failed == '1'
        run: exit 1

  backend-quality:
    name: backend-quality
    if: github.event_name != 'push' || github.ref_name != 'aimandala/dev'
    runs-on:
      - self-hosted
      - linux
      - mindsync-ci
      - aimandala
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Python
        id: backend_setup_python
        continue-on-error: true
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify Python Runtime
        id: backend_python
        run: |
          set -euo pipefail
          PYTHON_BIN="${{ steps.backend_setup_python.outputs.python-path }}"
          if [[ -z "${PYTHON_BIN}" || ! -x "${PYTHON_BIN}" ]]; then
            PYTHON_BIN="$(command -v python || true)"
          fi
          if [[ -z "${PYTHON_BIN}" || ! -x "${PYTHON_BIN}" ]]; then
            PYTHON_BIN="$(command -v python3 || true)"
          fi
          if [[ -z "${PYTHON_BIN}" || ! -x "${PYTHON_BIN}" ]]; then
            echo "Unable to locate a usable Python runtime after setup-python" >&2
            exit 1
          fi
          printf 'python_bin=%s\n' "$PYTHON_BIN" >> "$GITHUB_OUTPUT"
          "$PYTHON_BIN" --version
          "$PYTHON_BIN" -m pip --version

      - name: Install Backend Dependencies
        id: backend_install
        continue-on-error: true
        run: |
          set -euo pipefail
          PYTHON_BIN="${{ steps.backend_python.outputs.python_bin }}" \
          bash shared/tools/ci/ensure-python-ci-venv.sh \
            projects/aimandala/toC/app/backend/requirements.release.txt \
            pytest ruff 2>&1 | tee "$RUNNER_TEMP/backend-install.log"

      - name: Run Ruff Check
        id: backend_ruff
        if: steps.backend_install.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          export PYTHONPATH=projects/aimandala/toC/app/backend
          "${{ steps.backend_install.outputs.venv_dir }}/bin/ruff" check \
            --config projects/aimandala/toC/app/backend/ruff.toml \
            projects/aimandala/toC/app/backend/app \
            projects/aimandala/toC/app/backend/tests \
            projects/aimandala/toC/app/backend/scripts 2>&1 | tee "$RUNNER_TEMP/backend-ruff.log"

      - name: Run Pytest
        id: backend_pytest
        if: steps.backend_ruff.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          export PYTHONPATH=projects/aimandala/toC/app/backend
          "${{ steps.backend_install.outputs.venv_dir }}/bin/python" -m pytest -q projects/aimandala/toC/app/backend/tests/unit 2>&1 | tee "$RUNNER_TEMP/backend-pytest.log"

      - name: Resolve Backend Result
        id: backend_result
        if: always()
        run: |
          set -euo pipefail
          FAILED=0
          KIND="ci-test-failure"
          FAILED_STEP=""
          REPRO_COMMAND=""
          SUMMARY_FILE=""

          if [[ "${{ steps.backend_python.outcome }}" != "success" ]]; then
            FAILED=1
            KIND="build-failure"
            FAILED_STEP="Verify Python Runtime"
            REPRO_COMMAND="python --version && python -m pip --version"
          elif [[ "${{ steps.backend_install.outcome }}" != "success" ]]; then
            FAILED=1
            KIND="build-failure"
            FAILED_STEP="Install Backend Dependencies"
            REPRO_COMMAND="PYTHON_BIN=python bash shared/tools/ci/ensure-python-ci-venv.sh projects/aimandala/toC/app/backend/requirements.release.txt pytest ruff"
            SUMMARY_FILE="$RUNNER_TEMP/backend-install.log"
          elif [[ "${{ steps.backend_ruff.outcome }}" != "success" ]]; then
            FAILED=1
            KIND="lint-failure"
            FAILED_STEP="Run Ruff Check"
            REPRO_COMMAND="PYTHONPATH=projects/aimandala/toC/app/backend ruff check --config projects/aimandala/toC/app/backend/ruff.toml projects/aimandala/toC/app/backend/app projects/aimandala/toC/app/backend/tests projects/aimandala/toC/app/backend/scripts"
            SUMMARY_FILE="$RUNNER_TEMP/backend-ruff.log"
          elif [[ "${{ steps.backend_pytest.outcome }}" != "success" ]]; then
            FAILED=1
            FAILED_STEP="Run Pytest"
            REPRO_COMMAND="PYTHONPATH=projects/aimandala/toC/app/backend pytest -q projects/aimandala/toC/app/backend/tests/unit"
            SUMMARY_FILE="$RUNNER_TEMP/backend-pytest.log"
          fi

          printf 'failed=%s\n' "$FAILED" >> "$GITHUB_OUTPUT"
          printf 'kind=%s\n' "$KIND" >> "$GITHUB_OUTPUT"
          printf 'failed_step=%s\n' "$FAILED_STEP" >> "$GITHUB_OUTPUT"
          printf 'repro_command=%s\n' "$REPRO_COMMAND" >> "$GITHUB_OUTPUT"
          printf 'summary_file=%s\n' "$SUMMARY_FILE" >> "$GITHUB_OUTPUT"

      - name: Sync Backend Paperclip Issue
        if: always()
        env:
          PAPERCLIP_API_BASE: ${{ secrets.PAPERCLIP_API_BASE }}
          PAPERCLIP_API_KEY: ${{ secrets.PAPERCLIP_API_KEY }}
          PAPERCLIP_ENGINEER_AGENT_ID: ${{ secrets.PAPERCLIP_ENGINEER_AGENT_ID }}
        run: |
          set -euo pipefail
          PAPERCLIP_BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          SYNC_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          RESULT="resolved"
          if [[ "${{ steps.backend_result.outputs.failed }}" == "1" ]]; then
            RESULT="failed"
          fi
          node shared/tools/ci/paperclip-ci-issue.mjs \
            --soft-fail \
            --company-id "$PAPERCLIP_COMPANY_ID" \
            --project-name "$PAPERCLIP_PROJECT_NAME" \
            --execution-adapter "github-actions/self-hosted-runner:ci" \
            --kind "${{ steps.backend_result.outputs.kind }}" \
            --workflow "ci" \
            --repository "${{ github.repository }}" \
            --branch "$PAPERCLIP_BRANCH" \
            --job "backend-quality" \
            --sha "${{ github.event.pull_request.head.sha || github.sha }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --event-time "$SYNC_TIME" \
            --commit-parent \
            --failed-step "${{ steps.backend_result.outputs.failed_step }}" \
            --repro-command "${{ steps.backend_result.outputs.repro_command }}" \
            --summary-file "${{ steps.backend_result.outputs.summary_file }}" \
            --result "$RESULT" \
            --owner-agent-id "$PAPERCLIP_ENGINEER_AGENT_ID" \
            --owner-label "Engineer"

      - name: Fail Backend Job
        if: steps.backend_result.outputs.failed == '1'
        run: exit 1

  knowledge-quality:
    name: knowledge-quality
    if: github.event_name != 'push' || github.ref_name != 'aimandala/dev'
    runs-on:
      - self-hosted
      - linux
      - mindsync-ci
      - aimandala
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Python
        id: knowledge_setup_python
        continue-on-error: true
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify Python Runtime
        id: knowledge_python
        run: |
          set -euo pipefail
          PYTHON_BIN="${{ steps.knowledge_setup_python.outputs.python-path }}"
          if [[ -z "${PYTHON_BIN}" || ! -x "${PYTHON_BIN}" ]]; then
            PYTHON_BIN="$(command -v python || true)"
          fi
          if [[ -z "${PYTHON_BIN}" || ! -x "${PYTHON_BIN}" ]]; then
            PYTHON_BIN="$(command -v python3 || true)"
          fi
          if [[ -z "${PYTHON_BIN}" || ! -x "${PYTHON_BIN}" ]]; then
            echo "Unable to locate a usable Python runtime after setup-python" >&2
            exit 1
          fi
          printf 'python_bin=%s\n' "$PYTHON_BIN" >> "$GITHUB_OUTPUT"
          "$PYTHON_BIN" --version
          "$PYTHON_BIN" -m pip --version

      - name: Install Knowledge Dependencies
        id: knowledge_install
        continue-on-error: true
        run: |
          set -euo pipefail
          PYTHON_BIN="${{ steps.knowledge_python.outputs.python_bin }}" \
          bash shared/tools/ci/ensure-python-ci-venv.sh \
            projects/aimandala/toC/app/backend/requirements.release.txt \
            pytest ruff 2>&1 | tee "$RUNNER_TEMP/knowledge-install.log"

      - name: Run Knowledge Validation
        id: knowledge_validate
        if: steps.knowledge_install.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          export PYTHONPATH=projects/aimandala/toC/app/backend
          "${{ steps.knowledge_install.outputs.venv_dir }}/bin/python" projects/aimandala/toC/app/backend/scripts/validate_knowledge_workbench.py 2>&1 | tee "$RUNNER_TEMP/knowledge-validate.log"

      - name: Run Knowledge Evals
        id: knowledge_evals
        if: steps.knowledge_validate.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          export PYTHONPATH=projects/aimandala/toC/app/backend
          "${{ steps.knowledge_install.outputs.venv_dir }}/bin/python" projects/aimandala/toC/app/backend/scripts/run_knowledge_evals.py --build-selector current 2>&1 | tee "$RUNNER_TEMP/knowledge-evals.log"

      - name: Resolve Knowledge Result
        id: knowledge_result
        if: always()
        run: |
          set -euo pipefail
          FAILED=0
          KIND="ci-test-failure"
          FAILED_STEP=""
          REPRO_COMMAND=""
          SUMMARY_FILE=""

          if [[ "${{ steps.knowledge_python.outcome }}" != "success" ]]; then
            FAILED=1
            KIND="build-failure"
            FAILED_STEP="Verify Python Runtime"
            REPRO_COMMAND="python --version && python -m pip --version"
          elif [[ "${{ steps.knowledge_install.outcome }}" != "success" ]]; then
            FAILED=1
            KIND="build-failure"
            FAILED_STEP="Install Knowledge Dependencies"
            REPRO_COMMAND="PYTHON_BIN=python bash shared/tools/ci/ensure-python-ci-venv.sh projects/aimandala/toC/app/backend/requirements.release.txt pytest ruff"
            SUMMARY_FILE="$RUNNER_TEMP/knowledge-install.log"
          elif [[ "${{ steps.knowledge_validate.outcome }}" != "success" ]]; then
            FAILED=1
            FAILED_STEP="Run Knowledge Validation"
            REPRO_COMMAND="PYTHONPATH=projects/aimandala/toC/app/backend python3 projects/aimandala/toC/app/backend/scripts/validate_knowledge_workbench.py"
            SUMMARY_FILE="$RUNNER_TEMP/knowledge-validate.log"
          elif [[ "${{ steps.knowledge_evals.outcome }}" != "success" ]]; then
            FAILED=1
            FAILED_STEP="Run Knowledge Evals"
            REPRO_COMMAND="PYTHONPATH=projects/aimandala/toC/app/backend python3 projects/aimandala/toC/app/backend/scripts/run_knowledge_evals.py --build-selector current"
            SUMMARY_FILE="$RUNNER_TEMP/knowledge-evals.log"
          fi

          printf 'failed=%s\n' "$FAILED" >> "$GITHUB_OUTPUT"
          printf 'kind=%s\n' "$KIND" >> "$GITHUB_OUTPUT"
          printf 'failed_step=%s\n' "$FAILED_STEP" >> "$GITHUB_OUTPUT"
          printf 'repro_command=%s\n' "$REPRO_COMMAND" >> "$GITHUB_OUTPUT"
          printf 'summary_file=%s\n' "$SUMMARY_FILE" >> "$GITHUB_OUTPUT"

      - name: Sync Knowledge Paperclip Issue
        if: always()
        env:
          PAPERCLIP_API_BASE: ${{ secrets.PAPERCLIP_API_BASE }}
          PAPERCLIP_API_KEY: ${{ secrets.PAPERCLIP_API_KEY }}
          PAPERCLIP_ENGINEER_AGENT_ID: ${{ secrets.PAPERCLIP_ENGINEER_AGENT_ID }}
        run: |
          set -euo pipefail
          PAPERCLIP_BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          SYNC_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          RESULT="resolved"
          if [[ "${{ steps.knowledge_result.outputs.failed }}" == "1" ]]; then
            RESULT="failed"
          fi
          node shared/tools/ci/paperclip-ci-issue.mjs \
            --soft-fail \
            --company-id "$PAPERCLIP_COMPANY_ID" \
            --project-name "$PAPERCLIP_PROJECT_NAME" \
            --execution-adapter "github-actions/self-hosted-runner:ci" \
            --kind "${{ steps.knowledge_result.outputs.kind }}" \
            --workflow "ci" \
            --repository "${{ github.repository }}" \
            --branch "$PAPERCLIP_BRANCH" \
            --job "knowledge-quality" \
            --sha "${{ github.event.pull_request.head.sha || github.sha }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --event-time "$SYNC_TIME" \
            --commit-parent \
            --failed-step "${{ steps.knowledge_result.outputs.failed_step }}" \
            --repro-command "${{ steps.knowledge_result.outputs.repro_command }}" \
            --summary-file "${{ steps.knowledge_result.outputs.summary_file }}" \
            --result "$RESULT" \
            --owner-agent-id "$PAPERCLIP_ENGINEER_AGENT_ID" \
            --owner-label "Engineer"

      - name: Fail Knowledge Job
        if: steps.knowledge_result.outputs.failed == '1'
        run: exit 1

  ci-summary:
    name: ci-summary
    if: always() && (github.event_name != 'push' || github.ref_name != 'aimandala/dev')
    needs:
      - workflow-quality
      - frontend-quality
      - backend-quality
      - knowledge-quality
    runs-on:
      - self-hosted
      - linux
      - mindsync-ci
      - aimandala
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Sync CI Commit Summary Issue
        env:
          PAPERCLIP_API_BASE: ${{ secrets.PAPERCLIP_API_BASE }}
          PAPERCLIP_API_KEY: ${{ secrets.PAPERCLIP_API_KEY }}
          PAPERCLIP_ENGINEER_AGENT_ID: ${{ secrets.PAPERCLIP_ENGINEER_AGENT_ID }}
        run: |
          set -euo pipefail
          PAPERCLIP_BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          SYNC_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          RESULT="resolved"
          FAILED_JOBS=()

          if [[ "${{ needs.workflow-quality.result }}" == "failure" ]]; then
            RESULT="failed"
            FAILED_JOBS+=("workflow-quality")
          fi
          if [[ "${{ needs.frontend-quality.result }}" == "failure" ]]; then
            RESULT="failed"
            FAILED_JOBS+=("frontend-quality")
          fi
          if [[ "${{ needs.backend-quality.result }}" == "failure" ]]; then
            RESULT="failed"
            FAILED_JOBS+=("backend-quality")
          fi
          if [[ "${{ needs.knowledge-quality.result }}" == "failure" ]]; then
            RESULT="failed"
            FAILED_JOBS+=("knowledge-quality")
          fi

          SUMMARY_FILE="$RUNNER_TEMP/ci-paperclip-summary.txt"
          {
            echo "workflow-quality=${{ needs.workflow-quality.result }}"
            echo "frontend-quality=${{ needs.frontend-quality.result }}"
            echo "backend-quality=${{ needs.backend-quality.result }}"
            echo "knowledge-quality=${{ needs.knowledge-quality.result }}"
            echo "result=${RESULT}"
          } > "$SUMMARY_FILE"

          EXTRA_ARGS=()
          for job in "${FAILED_JOBS[@]}"; do
            EXTRA_ARGS+=(--failed-job "$job")
          done

          node shared/tools/ci/paperclip-ci-issue.mjs \
            --soft-fail \
            --mode commit-summary \
            --company-id "$PAPERCLIP_COMPANY_ID" \
            --project-name "$PAPERCLIP_PROJECT_NAME" \
            --execution-adapter "github-actions/self-hosted-runner:ci" \
            --workflow "ci" \
            --repository "${{ github.repository }}" \
            --branch "$PAPERCLIP_BRANCH" \
            --sha "${{ github.event.pull_request.head.sha || github.sha }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --event-time "$SYNC_TIME" \
            --job-count "4" \
            --summary-file "$SUMMARY_FILE" \
            --result "$RESULT" \
            --owner-agent-id "$PAPERCLIP_ENGINEER_AGENT_ID" \
            --owner-label "Engineer" \
            "${EXTRA_ARGS[@]}"
