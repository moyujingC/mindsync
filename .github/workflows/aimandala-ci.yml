name: ci

on:
  pull_request:
    branches:
      - main
    paths:
      - "projects/aimandala/toC/**"
      - "projects/aimandala/fixtures/**"
      - "shared/tools/ci/**"
      - ".github/workflows/aimandala-ci.yml"
      - ".github/workflows/aimandala-auto-repair.yml"
  push:
    branches:
      - main
      - release
    paths:
      - "projects/aimandala/toC/**"
      - "projects/aimandala/fixtures/**"
      - "shared/tools/ci/**"
      - ".github/workflows/aimandala-ci.yml"
      - ".github/workflows/aimandala-auto-repair.yml"

concurrency:
  group: aimandala-ci-${{ github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PAPERCLIP_COMPANY_ID: "be191a6e-7447-4821-a93d-9114214c4a64"
  PAPERCLIP_PROJECT_NAME: "一镜一梳"

jobs:
  frontend-ci:
    name: frontend-ci
    runs-on:
      - self-hosted
      - linux
      - mindsync-ci
      - aimandala
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: projects/aimandala/toC/app/frontend/package-lock.json

      - name: Install Frontend Dependencies
        id: frontend_install
        continue-on-error: true
        run: |
          set -euo pipefail
          npm --prefix projects/aimandala/toC/app/frontend ci 2>&1 | tee "$RUNNER_TEMP/frontend-install.log"

      - name: Run Vitest
        id: frontend_vitest
        if: steps.frontend_install.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          npm --prefix projects/aimandala/toC/app/frontend test 2>&1 | tee "$RUNNER_TEMP/frontend-vitest.log"

      - name: Run Typecheck
        id: frontend_typecheck
        if: steps.frontend_vitest.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          npm --prefix projects/aimandala/toC/app/frontend run typecheck 2>&1 | tee "$RUNNER_TEMP/frontend-typecheck.log"

      - name: Run Mobile Web Build
        id: frontend_build
        if: steps.frontend_typecheck.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          npm --prefix projects/aimandala/toC/app/frontend run build:mobile-web 2>&1 | tee "$RUNNER_TEMP/frontend-build.log"

      - name: Resolve Frontend Result
        id: frontend_result
        if: always()
        run: |
          set -euo pipefail
          FAILED=0
          KIND="ci-test-failure"
          FAILED_STEP=""
          REPRO_COMMAND=""
          SUMMARY_FILE=""

          if [[ "${{ steps.frontend_install.outcome }}" != "success" ]]; then
            FAILED=1
            KIND="build-failure"
            FAILED_STEP="Install Frontend Dependencies"
            REPRO_COMMAND="npm --prefix projects/aimandala/toC/app/frontend ci"
            SUMMARY_FILE="$RUNNER_TEMP/frontend-install.log"
          elif [[ "${{ steps.frontend_vitest.outcome }}" != "success" ]]; then
            FAILED=1
            FAILED_STEP="Run Vitest"
            REPRO_COMMAND="npm --prefix projects/aimandala/toC/app/frontend test"
            SUMMARY_FILE="$RUNNER_TEMP/frontend-vitest.log"
          elif [[ "${{ steps.frontend_typecheck.outcome }}" != "success" ]]; then
            FAILED=1
            FAILED_STEP="Run Typecheck"
            REPRO_COMMAND="npm --prefix projects/aimandala/toC/app/frontend run typecheck"
            SUMMARY_FILE="$RUNNER_TEMP/frontend-typecheck.log"
          elif [[ "${{ steps.frontend_build.outcome }}" != "success" ]]; then
            FAILED=1
            KIND="build-failure"
            FAILED_STEP="Run Mobile Web Build"
            REPRO_COMMAND="npm --prefix projects/aimandala/toC/app/frontend run build:mobile-web"
            SUMMARY_FILE="$RUNNER_TEMP/frontend-build.log"
          fi

          printf 'failed=%s\n' "$FAILED" >> "$GITHUB_OUTPUT"
          printf 'kind=%s\n' "$KIND" >> "$GITHUB_OUTPUT"
          printf 'failed_step=%s\n' "$FAILED_STEP" >> "$GITHUB_OUTPUT"
          printf 'repro_command=%s\n' "$REPRO_COMMAND" >> "$GITHUB_OUTPUT"
          printf 'summary_file=%s\n' "$SUMMARY_FILE" >> "$GITHUB_OUTPUT"

      - name: Sync Frontend Paperclip Issue
        if: always()
        env:
          PAPERCLIP_API_BASE: ${{ secrets.PAPERCLIP_API_BASE }}
          PAPERCLIP_API_KEY: ${{ secrets.PAPERCLIP_API_KEY }}
          PAPERCLIP_ENGINEER_AGENT_ID: ${{ secrets.PAPERCLIP_ENGINEER_AGENT_ID }}
        run: |
          set -euo pipefail
          RESULT="resolved"
          if [[ "${{ steps.frontend_result.outputs.failed }}" == "1" ]]; then
            RESULT="failed"
          fi
          node shared/tools/ci/paperclip-ci-issue.mjs \
            --soft-fail \
            --company-id "$PAPERCLIP_COMPANY_ID" \
            --project-name "$PAPERCLIP_PROJECT_NAME" \
            --kind "${{ steps.frontend_result.outputs.kind }}" \
            --workflow "ci" \
            --repository "${{ github.repository }}" \
            --branch "${{ github.head_ref || github.ref_name }}" \
            --job "frontend-ci" \
            --sha "${{ github.event.pull_request.head.sha || github.sha }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --failed-step "${{ steps.frontend_result.outputs.failed_step }}" \
            --repro-command "${{ steps.frontend_result.outputs.repro_command }}" \
            --summary-file "${{ steps.frontend_result.outputs.summary_file }}" \
            --result "$RESULT" \
            --owner-agent-id "$PAPERCLIP_ENGINEER_AGENT_ID" \
            --owner-label "Engineer"

      - name: Fail Frontend Job
        if: steps.frontend_result.outputs.failed == '1'
        run: exit 1

  backend-ci:
    name: backend-ci
    runs-on:
      - self-hosted
      - linux
      - mindsync-ci
      - aimandala
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Backend Dependencies
        id: backend_install
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip 2>&1 | tee "$RUNNER_TEMP/backend-pip-upgrade.log"
          python3 -m pip install -r projects/aimandala/toC/app/backend/requirements.release.txt pytest 2>&1 | tee "$RUNNER_TEMP/backend-install.log"

      - name: Run Pytest
        id: backend_pytest
        if: steps.backend_install.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          export PYTHONPATH=projects/aimandala/toC/app/backend
          pytest -q projects/aimandala/toC/app/backend/tests/unit 2>&1 | tee "$RUNNER_TEMP/backend-pytest.log"

      - name: Resolve Backend Result
        id: backend_result
        if: always()
        run: |
          set -euo pipefail
          FAILED=0
          KIND="ci-test-failure"
          FAILED_STEP=""
          REPRO_COMMAND=""
          SUMMARY_FILE=""

          if [[ "${{ steps.backend_install.outcome }}" != "success" ]]; then
            FAILED=1
            KIND="build-failure"
            FAILED_STEP="Install Backend Dependencies"
            REPRO_COMMAND="python3 -m pip install -r projects/aimandala/toC/app/backend/requirements.release.txt pytest"
            SUMMARY_FILE="$RUNNER_TEMP/backend-install.log"
          elif [[ "${{ steps.backend_pytest.outcome }}" != "success" ]]; then
            FAILED=1
            FAILED_STEP="Run Pytest"
            REPRO_COMMAND="PYTHONPATH=projects/aimandala/toC/app/backend pytest -q projects/aimandala/toC/app/backend/tests/unit"
            SUMMARY_FILE="$RUNNER_TEMP/backend-pytest.log"
          fi

          printf 'failed=%s\n' "$FAILED" >> "$GITHUB_OUTPUT"
          printf 'kind=%s\n' "$KIND" >> "$GITHUB_OUTPUT"
          printf 'failed_step=%s\n' "$FAILED_STEP" >> "$GITHUB_OUTPUT"
          printf 'repro_command=%s\n' "$REPRO_COMMAND" >> "$GITHUB_OUTPUT"
          printf 'summary_file=%s\n' "$SUMMARY_FILE" >> "$GITHUB_OUTPUT"

      - name: Sync Backend Paperclip Issue
        if: always()
        env:
          PAPERCLIP_API_BASE: ${{ secrets.PAPERCLIP_API_BASE }}
          PAPERCLIP_API_KEY: ${{ secrets.PAPERCLIP_API_KEY }}
          PAPERCLIP_ENGINEER_AGENT_ID: ${{ secrets.PAPERCLIP_ENGINEER_AGENT_ID }}
        run: |
          set -euo pipefail
          RESULT="resolved"
          if [[ "${{ steps.backend_result.outputs.failed }}" == "1" ]]; then
            RESULT="failed"
          fi
          node shared/tools/ci/paperclip-ci-issue.mjs \
            --soft-fail \
            --company-id "$PAPERCLIP_COMPANY_ID" \
            --project-name "$PAPERCLIP_PROJECT_NAME" \
            --kind "${{ steps.backend_result.outputs.kind }}" \
            --workflow "ci" \
            --repository "${{ github.repository }}" \
            --branch "${{ github.head_ref || github.ref_name }}" \
            --job "backend-ci" \
            --sha "${{ github.event.pull_request.head.sha || github.sha }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --failed-step "${{ steps.backend_result.outputs.failed_step }}" \
            --repro-command "${{ steps.backend_result.outputs.repro_command }}" \
            --summary-file "${{ steps.backend_result.outputs.summary_file }}" \
            --result "$RESULT" \
            --owner-agent-id "$PAPERCLIP_ENGINEER_AGENT_ID" \
            --owner-label "Engineer"

      - name: Fail Backend Job
        if: steps.backend_result.outputs.failed == '1'
        run: exit 1

  knowledge-ci:
    name: knowledge-ci
    runs-on:
      - self-hosted
      - linux
      - mindsync-ci
      - aimandala
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Knowledge Dependencies
        id: knowledge_install
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip 2>&1 | tee "$RUNNER_TEMP/knowledge-pip-upgrade.log"
          python3 -m pip install -r projects/aimandala/toC/app/backend/requirements.release.txt pytest 2>&1 | tee "$RUNNER_TEMP/knowledge-install.log"

      - name: Run Knowledge Validation
        id: knowledge_validate
        if: steps.knowledge_install.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          export PYTHONPATH=projects/aimandala/toC/app/backend
          python3 projects/aimandala/toC/app/backend/scripts/validate_knowledge_workbench.py 2>&1 | tee "$RUNNER_TEMP/knowledge-validate.log"

      - name: Run Knowledge Evals
        id: knowledge_evals
        if: steps.knowledge_validate.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          export PYTHONPATH=projects/aimandala/toC/app/backend
          python3 projects/aimandala/toC/app/backend/scripts/run_knowledge_evals.py --build-selector current 2>&1 | tee "$RUNNER_TEMP/knowledge-evals.log"

      - name: Resolve Knowledge Result
        id: knowledge_result
        if: always()
        run: |
          set -euo pipefail
          FAILED=0
          KIND="ci-test-failure"
          FAILED_STEP=""
          REPRO_COMMAND=""
          SUMMARY_FILE=""

          if [[ "${{ steps.knowledge_install.outcome }}" != "success" ]]; then
            FAILED=1
            KIND="build-failure"
            FAILED_STEP="Install Knowledge Dependencies"
            REPRO_COMMAND="python3 -m pip install -r projects/aimandala/toC/app/backend/requirements.release.txt pytest"
            SUMMARY_FILE="$RUNNER_TEMP/knowledge-install.log"
          elif [[ "${{ steps.knowledge_validate.outcome }}" != "success" ]]; then
            FAILED=1
            FAILED_STEP="Run Knowledge Validation"
            REPRO_COMMAND="PYTHONPATH=projects/aimandala/toC/app/backend python3 projects/aimandala/toC/app/backend/scripts/validate_knowledge_workbench.py"
            SUMMARY_FILE="$RUNNER_TEMP/knowledge-validate.log"
          elif [[ "${{ steps.knowledge_evals.outcome }}" != "success" ]]; then
            FAILED=1
            FAILED_STEP="Run Knowledge Evals"
            REPRO_COMMAND="PYTHONPATH=projects/aimandala/toC/app/backend python3 projects/aimandala/toC/app/backend/scripts/run_knowledge_evals.py --build-selector current"
            SUMMARY_FILE="$RUNNER_TEMP/knowledge-evals.log"
          fi

          printf 'failed=%s\n' "$FAILED" >> "$GITHUB_OUTPUT"
          printf 'kind=%s\n' "$KIND" >> "$GITHUB_OUTPUT"
          printf 'failed_step=%s\n' "$FAILED_STEP" >> "$GITHUB_OUTPUT"
          printf 'repro_command=%s\n' "$REPRO_COMMAND" >> "$GITHUB_OUTPUT"
          printf 'summary_file=%s\n' "$SUMMARY_FILE" >> "$GITHUB_OUTPUT"

      - name: Sync Knowledge Paperclip Issue
        if: always()
        env:
          PAPERCLIP_API_BASE: ${{ secrets.PAPERCLIP_API_BASE }}
          PAPERCLIP_API_KEY: ${{ secrets.PAPERCLIP_API_KEY }}
          PAPERCLIP_ENGINEER_AGENT_ID: ${{ secrets.PAPERCLIP_ENGINEER_AGENT_ID }}
        run: |
          set -euo pipefail
          RESULT="resolved"
          if [[ "${{ steps.knowledge_result.outputs.failed }}" == "1" ]]; then
            RESULT="failed"
          fi
          node shared/tools/ci/paperclip-ci-issue.mjs \
            --soft-fail \
            --company-id "$PAPERCLIP_COMPANY_ID" \
            --project-name "$PAPERCLIP_PROJECT_NAME" \
            --kind "${{ steps.knowledge_result.outputs.kind }}" \
            --workflow "ci" \
            --repository "${{ github.repository }}" \
            --branch "${{ github.head_ref || github.ref_name }}" \
            --job "knowledge-ci" \
            --sha "${{ github.event.pull_request.head.sha || github.sha }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --failed-step "${{ steps.knowledge_result.outputs.failed_step }}" \
            --repro-command "${{ steps.knowledge_result.outputs.repro_command }}" \
            --summary-file "${{ steps.knowledge_result.outputs.summary_file }}" \
            --result "$RESULT" \
            --owner-agent-id "$PAPERCLIP_ENGINEER_AGENT_ID" \
            --owner-label "Engineer"

      - name: Fail Knowledge Job
        if: steps.knowledge_result.outputs.failed == '1'
        run: exit 1
