name: mvp-release

on:
  pull_request:
    branches:
      - main
      - release
    paths:
      - "projects/aimandala/toC/**"
      - "projects/aimandala/fixtures/**"
      - "shared/tools/ci/**"
      - ".github/workflows/mvp-release.yml"
  push:
    branches:
      - aimandala/dev
      - main
      - release
    paths:
      - "projects/aimandala/toC/**"
      - "projects/aimandala/fixtures/**"
      - "shared/tools/ci/**"
      - ".github/workflows/mvp-release.yml"
  workflow_dispatch:
    inputs:
      target:
        description: "Choose MVP deploy target"
        required: true
        type: choice
        options:
          - dev
          - prod
      smoke_mode:
        description: "Choose smoke depth"
        required: true
        default: basic
        type: choice
        options:
          - basic
          - deep

concurrency:
  group: mvp-release-${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.inputs.target || 'ci' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  AIMANDALA_FRONTEND_DIR: projects/aimandala/toC/app/frontend
  AIMANDALA_BACKEND_DIR: projects/aimandala/toC/app/backend

jobs:
  mvp-ci:
    name: mvp-ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ env.AIMANDALA_FRONTEND_DIR }}/package-lock.json

      - name: Install Frontend Dependencies
        run: npm --prefix "$AIMANDALA_FRONTEND_DIR" ci

      - name: Run Frontend Lint
        run: npm --prefix "$AIMANDALA_FRONTEND_DIR" run lint

      - name: Run Frontend Typecheck
        run: npm --prefix "$AIMANDALA_FRONTEND_DIR" run typecheck

      - name: Run Frontend Tests
        run: npm --prefix "$AIMANDALA_FRONTEND_DIR" test

      - name: Build Frontend
        run: npm --prefix "$AIMANDALA_FRONTEND_DIR" run build:mobile-web

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ${{ env.AIMANDALA_BACKEND_DIR }}/requirements.release.txt

      - name: Install Backend Dependencies
        id: backend_install
        env:
          PYTHON_BIN: python
        run: |
          bash shared/tools/ci/ensure-python-ci-venv.sh \
            "$AIMANDALA_BACKEND_DIR/requirements.release.txt" \
            pytest \
            ruff

      - name: Run Backend Lint
        env:
          PYTHONPATH: ${{ env.AIMANDALA_BACKEND_DIR }}
        run: |
          "${{ steps.backend_install.outputs.venv_dir }}/bin/ruff" check \
            --config "$AIMANDALA_BACKEND_DIR/ruff.toml" \
            "$AIMANDALA_BACKEND_DIR/app" \
            "$AIMANDALA_BACKEND_DIR/tests" \
            "$AIMANDALA_BACKEND_DIR/scripts"

      - name: Run Backend Unit Tests
        env:
          PYTHONPATH: ${{ env.AIMANDALA_BACKEND_DIR }}
        run: |
          "${{ steps.backend_install.outputs.venv_dir }}/bin/python" -m pytest -q \
            "$AIMANDALA_BACKEND_DIR/tests/unit"

  mvp-deploy:
    name: mvp-deploy
    needs:
      - mvp-ci
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: ${{ github.event.inputs.target == 'prod' && 'production' || 'development' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Resolve Deploy Target
        id: target
        run: |
          set -euo pipefail
          if [[ "${{ github.event.inputs.target }}" == "prod" ]]; then
            if [[ "${{ github.ref_name }}" != "release" ]]; then
              echo "Production MVP deploy must be dispatched from the release branch." >&2
              exit 1
            fi
            printf 'ssh_key_secret=AIMANDALA_PROD_SSH_KEY\n' >> "$GITHUB_OUTPUT"
            printf 'ssh_host_secret=AIMANDALA_PROD_HOST\n' >> "$GITHUB_OUTPUT"
            printf 'ssh_user_secret=AIMANDALA_PROD_USER\n' >> "$GITHUB_OUTPUT"
            printf 'branch=release\n' >> "$GITHUB_OUTPUT"
            printf 'remote_dir=/opt/aimandala-release/app/mindsync\n' >> "$GITHUB_OUTPUT"
            printf 'deploy_command=cd projects/aimandala/deploy/docker && docker compose -f docker-compose.release.yml --env-file .env.release build && docker compose -f docker-compose.release.yml --env-file .env.release up -d\n' >> "$GITHUB_OUTPUT"
          else
            if [[ "${{ github.ref_name }}" != "main" ]]; then
              echo "Development MVP deploy must be dispatched from the main branch." >&2
              exit 1
            fi
            printf 'ssh_key_secret=AIMANDALA_DEV_SSH_KEY\n' >> "$GITHUB_OUTPUT"
            printf 'ssh_host_secret=AIMANDALA_DEV_HOST\n' >> "$GITHUB_OUTPUT"
            printf 'ssh_user_secret=AIMANDALA_DEV_USER\n' >> "$GITHUB_OUTPUT"
            printf 'branch=main\n' >> "$GITHUB_OUTPUT"
            printf 'remote_dir=/opt/aimandala-main/app/mindsync\n' >> "$GITHUB_OUTPUT"
            printf 'deploy_command=/opt/aimandala-main/scripts/deploy-main.sh\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare SSH Key
        env:
          SSH_KEY: ${{ github.event.inputs.target == 'prod' && secrets.AIMANDALA_PROD_SSH_KEY || secrets.AIMANDALA_DEV_SSH_KEY }}
          SSH_HOST: ${{ github.event.inputs.target == 'prod' && secrets.AIMANDALA_PROD_HOST || secrets.AIMANDALA_DEV_HOST }}
          SSH_USER: ${{ github.event.inputs.target == 'prod' && secrets.AIMANDALA_PROD_USER || secrets.AIMANDALA_DEV_USER }}
        run: |
          set -euo pipefail
          if [[ -z "${SSH_KEY:-}" || -z "${SSH_HOST:-}" || -z "${SSH_USER:-}" ]]; then
            echo "Missing required AIMANDALA_${{ github.event.inputs.target == 'prod' && 'PROD' || 'DEV' }} SSH secret" >&2
            exit 1
          fi
          install -m 700 -d ~/.ssh
          normalized_key="$(printf '%s' "$SSH_KEY" | tr -d '\r')"
          if printf '%s' "$normalized_key" | grep -q 'BEGIN .*PRIVATE KEY'; then
            printf '%s\n' "$normalized_key" > ~/.ssh/aimandala_mvp
          else
            printf '%s' "$normalized_key" | base64 --decode > ~/.ssh/aimandala_mvp
          fi
          chmod 600 ~/.ssh/aimandala_mvp
          ssh-keygen -y -f ~/.ssh/aimandala_mvp >/dev/null
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Deploy Remote
        env:
          SSH_HOST: ${{ github.event.inputs.target == 'prod' && secrets.AIMANDALA_PROD_HOST || secrets.AIMANDALA_DEV_HOST }}
          SSH_USER: ${{ github.event.inputs.target == 'prod' && secrets.AIMANDALA_PROD_USER || secrets.AIMANDALA_DEV_USER }}
          DEPLOY_BRANCH: ${{ steps.target.outputs.branch }}
          REMOTE_DIR: ${{ steps.target.outputs.remote_dir }}
          DEPLOY_COMMAND: ${{ steps.target.outputs.deploy_command }}
        run: |
          set -euo pipefail
          ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -i ~/.ssh/aimandala_mvp \
            "$SSH_USER@$SSH_HOST" \
            "set -euo pipefail
             cd '$REMOTE_DIR'
             git fetch origin '$DEPLOY_BRANCH'
             git reset --hard 'origin/$DEPLOY_BRANCH'
             $DEPLOY_COMMAND"

      - name: Smoke Check With Retry
        env:
          TARGET: ${{ github.event.inputs.target }}
          SMOKE_MODE: ${{ github.event.inputs.smoke_mode }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if node shared/tools/ci/aimandala-smoke.mjs \
              --env "$TARGET" \
              --mode "$SMOKE_MODE" \
              --output "$RUNNER_TEMP/mvp-smoke.json"; then
              exit 0
            fi
            if [[ "$attempt" == "6" ]]; then
              exit 1
            fi
            sleep 10
          done
