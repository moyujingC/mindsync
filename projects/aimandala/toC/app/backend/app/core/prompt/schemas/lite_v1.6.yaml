version: "1.6"
type: "lite"
description: "一镜 Lite 版解读报告 - 自我理解报告兼容结构"
canonical_report_type: "self_understanding_report"
compatibility_shell: "lite_v1.6"

fields:
  - name: title
    type: string
    required: true
    semantic_role: "title"
  - name: overall_impression
    type: string
    required: true
    semantic_role: "opening_hit"
  - name: visual_elements
    type: string
    required: true
    semantic_role: "visual_evidence.summary"
  - name: emotion_portrait
    type: string
    required: true
    semantic_role: "state_interpretation"
  - name: story
    type: object
    required: true
    semantic_role: "state_and_pattern_details"
  - name: theme_scene
    type: string
    required: true
    semantic_role: "theme_insights.scene"
  - name: theme_impact
    type: string
    required: true
    semantic_role: "theme_insights.impact"
  - name: theme_awareness
    type: string
    required: true
    semantic_role: "theme_insights.awareness / next_step.direction"
  - name: three_awareness
    type: array
    required: true
    semantic_role: "daily_awareness"
  - name: pro_teaser
    type: string
    required: true
    semantic_role: "follow_up_teaser"
