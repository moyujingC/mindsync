id: healing.mother_relationship
type: healing
version: v2.1
status: active
source: legacy_v2_python
review_status: migrated
payload:
  theme_id: mother_relationship
  healing_prescriptions:
    issue_types:
      情感缺失:
        symptoms: 对母爱有深层渴望，但难以感受和表达爱。情感内敛，亲密关系中常感不被爱，逃避深层情感交流
        mandala_prescription: 绘制以粉色、浅红色为主的曼陀罗，中心可加入黄色，每日冥想15分钟，连续练习约三周
        daily_practice: 每天写下3件感恩母亲的事（即使是小事），或想象母亲温暖拥抱自己
        cognitive_upgrade: 认识到母爱并非只有一种形式，学会从其他关系中感受爱，并自我滋养
      安全感不足:
        symptoms: 缺乏内在稳定感，对亲密关系不信任，容易焦虑。难以从母亲处获得力量，对母亲有抱怨
        mandala_prescription: 绘制以黄色、褐色为主的曼陀罗，外圈可加入蓝色，每日冥想20分钟，持续30天
        daily_practice: 每天进行接地气练习（如赤脚踩地），或拥抱自己，对自己说'我是安全的'
        cognitive_upgrade: 理解安全感源于内在，而非完全依赖外部，培养自我安抚能力
      边界模糊:
        symptoms: 容易被母亲情绪影响，或在亲密关系中失去自我。为母亲情绪负责，难以区分彼此情绪
        mandala_prescription: 绘制以绿色、白色为主的曼陀罗，强调清晰的线条和分隔，每日冥想15分钟，连续练习约三周
        daily_practice: 每天练习说'不'，或写下自己的需求和界限，并尝试表达
        cognitive_upgrade: 认识到健康边界是爱而非拒绝，保护自我才能更好地爱他人
      自我价值低:
        symptoms: 在母亲面前感到自卑，难以肯定自我，缺乏主见。容易妥协，在母亲面前难以拒绝
        mandala_prescription: 绘制以金色、白色为主的曼陀罗，中心可加入绿色，每日冥想15分钟，连续练习约三周
        daily_practice: 每天写下3个自己的优点，或做一件让自己感到有成就感的事
        cognitive_upgrade: 认识到自我价值与母亲的评价无关，每个人都是独特的、有价值的
      情绪冲突:
        symptoms: 与母亲互动中容易爆发激烈冲突，爱恨交织。情绪波动大，争吵频繁，但过后又快速和好
        mandala_prescription: 绘制以蓝色、绿色为主的曼陀罗，中心可加入少量红色，每日冥想20分钟，持续30天
        daily_practice: 每次冲突后，尝试写下自己的感受和母亲的可能感受，练习换位思考
        cognitive_upgrade: 理解冲突背后是未被满足的需求，学习以非暴力沟通方式表达
      过度依赖:
        symptoms: 难以独立决策，事事征求母亲意见，缺乏自主性。依赖母亲做选择，容易被母亲影响
        mandala_prescription: 绘制以绿色、蓝色为主的曼陀罗，强调向外扩展的图案，每日冥想15分钟，连续练习约三周
        daily_practice: 每天尝试独立完成一项任务，并为自己的决定负责
        cognitive_upgrade: 认识到独立是成长的必经之路，母亲的爱是支持而非束缚
      情感压抑:
        symptoms: 难以表达真实情感，与母亲关系疏远，内心孤独。情感交流不畅，沟通障碍，情感隔阂
        mandala_prescription: 绘制以蓝色、黑色为主的曼陀罗，图案可选择流动性强的，每日冥想15分钟，连续练习约三周
        daily_practice: 每天写日记记录情绪，或尝试与信任的朋友分享感受
        cognitive_upgrade: 认识到情感表达是连接的桥梁，允许自己感受和表达情绪
  healing_template:
    duration_days: 30
    phases:
    - phase: 1
      days: 1-10
      theme: 觉察与母亲的关系模式
      color: 绿色
      frequency: 每天7张
    - phase: 2
      days: 11-20
      theme: 释放对母亲的复杂情绪
      color: 蓝色+黑色
      frequency: 每天7-14张
    - phase: 3
      days: 21-30
      theme: 建立健康的边界与连接
      color: 黄色+绿色
      frequency: 每天3-7张
relations:
  theme: theme.mother_relationship
