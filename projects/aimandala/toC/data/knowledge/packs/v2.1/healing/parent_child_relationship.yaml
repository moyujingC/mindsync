id: healing.parent_child_relationship
type: healing
version: v2.1
status: active
source: legacy_v2_python
review_status: migrated
payload:
  theme_id: parent_child_relationship
  healing_prescriptions:
    issue_types:
      养育焦虑与控制欲:
        name: 养育焦虑与控制欲
        symptoms: 父母对孩子过度担忧，事无巨细地干预，孩子感到窒息
        mandala_prescription: 绘制以黄色和蓝色为主的曼陀罗，黄色居中，蓝色在外圈，象征稳定与流动。建议连续练习约三周。
        daily_practice: 每天冥想5分钟，想象孩子在阳光下自由奔跑，感受放手的轻松。
        cognitive_upgrade: 认识到孩子是独立的个体，父母的责任是引导而非控制，放手是最大的爱。
      代际创伤传递:
        name: 代际创伤传递
        symptoms: 父母将自身未解决的童年创伤投射到孩子身上，重复不良模式
        mandala_prescription: 绘制以紫色和金色为主的曼陀罗，紫色居中，金色在外圈，象征转化与智慧。持续28天。
        daily_practice: 每天写日记，记录自己与父母的互动模式，反思对孩子的影响，并尝试改变。
        cognitive_upgrade: 意识到创伤并非宿命，通过自我疗愈打破循环，为孩子创造新的健康模式。
      亲子沟通模式障碍:
        name: 亲子沟通模式障碍
        symptoms: 亲子间缺乏有效沟通，情感隔阂，孩子不愿与父母分享
        mandala_prescription: 绘制以蓝色和绿色为主的曼陀罗，蓝色居中，绿色在外圈，象征沟通与成长。持续14天。
        daily_practice: 每天与孩子进行10分钟的'心语时间'，倾听孩子，不评判，只陪伴。
        cognitive_upgrade: 认识到沟通是双向的，父母需放下身段，以平等的姿态与孩子交流，建立信任。
      对孩子的期待与失望:
        name: 对孩子的期待与失望
        symptoms: 父母对孩子有不切实际的期望，当孩子达不到时感到失望，并施加压力
        mandala_prescription: 绘制以白色和粉色为主的曼陀罗，白色居中，粉色在外圈，象征接纳与无条件爱。建议连续练习约三周。
        daily_practice: 每天写下孩子3个优点，并真诚地赞美孩子，关注孩子的努力而非结果。
        cognitive_upgrade: 认识到每个孩子都是独一无二的，接纳孩子的不完美，无条件的爱是孩子成长的基石。
      孩子缺乏独立性/自信:
        name: 孩子缺乏独立性/自信
        symptoms: 孩子过度依赖父母，缺乏自主决策能力，或因父母批评而自卑
        mandala_prescription: 绘制以绿色和橙色为主的曼陀罗，绿色居中，橙色在外圈，象征生命力与行动。持续28天。
        daily_practice: 每天给孩子一个自主选择的机会（如穿什么衣服），并鼓励孩子尝试新事物。
        cognitive_upgrade: 认识到独立性和自信心是孩子未来发展的关键，父母需提供支持和鼓励，而非包办和批评。
  healing_template:
    duration_days: 30
    phases:
    - phase: 1
      days: 1-10
      theme: 觉察亲子互动模式
      color: 绿色
      frequency: 每天7张
    - phase: 2
      days: 11-20
      theme: 疗愈自身童年创伤
      color: 黑色+蓝色
      frequency: 每天7-14张
    - phase: 3
      days: 21-30
      theme: 建立健康亲子关系
      color: 黄色+绿色
      frequency: 每天3-7张
relations:
  theme: theme.parent_child_relationship
