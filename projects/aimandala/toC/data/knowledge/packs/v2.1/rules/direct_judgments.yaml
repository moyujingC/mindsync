id: rule.direct_judgments
type: rule
version: v2.1
status: active
source: projects/aimandala/docs/sources/知识库构建/原始镜像/00_kb_md/05_direct_judgments.md
review_status: source_aligned
payload:
  source_of_truth:
    path: projects/aimandala/docs/sources/知识库构建/原始镜像/00_kb_md/05_direct_judgments.md
    title: 直断特征 - 快速识别关键心理特征
    note: 直断知识只以此 Markdown 为原始真值源；本 YAML 是运行时知识包投影。
  catalog_version: direct_judgments.v2.1
  usage:
    stage: stage-04-direct-judgment-high-hit-check
    purpose: 检查画作是否命中高命中特征，作为后续逐圈解读的提示线索。
    boundary: 直断结果不是最终结论，必须被逐圈颜色、形状、五行生克和能量流动继续验证。
  judgments:
  - id: direct_judgment.full_dark_coloring
    name: 涂色很满深色为主
    visual_pattern: 画面整体涂得很满，深色为主
    meaning: 焦虑担忧的情绪，除了焦虑还有恐惧
    detail: 可能处于压力较大的状态，需要情绪释放的出口
    suggestion: 建议进行情绪疏导，找到安全的表达方式
    severity: 高
    evidence_requirements:
    - 整体填色密度高
    - 主色或大面积色块偏深
  - id: direct_judgment.pale_overall
    name: 整体泛白颜色偏淡
    visual_pattern: 整体泛白，颜色偏淡
    meaning: 做事无力量感，喜欢躺平
    detail: 可能与父亲关系疏远，或母亲强势导致父亲没有力量
    suggestion: 重建自我价值感，找到内在动力源
    severity: 中
    evidence_requirements:
    - 整体留白或浅色占比较高
    - 主要颜色饱和度偏低
  - id: direct_judgment.large_yellow_worrying
    name: 思虑过重喜好操心
    visual_pattern: 大面积黄色
    meaning: 思虑过重，喜好操心
    detail: 黄色代表'思'，生活中很照顾别人，像太阳一样温暖。但面积过大代表思虑过度，把心思放在别人身上
    suggestion: 学会平衡自我关怀与照顾他人
    severity: 中
    evidence_requirements:
    - 黄色在整体或某一圈中面积显著
  - id: direct_judgment.blue_green_sharing
    name: 喜欢分享开口来财
    visual_pattern: 明显有蓝色+绿色
    meaning: 喜欢分享，开口来财
    detail: 蓝色代表喉轮，绿色代表心轮，代表愿意敞开与他人分享，在优秀的表达力和共情力下更容易开口来财
    suggestion: 保持开放心态，善用沟通能力
    severity: 积极
    evidence_requirements:
    - 蓝色和绿色同时明显出现
  - id: direct_judgment.outer_red_spending
    name: 入不敷出热情奔放
    visual_pattern: 外圈有成片红色（相邻色非绿色）
    meaning: 入不敷出，热情奔放
    detail: 曼陀罗外圈有一圈成片红色，红色属火，意味着燃烧，引申为入不敷出
    suggestion: 注意能量管理，平衡付出与收获
    severity: 中
    evidence_requirements:
    - 外圈存在成片红色
    - 红色相邻区域不是绿色为主
  - id: direct_judgment.outer_colorful_fragmented
    name: 关注外表过手财神
    visual_pattern: 外圈颜色五颜六色、零零碎碎、花边
    meaning: 关注外表，过手财神
    detail: 爱美、爱打扮、要面子，容易做'过手财神'（钱来得快去得也快）
    suggestion: 关注内在价值，建立健康的财富观
    severity: 中
    evidence_requirements:
    - 外圈颜色丰富
    - 外圈呈现零碎、花边或装饰性强的结构
  - id: direct_judgment.inner_outer_same
    name: 表里如一
    visual_pattern: 内圈和外圈颜色完全一致
    meaning: 表里如一
    detail: 内外一致，真实坦诚，不伪装
    suggestion: 保持这份真实，同时学会适当保护自己
    severity: 积极
    evidence_requirements:
    - 内圈和外圈主色或核心色高度一致
  - id: direct_judgment.large_whitespace_silence
    name: 不想说啥无声沉默
    visual_pattern: 整张留白较多
    meaning: 不想说啥，无声沉默
    detail: 对于世界没有什么想要表达的东西，感知力较弱。或者曾经的表达不被看见后对这个世界有所保留或失望
    suggestion: 找到安全的表达方式，逐步重建表达信心
    severity: 中
    evidence_requirements:
    - 整张画留白比例较高
  - id: direct_judgment.closed_heart
    name: 心门关闭
    visual_pattern: 外圈留白多，但里圈或中圈涂的颜色3个以上
    meaning: 心门关闭
    detail: 对外界不热情，自己有想法，只是对外界有防备
    suggestion: 探索防备的原因，在安全的关系中尝试开放
    severity: 中
    evidence_requirements:
    - 外圈留白多
    - 内圈或中圈颜色数量不少于3种
  color_depth_rules:
    深色:
      threshold: 颜色饱和度高，接近色卡深色区
      indicators:
      - 力量感强
      - 情绪浓烈
      - 可能压抑
    浅色:
      threshold: 颜色饱和度低，接近色卡浅色区
      indicators:
      - 力量感弱
      - 情绪柔和
      - 可能逃避
    混合:
      threshold: 深浅色都有
      indicators:
      - 情绪复杂
      - 内外不一致
      - 正在整合
  whitespace_rules:
    大量留白:
      threshold: whitespace_ratio > 0.4
      meaning: 保留空间，可能缺乏表达欲或对世界失望
      inner_meaning: 内在空虚或不愿面对
      outer_meaning: 对外在世界保持距离
    适量留白:
      threshold: 0.15 < whitespace_ratio <= 0.4
      meaning: 平衡状态，有表达也有空间
    少量留白:
      threshold: 0.05 < whitespace_ratio <= 0.15
      meaning: 充分表达，可能追求完美或焦虑
      inner_meaning: 内在丰富，自我要求高
      outer_meaning: 积极与外界互动
    无留白:
      threshold: whitespace_ratio <= 0.05
      meaning: 完全填满，可能有控制欲或焦虑
      inner_meaning: 害怕空虚，需要填满一切
      outer_meaning: 想要掌控所有空间
