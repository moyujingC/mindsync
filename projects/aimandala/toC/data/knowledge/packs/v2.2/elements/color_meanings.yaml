id: element.color_meanings
type: element
version: v2.2
status: active
source: legacy_v2_python
review_status: migrated
payload:
  color_meanings:
    木:
      element: 木
      color_names:
      - 绿色
      nature: 生长、向上、独立
      virtue: 仁
      organs: 肝胆、筋骨、眼睛、腿脚
      normal_traits: 偏直觉型，耿直，固执，独立，会有自己的界限和空间感；有生机，要求阳光，积极，乐观，向上；喜欢成长，爱学习，爱精进；三观正，讲仁义，愿意付出，结果能够与人分享
      too_much_traits: 因为要一路向上发展，听不进去别人意见，评判心多，容易自我批评，批评他人，容易暴躁，固执。像野草一样，自私，侵占，野蛮生长，掠夺式生长
      too_little_traits: 有怨气，嫉妒不仁，郁闷，忧郁，憋闷。在情感方面，自我内在力量不足，安全感不足，容易依赖他人。在财富方面，做事信心不够，抗压力不强，过于谨慎，肝胆气不足，精神不济，行动力不足，容易疲惫
      shades:
        深绿:
          name: 深绿/墨绿
          intensity: 浓郁
          intensity_desc: 能量集中，特征明显，力量感强
          texture_note: 均匀代表专注、专业、有深度；斑驳代表伤痛、压抑需关注
          core_meaning: 能量浓郁集中，有深度和主见，可能显得固执
          keywords:
          - 深度
          - 专注
          - 主见
          - 力量感
          circles:
            内圈:
              interpretation: 深绿色在内圈，说明绘画者内在有自己的一套思想体系，比较能抱元守一。如果颜色均匀，代表专注、有深度、有才华；如果颜色斑驳，可能代表内在有伤痛或忧郁，容易变得固执，思维比较一根筋。也可能代表对自身要求和期待都比较高，但现实中容易受挫，容易对自我有评判
              manifestations:
              - 有自己的思想体系
              - 专注深入
              - 可能固执
              - 高要求
              healing: 将深度和专注转化为优势，学会接纳不完美，减少自我评判
            中圈:
              interpretation: 绘画者近期能量集中，有自己的主见。如果颜色均匀，代表专业、有担当；如果颜色斑驳，可能感到不被理解、孤独，或对亲近人有评判，觉得他人跟不上自己
              manifestations:
              - 有主见
              - 专业担当
              - 可能孤独感
              - 高标准
              healing: 欣赏自己的深度，同时学会欣赏他人的节奏，建立更包容的关系
            外圈:
              interpretation: 外人看来，绘画者有担当、有专业度。如果颜色均匀，代表在专业领域有深度；如果显得过于强势，可能会给人不易接近的感觉。也可能说明领导或环境对他有期待或压力
              manifestations:
              - 有担当
              - 专业度
              - 可能需要柔和表达
              healing: 保持专业度的同时，学习更柔和的沟通方式
        中绿:
          name: 中绿/翠绿
          intensity: 适中
          intensity_desc: 能量平和流动，平衡发展
          texture_note: 均匀代表健康稳定；有变化代表正在调整中
          core_meaning: 能量平和，积极向上，有清晰边界
          keywords:
          - 平和
          - 信心
          - 成长
          - 希望
          circles:
            内圈:
              interpretation: 能量比较平和。如果中绿是在内圈，说明绘画者开始有了更多信心和独立的想法，想要向上成长，对未来、对自己有了更多的希望，能自己给自己生机
              manifestations:
              - 信心增加
              - 独立想法
              - 向上成长
              - 自我激励
              healing: 继续保持这种健康的独立状态，在成长中保持平衡
            中圈:
              interpretation: 绘画者近期能量比较积极向上，积极的精神容易感染到身边的人。也可能代表他比较喜欢独处，在家里要有一定的空间感和界限感，与他人相处比较有界限，彼此尊重对方，独立性比较强，能力不错
              manifestations:
              - 积极向上
              - 喜欢独处
              - 有界限感
              - 独立性强
              healing: 继续保持健康的边界，在独处和社交中找到平衡
            外圈:
              interpretation: 外人会认为他三观正，积极向上，爱学习爱成长，独立性强，愿意付出和分享，乐于助人，对他的风评都很好
              manifestations:
              - 三观正
              - 积极向上
              - 独立
              - 愿意付出
              healing: 继续保持这份积极向上的状态，同时关注内在需求
        淡绿:
          name: 淡绿/嫩绿
          intensity: 柔和
          intensity_desc: 能量轻柔，正在成长发展中
          texture_note: 均匀代表温柔平和；有变化代表还在探索中
          core_meaning: 能量轻柔，处于成长阶段，需要支持和滋养
          keywords:
          - 嫩芽
          - 希望
          - 成长中
          - 柔和
          circles:
            内圈:
              interpretation: 像嫩芽，嫩草，淡绿色的力量相对弱一些，它没有中绿色那么强的生机，但也没有深绿色那样的固执和评判。淡绿在里圈，绘画者可能经历过黑暗的过往，迎来了春天，内心有了一些对自己对生活的希望，但还不敢完全相信他会好起来，容易经历反复，勇气和力量相对较弱，需要被保护，被周围人认可和呵护。也可能绘画者本身内在力量不足，信心不够，有些自卑，习惯依赖他人，把力量外放在他人身上
              manifestations:
              - 经历黑暗后迎来希望
              - 信心不足
              - 容易反复
              - 习惯依赖
              healing: 建立内在安全感，逐步培养独立意识，减少对外部认可的依赖
            中圈:
              interpretation: 绘画者与人相处时容易讨好对方，依赖对方，希望对方给予自己更多安全感和爱，自己缺乏主心骨和主见，遇到选择时会优柔寡断，期待别人给自己选择或者答案。会害怕冲突，遇到问题时容易逃避
              manifestations:
              - 讨好
              - 依赖
              - 优柔寡断
              - 害怕冲突
              healing: 建立内在主心骨，学习独立做决定，从小事开始建立自信
            外圈:
              interpretation: 别人觉得他很好相处，活泼可爱，他自己却没有信心，对自身能力不自信，需要获得他人的认可来补充信心，做事会有比较多顾虑，会考虑是否满足别人的期待和标准，想要向上成长但内在力量不足，很难持续给自己鼓劲，行动力相对比较弱，需要更多坚韧的力量，需要历经更多的打磨
              manifestations:
              - 好相处
              - 缺乏自信
              - 顾虑多
              - 行动力弱
              healing: 从自我认可开始，逐步建立内在信心，减少对外部评价的依赖
    火:
      element: 火
      color_names:
      - 红色
      - 粉色
      - 玫瑰红
      - 橙色
      note: 粉红色、藕荷色、玫红色、橙色为暧昧色，可归为弱火或火土之间
      nature: 炎热、向上、光明
      virtue: 礼
      organs: 心、小肠
      normal_traits: 阳光，快乐，积极向上，付出比较多，欢喜心，热情，热爱，欣赏，创造力
      too_much_traits: 特别容易着急焦虑，有伤痛，自我牺牲，爱而不得，善变，三分钟热度，容易半途而废，有始无终
      too_little_traits: 湿寒体质，对爱有匮乏，求爱求温暖，不爱动，拖延，没有动力，心累，容易三分钟热度，朝三暮四，有始无终，小女人，有依赖情节
      shades:
        深红:
          name: 深红/暗红/酒红
          intensity: 浓郁
          intensity_desc: 能量集中，情感浓烈
          texture_note: 均匀代表热情专注；斑驳代表压抑伤痛
          core_meaning: 情感浓郁，能量集中，可能热情或压抑
          keywords:
          - 伤痛
          - 愤怒
          - 压抑
          - 钻牛角尖
          circles:
            内圈:
              interpretation: 代表有伤痛、有愤怒积压在心底，压抑的情绪无法释放。为人善良，不懂得表达感受，有情绪更多是积压在心底，容易钻牛角尖。伤痛可能是来自于原生家庭，比如从小遭受不公平待遇，被虐待、被语言或行为暴力对待等
              manifestations:
              - 情绪积压
              - 不善于表达
              - 容易钻牛角尖
              - 原生家庭伤痛
              healing: 找到安全的情绪释放方式，学习表达真实感受，疗愈童年创伤
            中圈:
              interpretation: 情绪压抑了很久，没有释放的出口，急躁，对亲近的人有压抑、愤怒。可能出于依赖对方或者对方太过强势，只能忍受，不敢表达自己的感受和情绪。但积累时间长了，很可能会爆发，要么一点小事就点燃情绪，要么身体突然生病
              manifestations:
              - 情绪积压已久
              - 对亲人压抑愤怒
              - 容易爆发
              - 身体隐患
              healing: 建立健康的情绪表达渠道，学习在关系中表达真实感受
            外圈:
              interpretation: 身体有炎症，易上火，心脉受损，心脏力量不足。容易漏财，攒不住钱，花钱有些冲动，为感受或情绪买单。虽然表面看着和大家一样，或者看着很阳光，但实际上内在对外界的规则或标准会有对抗，与人打交道不对路时容易压抑愤怒或难过
              manifestations:
              - 身体炎症
              - 漏财
              - 冲动消费
              - 内在对抗
              healing: 关注心脏健康，建立理性消费观，找到情绪与物质的平衡点
        中红:
          name: 中红/正红
          intensity: 适中
          intensity_desc: 能量平和流动，平衡发展
          texture_note: 均匀代表稳定热情；有变化代表情绪流动
          core_meaning: 喜悦热情，积极温暖
          keywords:
          - 阳光
          - 善良
          - 热情
          - 起伏
          circles:
            内圈:
              interpretation: 为人阳光，容易快乐，善良，能够温暖他人，待亲近的人比较热情，笑点和泪点都比较低，但心情容易起伏，安全感不够，受外界影响很大，对自己没信心，很希望获得他人的认可
              manifestations:
              - 阳光快乐
              - 善良温暖
              - 情绪起伏
              - 渴望认可
              healing: 建立内在稳定感，减少对外界评价的依赖，保持热情但学会稳定
            中圈:
              interpretation: 和亲近的人有归属感，为人热情、付出；另一方面可能让对方觉得过于亲近，产生压力、有负担。情绪起伏比较大，这几天开心，过几天难过担忧，安全感不足，容易着急
              manifestations:
              - 有归属感
              - 热情付出
              - 情绪起伏大
              - 安全感不足
              healing: 学习适度的付出，给关系留出空间，培养情绪稳定性
            外圈:
              interpretation: 身体容易上火。对外人很热情，在别人眼中是个欢喜阳光的人，别人很容易亲近。赚钱有动力有热情，但这种热情很难持续。做事容易着急，三分钟热度，没有坚持力，不自律，给自己定的规则经常被感受影响，财富进账忽高忽低，为情绪买单，看到喜欢就想买，不大考虑性价比，很难攒住钱
              manifestations:
              - 热情阳光
              - 赚钱有动力
              - 三分钟热度
              - 难攒钱
              healing: 培养持久力和自律性，建立理性消费习惯，将热情转化为可持续的动力
        淡红:
          name: 淡红/粉红
          intensity: 柔和
          intensity_desc: 能量轻柔，温和细腻
          texture_note: 均匀代表温柔平和；有变化代表敏感细腻
          core_meaning: 渴望爱与温暖，温和细腻，正在成长
          keywords:
          - 美好
          - 善良
          - 动力不足
          - 逃避
          circles:
            内圈:
              interpretation: 喜欢美好，温暖，内在善良，但力量和热情不够，求爱求温暖，对生活的欢喜心不够，对红尘淡淡的，赚钱动力不足，担当力不够，遇事容易逃避
              manifestations:
              - 喜欢美好
              - 力量不够
              - 赚钱动力不足
              - 容易逃避
              healing: 从自我关爱开始，逐步建立内在力量，培养对生活的热情
            中圈:
              interpretation: 与亲近的人不亲密，热情不起来。亲密关系里比较被动，小女人，喜欢撒娇，但内心希望得到对方的温暖，希望对方主动。情绪起伏大，力量外放，如遇人不淑容易造成情感伤痛
              manifestations:
              - 不亲密
              - 被动
              - 撒娇
              - 情绪起伏
              healing: 学习在关系中主动表达需求，建立健康的亲密模式
            外圈:
              interpretation: 湿寒体质，心脏力量不够，做事有心无力，容易拖延，持续力和爆发力都不足，经常感觉到疲惫，觉得自己被世界排挤在外，花钱和赚钱都不开心，没有心力
              manifestations:
              - 湿寒体质
              - 拖延
              - 疲惫
              - 心力不足
              healing: 从身体调养开始，逐步建立心力，找到让自己开心的事情
      special_positions:
        外圈成片红色:
          meaning: 漏财、入不敷出、消耗型
          detail: 火是往外散发热量的，外圈红代表燃烧消耗，金钱来得快去得快，过手财神（相邻有绿色除外）
          warning: 外圈成片红色且颜色浓烈，财务风险高
        外圈零碎红色:
          meaning: 爱美、爱打扮、要面子
          detail: 外圈颜色五颜六色零碎，花边状，代表关注外表
    土:
      element: 土
      color_names:
      - 黄色
      - 咖色
      nature: 长养、化育、稳定
      virtue: 信
      organs: 脾、胃、肌肉
      normal_traits: 憨厚，宽容，接纳，会尊重别人的喜欢和界限；有承载力，做事务实，认真，靠谱，脚踏实地，稳定；为人忠孝至诚，看重承诺，容易取得别人信任
      too_much_traits: 头脑僵化，比较固执，转不过弯；愚拙不明，反应笨笨的，容易不辨情况相信别人，也可能是抗拒别人；内向好静，内在有自卑，容易有疲惫感；遇事会逆来顺受，忍辱负重
      too_little_traits: 对自我或他人不够接纳，内在有自卑，容易焦虑，有社交恐惧；遇事容易抗拒，逃避；不讲信用，不通情理
      shades:
        深黄:
          name: 深黄/土黄
          intensity: 浓郁
          intensity_desc: 能量集中，承载厚重
          texture_note: 均匀代表稳重踏实；斑驳代表负担压抑
          core_meaning: 承载厚重，稳重踏实，可能固执
          keywords:
          - 固执
          - 逃避
          - 自责
          - 不听意见
          circles:
            内圈:
              interpretation: 代表地面下的土地，没法接纳自己，会逃避问题，掩饰自己的不安和错误，容易自责。思维方式和做事都会比较固执，尤其是圆形或正方形的深黄，有自成一体的思想，基本听不进去别人的意见，可能表面上说好，但实际上仍然我行我素
              manifestations:
              - 无法接纳自己
              - 逃避问题
              - 固执己见
              - 掩饰不安
              healing: 学习接纳真实的自己，面对问题而非逃避，开放心态听取他人意见
            中圈:
              interpretation: 顾家，能担责任，但是能量很疲惫，背负了不属于自己的责任，容易抱怨委屈。近期能量不舒展，有很多压抑。和家人相处的时候也压抑，不能接纳对方的缺点，忍辱负重的感觉，背负了不属于自己的压力，很累想要逃避
              manifestations:
              - 顾家
              - 疲惫
              - 压抑
              - 怨气
              healing: 学会放下不属于自己的责任，建立健康的家庭边界
            外圈:
              interpretation: 脾胃不好，肌肉僵硬，不懂变通，为人固执，没有创造力，缺乏灵活性。对于权威可能小心谨慎，唯唯诺诺，不肯改变，把过去的经验复制到未来，自己不想改变，甚至对抗外界的变化，容易付出多收获少
              manifestations:
              - 固执
              - 不懂变通
              - 对抗
              - 付出多
              healing: 学习灵活变通，适度创新，在坚持与变通中找到平衡
        中黄:
          name: 中黄
          intensity: 适中
          intensity_desc: 能量平和，稳定可靠
          texture_note: 均匀代表稳定和谐
          core_meaning: 稳定靠谱，有承载力
          keywords:
          - 稳定
          - 靠谱
          - 主心骨
          - 接纳
          circles:
            内圈:
              interpretation: 代表这段时期内在相对比较稳定，为人靠谱，可以为自己做主，有自己的主心骨，对自我的接纳力有提升；也可能代表渴望得到安定，渴望提升自身承载力
              manifestations:
              - 稳定
              - 靠谱
              - 有主心骨
              - 自我接纳
              healing: 继续保持这种稳定的状态，同时保持开放和成长
            中圈:
              interpretation: 对亲近的人比较接纳、宽容，情绪相对稳定，能够承担责任，有承载力，但如果不能放松下来，身心也会比较疲惫；不太能表达自己的情感，有些话会憋在心里
              manifestations:
              - 接纳
              - 宽容
              - 承载
              - 疲惫
              healing: 学习表达情感，适度放松，不要过度承担
            外圈:
              interpretation: 为人可靠，可信赖，在别人眼里是老实人，很值得信任，愿意把事情交给他去办。本人赚钱会有点辛苦，对金钱的信念和来钱的渠道有限制性信念，一般只相信努力才能赚钱，只相信上班拿工资能赚钱，事实上，努力只是其中一个赚钱要素。对未来缺乏远见和想象力。老黄牛式努力，容易被别人冒领功劳
              manifestations:
              - 可靠
              - 辛苦
              - 限制性信念
              - 老黄牛
              healing: 拓展财富认知，学习让钱为自己工作，建立更开阔的财富观
        淡黄:
          name: 淡黄
          intensity: 柔和
          intensity_desc: 能量轻柔，灵活轻盈
          texture_note: 均匀代表灵活轻松
          core_meaning: 灵活轻盈，需要落地，正在寻找根基
          keywords:
          - 不接地气
          - 飘
          - 不落地
          circles:
            内圈:
              interpretation: 不接地气，有点飘，赚不到钱，光谈爱和理想，不落地，行动力不足
              manifestations:
              - 不接地气
              - 飘
              - 不落地
              - 行动力不足
              healing: 从脚下做起，把理想分解为可执行的步骤，培养落地能力
            中圈:
              interpretation: 能量不稳定，一会儿很有爱，一会儿很受伤，容易被外界能量影响，开心就会来财，不开心漏财比较快
              manifestations:
              - 不稳定
              - 受影响
              - 情绪化
              healing: 建立情绪稳定性，减少外界对能量的影响
            外圈:
              interpretation: 不接地气，有点飘，赚不到钱，光谈爱和理想，不落地，行动力不足
              manifestations:
              - 不接地气
              - 飘
              - 不落地
              healing: 学习把想法转化为行动，建立务实的财富观
        咖色:
          name: 咖色/深褐
          intensity: 浓郁（特殊）
          intensity_desc: 能量深沉，需要关注
          texture_note: 均匀代表深度内省；斑驳代表需要疗愈
          core_meaning: 能量深沉，可能需要疗愈和关注
          keywords:
          - 伤痛
          - 自卑
          - 逃避
          - 原生家庭
          circles:
            内圈:
              interpretation: 有点像凝结在地底的土，代表伤痛。绘画者可能自卑感比较强烈，但又无力改变，倾向于逃避或忍耐。比如曾经很相信别人，结果别人辜负他，导致绘画者内在受伤，关闭心门，选择不再相信他人和世界。一般这类人原生家庭有伤痛，对家庭失去信任；不被父母信任；总是被父母用言语打压；被父母抛弃（父母离异、出轨）等
              manifestations:
              - 自卑
              - 关闭心门
              - 不信任
              - 原生家庭伤痛
              healing: 疗愈原生家庭创伤，逐步重建对他人的信任
            中圈:
              interpretation: 最近情绪悲伤、难过、不舒坦。和亲近的人不愿意沟通，把自我封闭，对另一半或家人存在不信或信任度受损的情况，一般和另一半会有间歇性冷战
              manifestations:
              - 悲伤
              - 封闭
              - 不信任
              - 冷战
              healing: 学习在关系中表达真实感受，逐步打开心门
            外圈:
              interpretation: 脾胃不好，容易有湿寒。别人会认为他很木讷，固执，说不通；本人会对这个世界有很多不接纳，不信任和怀疑，内在有愧疚，不敢呈现真实的自己
              manifestations:
              - 木讷
              - 固执
              - 不接纳
              - 愧疚
              healing: 接纳真实的自己，放下愧疚，学习与世界和解
    金:
      element: 金
      color_names:
      - 白色
      - 金色
      note: 金属性是白色，而金色则代表灵性，灵性的苏醒，宗教信仰，光和爱等
      nature: 清静、肃杀、收敛
      virtue: 义
      organs: 肺、支气管、皮毛
      normal_traits: 为人刚毅果断，疏财仗义，深知廉耻，自律，要求完美，能干，聪明，努力，执行力强，性价比高，有价值，自我价值感高
      too_much_traits: 有勇无谋；标准和要求多，追求完美，容易自我批评，批评他人；会背负很多不必要的压力，活得比较累；相对比较强势，待人苛刻，身边人难以亲近
      too_little_traits: 倾向于讨好别人，界限感不足，自我空间被挤压，容易委屈，容易难过
      shades:
        白色:
          name: 白色
          intensity: 适中至浓郁
          intensity_desc: 能量清晰明确，有标准
          texture_note: 均匀代表清晰自律；斑驳代表焦虑评判
          core_meaning: 有标准，清晰自律，可能需要放松
          keywords:
          - 标准
          - 能力
          - 自我评判
          - 缺乏安全感
          circles:
            内圈:
              interpretation: 做事有标准，能力强，对自己有要求；但也容易内在空虚，自我评判，评判自己不够好；爱比较，比较后又觉得自己不够好，会自我攻击；缺乏安全感，爱面子
              manifestations:
              - 有标准
              - 能力强
              - 自我评判
              - 缺乏安全感
              healing: 建立内在价值感，减少自我评判，学习自我认可
            中圈:
              interpretation: 说明绘画者近期能量不足，评判较多，能量较低，不是很开心。与家人在一起要么被评判，要么自身有控制欲，对另一半有诸多要求，容易爆发争吵
              manifestations:
              - 能量不足
              - 评判
              - 控制欲
              - 争吵
              healing: 减少评判，放下控制，学习接纳家人本来的样子
            外圈:
              interpretation: 说明绘画者属于性价比类型，赚钱能力也强，花钱比较谨慎，能够迎合集体意识，行动力较强，能力不错，能在平台或工作中吃得开，做事结果导向。但是身边人跟他在一起也会比较累，因为他比较爱批评人
              manifestations:
              - 性价比
              - 谨慎
              - 行动力
              - 批评
              healing: 学习柔和的沟通方式，减少批评，增加鼓励
    水:
      element: 水
      color_names:
      - 蓝色
      - 黑色
      nature: 滋润、向下、流动
      virtue: 智
      organs: 肾、后腰、循环系统、耳朵、膀胱
      normal_traits: 有智慧，有才华，为人深思熟虑；与人沟通合作好，语言清和，人脉广，能够滋养他人，陪伴他人，愿意帮助他人；温润如玉，懂分寸，知进退，知世故而不世故
      too_much_traits: 心性没修好就会喜欢说是非，善变，性情反复无常，行事反复无常；胆小，恐惧感和不安全感较多；自我牺牲，内在有怨气；像洪水，愤怒、报复，容易陷入情绪漩涡
      too_little_traits: 不懂变通，固执；没有分寸；说话比较卡，喉轮卡，有话说不出，有苦难言
      shades:
        黑色:
          name: 黑色
          intensity: 浓郁
          intensity_desc: 能量深沉，深度内省
          texture_note: 均匀代表深度智慧；斑驳代表需要疗愈
          core_meaning: 深度内省，智慧沉淀，可能需要安全感
          keywords:
          - 伤痛
          - 恐惧
          - 不安全感
          circles:
            内圈:
              interpretation: 为冬藏的水，代表有伤痛或恐惧和不安全感
              manifestations:
              - 伤痛
              - 恐惧
              - 不安全感
              healing: 通过清理画释放压抑的情绪，建立内在安全感
            中圈:
              interpretation: 对家人也无法敞开，不安全感强烈，担忧多
              manifestations:
              - 无法敞开
              - 不安全感
              - 担忧
              healing: 学习在亲密关系中敞开，逐步建立信任
            外圈:
              interpretation: 对世界不信任，有恐惧，一般会有点社恐
              manifestations:
              - 不信任
              - 恐惧
              - 社恐
              healing: 逐步建立对外部世界的信任，从小事开始
        深蓝:
          name: 深蓝
          intensity: 浓郁
          intensity_desc: 能量集中，深度专注
          texture_note: 均匀代表专业深度；斑驳代表困扰纠结
          core_meaning: 深度专注，自我意识强，可能成为专业人士
          keywords:
          - 独处
          - 钻研
          - 钻牛角尖
          - 内观
          circles:
            内圈:
              interpretation: 自我意识强，性格安静，喜欢独处，喜欢钻研、研究，如果正向发展，可以成为某个领域的专业人士，如果负向发展，容易钻牛角尖，陷入自己的逻辑里出不来。均匀的深蓝在里圈，也代表最近绘画者在内观，静修，冥想等，通过链接内在不断滋养自己。带斑的深蓝是代表伤痛
              manifestations:
              - 独处
              - 钻研
              - 钻牛角尖
              - 内观
              healing: 保持钻研精神的同时，学会跳出来看问题，避免过度内耗
            中圈:
              interpretation: 在家喜欢独处，需要有自己的空间来充电和做研究，否则会很郁闷很痛苦；能量相对比较稳定，但遇事情也容易对境生心，引起情绪波动；与亲人关系一般般，不是特别爱沟通
              manifestations:
              - 独处
              - 稳定
              - 情绪波动
              - 不热情
              healing: 在独处和亲情之间找到平衡，适度表达关心
            外圈:
              interpretation: 别人认为TA很专业，对事情看法有高认知
              manifestations:
              - 专业
              - 高认知
              healing: 保持专业度的同时，学习更接地气的表达方式
        中蓝:
          name: 中蓝
          intensity: 适中
          intensity_desc: 能量平和，智慧流动
          texture_note: 均匀代表智慧平衡
          core_meaning: 智慧生发，爱学习，能滋养自己
          keywords:
          - 智慧
          - 学习
          - 滋养
          - 沟通
          circles:
            内圈:
              interpretation: 自我意识强，智慧在生发，最近爱学习，接触更多的智慧，和内在的链接增加，能滋养自己；也可能心里面也会有一些湿寒，更多是接触智慧，学习智慧，但没有真正去实践
              manifestations:
              - 智慧
              - 学习
              - 滋养
              - 想得多
              healing: 将学到的智慧付诸实践，知行合一
            中圈:
              interpretation: 与亲近的人或爱人有良好的沟通，相处舒服；付出也需要有回报，否则容易多抱怨
              manifestations:
              - 沟通
              - 舒服
              - 需要回报
              healing: 学习无条件付出，减少抱怨
            外圈:
              interpretation: 最近财运不错，做的事情能得到外界的认可；近期与外界接触的信息比较多，对外界的机会有敏锐的感知力；待人温柔，别人与TA相处如沐春风，能受到滋养，人缘比较好
              manifestations:
              - 财运
              - 认可
              - 温柔
              - 人缘
              healing: 继续保持良好的人际互动，同时关注自身能量平衡
        浅蓝:
          name: 浅蓝/淡蓝
          state: 不足
          core_meaning: 温柔但优柔寡断，想得多做得少
          keywords:
          - 温柔
          - 浪漫
          - 优柔寡断
          - 想得多
          circles:
            内圈:
              interpretation: 绘画者内心温柔，清新，有浪漫情怀，很聪明，但也会聪明反被聪明误，做决策时也会优柔寡断，可能盲目跟随，也可能不自信，不敢表达真实的自己。同时绘画者对于智慧也渴望提升，但容易想得多，做的少
              manifestations:
              - 温柔
              - 浪漫
              - 优柔寡断
              - 想得多
              healing: 培养决断力，从做小事开始建立行动力
            中圈:
              interpretation: 容易多愁善感，容易悲观，家人也劝不住；渴望和另一半有更多交流，但是无法真实地表达自己的需求，可能用责备、抱怨等来引起对方注意，需要对方来猜。情绪波动比较快，反复无常
              manifestations:
              - 多愁善感
              - 无法表达
              - 情绪波动
              - 反复无常
              healing: 学习直接表达需求，减少猜谜游戏
            外圈:
              interpretation: 希望改变外界，渴望外界的人事物成为自己想要的样子，但一般都会失望，容易产生怨气。一直在寻找合适的机会进阶，但行动上也会有所犹豫。做事比较拖延，湿寒气重
              manifestations:
              - 失望
              - 怨气
              - 犹豫
              - 拖延
              healing: 接纳世界本来的样子，从改变自己开始
