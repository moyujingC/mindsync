  special_colors:
    紫色:
      element: 火/木（暧昧色）
      meaning: 神秘、浪漫、自尊心强、缺乏动力和热情、渴望被关注、紫气东来、高贵、高维下载链接、与第七脉轮相关、直觉力、贵气、魅力、信仰、艺术感、成熟、稳重
      too_much: 最近直觉不错，可能有女巫的能量（直觉灵敏，做梦很准），但也会挑剔、高冷、封闭、压抑、紧张、严肃、心事重重、忧郁、偏向消极、有点不切实际，不接地气。紫色画的特别深重，笔触很重，面积比例大，颜色很暗或很浓的，基本上都有些封闭，喜欢独处，不喜欢与人过多接触。嘴上不说，但心里会挑剔别人，看不上别人
      too_little: 喜欢自己默默努力，喜欢待在自己的空间；爱幻想；灵性有所发展，但不稳定；近期心情躁动，可能有些迷茫；信仰或信念力量不够，容易摇摆不定
      normal: 紫气东来，高贵、高维下载链接、与第七脉轮相关、直觉力，贵气，魅力、信仰、艺术感、神秘、成熟、稳重；也有高冷，热情不足，渴望被关注，自尊心特别强，动力不够等问题
      circles:
        内圈: 灵性追求，直觉力发展，但可能不接地气
        中圈: 在关系中重视精神交流，可能有距离感
        外圈: 给人神秘高贵印象，外人觉得有距离
    橙色:
      element: 火/土（暧昧色）
      meaning: 正橙色：有活力，有自信，性格开朗，积极向上，内心欢喜愉悦，对福报的承载，对贵人和财富的吸引；淡橙色：渴望爱、渴望认可和温暖，缺乏自给自足的动力
      too_much: 有些自负，听不进去别人好的意见，会固执己见，容易钻牛角尖，对别人有控制欲。也代表压抑焦虑，对这个世界有封闭，没有敞开心扉
      too_little: 不自信，有点社恐，只想自己待着，脾胃不好，精力不足，兴趣寥寥，情绪低落，有点懒散，对这个世界缺少一份好奇心和好感度，渴望爱和温暖，渴望更多认可
      normal: 介于火和土之间，正面意义代表有活力，有自信，性格开朗，积极向上，内心欢喜愉悦，正橙色也代表对福报的承载，对贵人和财富的吸引
      circles:
        内圈: 温暖善良，渴望爱与认可，但可能依赖外界
        中圈: 与家人相处温暖，愿意为家人付出
        外圈: 对外人热情，有吸引力，贵人运好
    粉色:
      element: 火（弱火）
      meaning: 恋爱和美好的颜色，有撒娇的味道，对爱有很多幻想和渴望，像小女人一样渴望被呵护，对对方有依赖，希望你懂我，希望你保护我
      note: 通常弱火属性的颜色如粉红、玫红、橘红，都是能够付出爱和温暖，但也会向外求取爱和温暖。生活中别人给你的爱是不稳定的，或者TA给你的爱未必刚好满足你、刚好是你想要的，所以这类宝宝外求的过程中容易受情伤
      circles:
        内圈: 内在温柔，渴望被爱，依赖性强
        中圈: 在亲密关系中撒娇，希望被呵护
        外圈: 关注外表，爱美，容易为情绪消费
    玫瑰红:
      element: 火（弱火）
      meaning: 代表喜欢美好，也想要分享更多美好，但具体有没行动还不知道，与粉色相比，玫红色显得更稳重成熟些，但内在能量不变，也是渴望爱和呵护
      circles:
        内圈: 成熟稳重的外在，内心仍渴望爱
        中圈: 在关系中稳重但仍有期待
        外圈: 给人成熟印象，但内在需要支持
