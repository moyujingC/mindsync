id: rule.theme_mappings
type: rule
version: v2.2
status: active
source: legacy_v2_python
review_status: migrated
payload:
  mappings:
    general:
      水多木漂:
        核心矛盾: 想法丰富但难以落地
        具体表现: 想法很多，计划很多，但执行力弱，容易半途而废
        转变方向: 减少空想，从小事开始行动
      火多土焦:
        核心矛盾: 热情过度消耗稳定
        具体表现: 容易急躁，三分钟热度，睡眠或消化系统受影响
        转变方向: 培养耐心，建立规律作息
      木多火塞:
        核心矛盾: 想法阻碍表达
        具体表现: 有很多想法但难以表达，容易生闷气
        转变方向: 学习表达，释放内在想法
      土多金埋:
        核心矛盾: 务实压抑灵活
        具体表现: 过于务实，缺乏变通，难以接受新事物
        转变方向: 尝试新体验，培养灵活性
      金多水浊:
        核心矛盾: 理性压抑情感
        具体表现: 过于理性，情感疏离，难以建立深度连接
        转变方向: 培养情感表达，增加温暖
      水多火灭:
        核心矛盾: 思虑压制行动
        具体表现: 想太多做太少，过度分析导致行动力丧失
        转变方向: 立即行动，减少过度准备
      火多金熔:
        核心矛盾: 热情消耗理性
        具体表现: 冲动决策，缺乏理性思考，容易后悔
        转变方向: 冷静思考后再做决定
      金多木折:
        核心矛盾: 标准压制成长
        具体表现: 对自己要求过高，自我批评严重，成长受阻
        转变方向: 降低标准，接纳不完美
      木多土陷:
