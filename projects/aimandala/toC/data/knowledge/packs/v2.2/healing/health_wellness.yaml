payload:
  theme_id: health_wellness
  healing_prescriptions:
    issue_types:
      情绪压抑:
        symptoms:
        - 长期胸闷
        - 叹气
        - 易怒
        - 偏头痛
        - 无故哭泣
        mandala_prescription:
          primary_colors:
          - 绿色
          - 青色
          accent_colors:
          - 红色
          purpose: 疏肝解郁，提升生命活力
        daily_practice:
        - 每日深呼吸练习10分钟
        - 听舒缓音乐
        - 多接触大自然
        cognitive_upgrade: 认识到情绪是身体的信号，允许自己感受和表达，而非压抑
      能量耗竭:
        symptoms:
        - 长期疲劳
        - 精神不振
        - 食欲不佳
        - 面色萎黄
        mandala_prescription:
          primary_colors:
          - 黄色
          - 橙色
          accent_colors:
          - 红色
          purpose: 滋养脾胃，提升能量
        daily_practice:
        - 每日腹部按摩5分钟
        - 午后小憩
        - 饮食清淡
        - 规律作息
        cognitive_upgrade: 认识到身体是能量的载体，学会自我滋养和休息，而非过度消耗
      焦虑失眠:
        symptoms:
        - 心悸
        - 入睡困难
        - 多梦
        - 口干舌燥
        - 情绪烦躁
        mandala_prescription:
          primary_colors:
          - 蓝色
          - 紫色
          accent_colors:
          - 白色
          purpose: 安抚心神，滋养肾水
        daily_practice:
        - 睡前泡脚
        - 听冥想引导
        - 避免睡前使用电子产品
        - 保持卧室黑暗
        cognitive_upgrade: 认识到焦虑源于对未来的担忧，学会活在当下，信任生命进程
      免疫力低下:
        symptoms:
        - 频繁感冒
        - 过敏
        - 皮肤问题
        - 呼吸道感染
        mandala_prescription:
          primary_colors:
          - 白色
          - 金色
          accent_colors:
          - 黄色
          purpose: 增强肺气，提升免疫力
        daily_practice:
        - 每日户外散步30分钟
        - 深呼吸
        - 保持室内空气流通
        - 补充维生素C
        cognitive_upgrade: 认识到身体有自愈能力，通过健康生活方式支持免疫系统
      身体僵硬:
        symptoms:
        - 颈肩腰背酸痛
        - 筋骨不适
        - 身体活动受限
        mandala_prescription:
          primary_colors:
          - 绿色
          - 蓝色
          accent_colors:
          - 黑色
          purpose: 柔韧筋骨，滋养肾精
        daily_practice:
        - 每日拉伸、瑜伽或太极练习
        - 温水泡澡
        - 避免久坐
        cognitive_upgrade: 认识到身体是流动的，学会放松和释放身体的紧张
      深层恐惧:
        symptoms:
        - 莫名的不安
        - 逃避
        - 缺乏安全感
        - 泌尿系统问题
        mandala_prescription:
          primary_colors:
          - 黑色
          - 深蓝色
          accent_colors:
          - 白色
          purpose: 面对恐惧，净化身心
        daily_practice:
        - 每日冥想
        - 写日记
        - 寻求心理咨询
        - 多进行放松练习
        cognitive_upgrade: 认识到恐惧是成长的机会，勇敢面对内在阴影，转化负面能量
  healing_template:
    duration_days: 30
    phases:
    - phase: 1
      days: 1-10
      theme: 觉察身心连接
      color: 绿色
      frequency: 每天7张
    - phase: 2
      days: 11-20
      theme: 释放身体情绪
      color: 蓝色+黑色
      frequency: 每天7-14张
    - phase: 3
      days: 21-30
      theme: 建立身心平衡
      color: 黄色+绿色
      frequency: 每天3-7张
