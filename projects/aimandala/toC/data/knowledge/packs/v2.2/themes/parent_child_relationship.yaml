            中圈:
              interpretation: 亲子互动中父母缺乏原则，对孩子行为没有约束，或父母在教育上不一致。孩子行为无度，挑战父母底线，或父母在孩子面前意见不合，孩子无所适从。
              manifestations:
              - 缺乏原则
