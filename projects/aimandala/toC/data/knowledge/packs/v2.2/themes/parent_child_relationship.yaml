            内圈:
              interpretation: 父母对孩子有极高期望和严格标准，自我批评也强，易将压力转嫁给孩子。父母对孩子成绩、行为要求苛刻，孩子感到巨大压力，或父母常批评孩子，导致孩子自卑。
