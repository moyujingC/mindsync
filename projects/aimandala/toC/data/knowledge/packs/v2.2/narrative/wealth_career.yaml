payload:
  theme_id: wealth_career
  insight_templates:
    你的底色:
      角度: 你的核心事业驱动力
      示例: 你的外圈金元素突出显示，你的事业成就感很大程度上来自'把事情做到极致'的专业满足...
    你的矛盾:
      角度: 想法 vs 落地的差距
      示例: 内圈的丰富创意与中圈的阻滞显示，你可能有很多商业想法，但总在启动前被各种担忧拖住...
    你的模式:
      角度: 财富/事业中的重复循环
      示例: 木→火→金的顺畅流向显示你通常能快速将创意转化为行动并产出结果，但要注意火过旺导致的冲动决策...
    你的防御:
      角度: 在事业中如何保护自己（也可能阻碍成长）
      示例: 外圈的厚重土元素形成安全区：你倾向于选择稳定但可能限制成长的机会，用'稳妥'回避'可能失败'...
    你的卡点:
      角度: 事业/财富突破的核心障碍
      示例: 过多的思虑与等待'完美时机'的习惯可能让你错失多个本可行动的机会...
    你的光:
      角度: 你在事业中的独特优势
      示例: 画显示你拥有极强的直觉判断力——当你学会平衡直觉与数据，这会成为你独特的商业决策优势...
  pro_upgrade_teaser: '

    还有更多深层洞察，包括：

    - 这种事业模式与童年“金钱故事”的连接

    - 你在不同事业阶段的表现差异

    - 更完整的结构、根因与疗愈视角

    '
