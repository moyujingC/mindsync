payload:
  theme_id: personal_growth
  insight_templates:
    你的底色:
      角度: 你当前的生命阶段
      示例: 你的画显示正处于'水'的深潜期——这是一个适合向内探索、积累内在资源的阶段...
    你的矛盾:
      角度: 理想自我 vs 现实自我
      示例: 内圈的丰富潜能与外圈的谨慎显示，你可能常有'知道自己可以更多，但总是迈不出去'的感受...
    你的模式:
      角度: 成长的重复循环
      示例: 木→火→土的流向显示，你通常能快速开始新事物，但在需要长期坚持时能量会衰减...
    你的防御:
      角度: 如何避免面对成长议题
      示例: 外圈的金形成完美的保护：你可能用'已经很努力了'或'等准备好了再开始'来延迟真正的突破...
    你的卡点:
      角度: 当前成长的核心障碍
      示例: 过多的想法与行动力之间的落差可能正在阻碍你真正行动起来，让你陷入'想得多做得少'的循环...
    你的光:
      角度: 你独特的天赋与资源
      示例: 画显示你拥有极强的深度思考能力——当你学会将这份天赋与行动结合，而非只用思考替代行动...
  pro_upgrade_teaser: '

    还有更多深层洞察，包括：

    - 你独特的成长路径

    - 内在障碍与童年经验的连接

    - 更完整的结构、根因与疗愈视角

    '
