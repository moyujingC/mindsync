  insight_templates:
    你的底色:
      角度: 你作为父母的核心状态
      示例: 你的中圈火元素显示，你在亲子关系中投入了大量的情感能量，孩子能明显感受到你的在乎...
    你的矛盾:
      角度: 期待 vs 接纳
      示例: 外圈的规则感与内圈的柔软显示，你可能常在'希望孩子变得更好'和'接纳孩子本来的样子'间挣扎...
    你的模式:
      角度: 无意识重复的代际模式
      示例: 金克木的能量格局显示，你可能在无意识中重复自己父母的教育方式——用规则约束来确保孩子的'正确'...
    你的防御:
      角度: 作为父母的自我保护
      示例: 外圈的坚固显示：当孩子的行为触发你的不安时，你会本能地用规则或批评来恢复控制感...
    你的卡点:
      角度: 亲子关系中的核心挑战
      示例: 过度的热情与期待可能给孩子带来压力，反而影响了他们安全感的建立，让爱变成了无形的负担...
    你的光:
      角度: 你作为父母的独特优势
      示例: 画显示你拥有极强的共情能力——当你学会先调节自己的情绪再回应孩子，这会成为孩子最珍贵的礼物...
  pro_upgrade_teaser: '

