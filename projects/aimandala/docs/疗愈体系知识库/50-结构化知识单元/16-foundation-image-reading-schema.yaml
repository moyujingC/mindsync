id: aimandala.foundation_image_reading_schema.v0_1
version: 0.1.0
status: draft
content_source_status: ai_draft
source_verification_status: source_verification_pending
date: 2026-05-21
owner: CEO / Knowledge Base
type: runtime_schema
product: aimandala
applies_to:
  - mandala_interpretation_agent
  - foundation_image_reading
  - visual_model_prompt
source_of_truth: projects/aimandala/docs/疗愈体系知识库/50-结构化知识单元/16-foundation-image-reading-schema.yaml

purpose:
  - 定义新版基础层图像解读的目标输出结构。
  - 支持视觉模型先完成画面观察，再由文本模型基于 visual_observation 完成圈内五行识别、圈内关系和三圈能量流动。
  - 约束视觉模型只完成曼陀罗基础层解读，不进入财富、关系、身体、心理或疗愈报告语言。
  - 保证五行识别、圈内关系和三圈能量流动都能回溯到画面证据。

input:
  required:
    - image_mandala
    - image_marked_circles
    - mandala_foundation_knowledge
  notes:
    - image_mandala 是用户原画作，是唯一画作内容来源。
    - image_marked_circles 只用于确认内圈、中圈、外圈边界。
    - 三圈标记线、模板黑线、印刷线稿不作为用户画作视觉单元。

global_boundaries:
  allowed_tasks:
    - 画面整体观察。
    - 三圈逐圈观察。
    - 圈内视觉单元拆分。
    - 圈内视觉单元五行识别。
    - 圈内五行相生、相克、切分、包围、隔开、无根、失衡判断。
    - 三圈之间的承接、断裂、外散、内收、压住、包围、现实承接判断。
  forbidden_tasks:
    - 不生成 Lite 或 Pro 报告正文。
    - 不解释财富结果、收入、存钱能力或投资建议。
    - 不解释亲密关系、父母关系、亲子关系或人际关系结论。
    - 不解释身体疾病、身体部位问题或医疗建议。
    - 不做心理诊断、人格判断或创伤定性。
    - 不给疗愈建议、行动建议或复购建议。
  five_element_rules:
    - 五行识别只针对圈内视觉单元，不给整圈贴单一五行。
    - 五行强弱和失衡判断需参考 visual_units.energy_ratio_percent。
    - 留白、真实白色、色块间空隙一律按金处理。
    - 模板黑线和三圈标记线不进入五行判断。
    - 紫色、橙色、粉色等暧昧色需保留颜色深浅、开放/封闭、渐变和形状依据。
  cross_circle_rules:
    - 跨圈只判断三圈能量流动。
    - 跨圈能量流动不使用五行生克替代。
    - 不写内圈某五行克外圈某五行。

required_output:
  foundation_image_reading:
    type: object
    required_keys:
      - visual_observation
      - element_sensing
      - intra_circle_relations
      - cross_circle_flow
      - evidence_links

  visual_observation:
    type: object
    required_keys:
      - overall_observation
      - three_circle_observation
      - circle_visual_units
    fields:
      overall_observation:
        type: object
        required_keys:
          - first_impression
          - main_visual_content
          - visual_atmosphere
          - visual_weight_and_rhythm
        description: 整体观察需要像疗愈师第一眼看画，但仍只写视觉事实和视觉感受。
      three_circle_observation:
        type: object
        required_keys:
          - inner
          - middle
          - outer
          - cross_circle_visual_connection
        description: 描述三圈分别画了什么，以及三圈之间如何衔接或断开。
      circle_visual_units:
        type: object
        required_keys:
          - inner
          - middle
          - outer
        circle_payload:
          composition_description:
            type: string
          visual_units:
            type: array
            min_items: 1
            item_fields:
              id:
                type: string
                required: true
                format: inner-001 / middle-001 / outer-001
              unit_name:
                type: string
                required: true
              position:
                type: string
                required: true
              source_type:
                type: string
                required: true
                allowed:
                  - user_painted
                  - blank_space
              color_description:
                type: string
                required: true
              shape_description:
                type: string
                required: true
              texture_and_density:
                type: string
                required: true
              spatial_relations:
                type: string
                required: true
                description: 同时描述不同视觉单元之间的关系，以及同类重复单元之间的排列、间隔和留白。
              blank_space_role:
                type: string
                required: true
              energy_ratio_percent:
                type: number
                required: true
                description: 该视觉单元在本圈内按面积大小和视觉重量估算的能量占比；同一圈所有视觉单元合计应为 100。
              rich_visual_description:
                type: string
                required: true

  element_sensing:
    type: object
    required_keys:
      - inner
      - middle
      - outer
    circle_payload:
      element_candidates:
        type: array
        item_fields:
          visual_unit_id:
            type: string
            required: true
          element:
            type: string
            required: true
            allowed:
              - wood
              - fire
              - earth
              - metal
              - water
              - ambiguous
          basis:
            type: array
            required: true
            description: 颜色、形状、留白、方向、深浅、笔触、重复或密度依据。
          confidence:
            type: string
            required: true
            allowed:
              - high
              - medium
              - low
          notes:
            type: string
            required: false
      summary:
        type: string
        description: 本圈有哪些五行元素，不写心理、财富或身体解释。

  intra_circle_relations:
    type: object
    required_keys:
      - inner
      - middle
      - outer
    circle_payload:
      relations:
        type: array
        item_fields:
          relation_id:
            type: string
            required: true
          relation_type:
            type: string
            required: true
            allowed:
              - generating
              - controlling
              - cut_by_metal
              - surrounded_by
              - separated_by_blank_space
              - rootless_wood
              - imbalance_candidate
              - blocked_cycle
              - insufficient_evidence
          involved_visual_unit_ids:
            type: array
            required: true
          visible_basis:
            type: string
            required: true
          confidence:
            type: string
            required: true
            allowed:
              - high
              - medium
              - low
          notes:
            type: string
            required: false
      summary:
        type: string
        description: 本圈内部五行关系摘要，不映射到具体议题。

  cross_circle_flow:
    type: object
    required_keys:
      - flow_observations
      - summary
    fields:
      flow_observations:
        type: array
        item_fields:
          flow_id:
            type: string
            required: true
          flow_type:
            type: string
            required: true
            allowed:
              - continuous
              - interrupted
              - outward_expanding
              - inward_contracting
              - outer_layer_containing
              - outer_layer_scattered
              - middle_layer_blocked
              - inner_outer_mismatch
              - insufficient_evidence
          involved_circles:
            type: array
            required: true
            allowed_values:
              - inner
              - middle
              - outer
          visual_basis:
            type: string
            required: true
          confidence:
            type: string
            required: true
            allowed:
              - high
              - medium
              - low
      summary:
        type: string
        description: 三圈能量流动摘要，不使用跨圈五行生克语言。

  evidence_links:
    type: array
    item_fields:
      claim_id:
        type: string
        required: true
      claim_type:
        type: string
        required: true
        allowed:
          - element_sensing
          - intra_circle_relation
          - cross_circle_flow
      claim_text:
        type: string
        required: true
      visual_unit_ids:
        type: array
        required: false
      circle_observation_refs:
        type: array
        required: false
      evidence_text:
        type: string
        required: true

review_flags:
  - id: foundation.theme_leakage
    label: 基础层混入议题解释
    trigger: 输出出现财富、关系、身体、心理、疗愈建议等具体议题判断。
    severity: high
  - id: foundation.whole_circle_element_label
    label: 给整圈贴单一五行
    trigger: 输出把内圈、中圈或外圈整体判定为单一五行，而不是按视觉单元识别。
    severity: high
  - id: foundation.cross_circle_five_element_relation
    label: 跨圈使用五行生克
    trigger: 输出写内圈某五行克外圈某五行，或用五行生克替代三圈能量流动。
    severity: high
  - id: foundation.evidence_missing
    label: 基础层判断缺少视觉证据
    trigger: 五行识别、圈内关系或三圈流动没有引用视觉单元或三圈观察依据。
    severity: high
  - id: foundation.blank_space_missing
    label: 留白漏识别
    trigger: 画作内明显留白切分、包围或隔开元素，但 visual_units 未记录 blank_space。
    severity: high
