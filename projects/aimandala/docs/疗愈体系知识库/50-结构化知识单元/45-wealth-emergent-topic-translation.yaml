source_refs:
  - projects/aimandala/docs/疗愈体系知识库/20-疗愈体系/10-议题层/12-财富议题浮现议题回译规则.md
  - projects/aimandala/docs/疗愈体系知识库/20-疗愈体系/10-议题层/11-财富议题手册.md
  - projects/aimandala/docs/疗愈体系知识库/30-应用适配/10-aimandala/06-财富议题解读报告模板.md

purpose:
  - 定义财富作为主议题时，其他浮现议题如何进入报告。
  - 保证自我价值、家庭、关系、情绪、身体和事业线索都回译到财富主线。
  - 为后续多独立议题知识库预留桥接字段。

schema:
  primary_topic: 用户选择或报告锚定的主议题。
  emergent_topic: 在画面或用户描述中浮现的辅助议题。
  translation_role: 该浮现议题在主议题中的作用。
  allowed_depth: hint | brief | supporting_mechanism。
  translated_mechanisms: 浮现议题必须翻译成的主议题机制。
  trigger_signals: 允许进入报告的画面或用户描述信号。
  source_topic_clause_refs: 后续独立议题知识库成熟后挂接的条款 ID。
  report_language: 可用于报告的用户可见表达。
  avoid: 禁止表达。

global_rules:
  primary_topic_anchor:
    - 报告框架由 primary_topic 决定。
    - emergent_topic 只能解释主议题机制，不能替代主线。
    - Lite 默认只用 hint 或 brief。
    - Pro 最多展开 2 个 supporting_mechanism。
  report_order:
    - 先写画面证据。
    - 再写财富状态和财富机制。
    - 再把浮现议题翻译为财富机制。
    - 最后写现实表现和低风险建议。
  global_avoid:
    - 不展开成其他主题报告。
    - 不使用确定因果。
    - 不输出财务预测、职业决策、医疗判断或心理诊断。

translations:
  - id: wealth.emergent.self_worth
    primary_topic: wealth
    emergent_topic: self_worth
    emergent_topic_label: 自我价值
    translation_role: value_permission
    allowed_depth:
      lite: brief
      pro: supporting_mechanism
    translated_mechanisms:
      - deservingness
      - being_paid
      - value_visibility
      - receiving_capacity
      - approval_driven_earning
    trigger_signals:
      visual:
        - 内圈收缩
        - 中心空缺
        - 金多
        - 白色割裂
        - 价值线索被压低
      user_language:
        - 不值得
        - 不敢收钱
        - 不敢被看见
        - 怕别人觉得我不值
    source_topic_clause_refs: []
    report_language:
      - 自我价值线索放到财富议题里，更像是在看你是否允许自己的价值被看见、被支付，并稳定地接住回报。
    avoid:
      - 不写用户没有价值感。
      - 不把价值感写成人格缺陷。

