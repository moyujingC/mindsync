      - 不承诺客户、成交、收入或市场反馈。
      - 不把用户不外向写成问题。

future_upgrade:
  matrix_target: cross-topic-translation.yaml
  migration_rule:
    - 当前文件可迁移为 primary_topic=wealth 的一组规则。
    - 当其他议题独立成库后，只补 source_topic_clause_refs，不改变财富报告主线。
    - 多主议题矩阵成熟后，由 primary_topic 决定报告框架，由 emergent_topic 提供背景机制。
