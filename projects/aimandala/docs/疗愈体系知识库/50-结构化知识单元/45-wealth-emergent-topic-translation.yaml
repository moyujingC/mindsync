      - success_permission
      - responsibility_pattern
      - receiving_capacity
      - family_loyalty
      - safety_source
    trigger_signals:
      visual:
        - 强边界
        - 防御
        - 收缩
        - 负担感
        - 内外不一致
      user_language:
        - 父母
        - 家庭责任
        - 家族期待
        - 赚钱压力
        - 成功后关系变化
    source_topic_clause_refs: []
    report_language:
      - 家庭线索放到财富议题里，不是为了判断父母或家庭，而是观察早期关于钱、成功、承担和收受的学习，是否还在影响你现在如何拥有和流动资源。
    avoid:
      - 不写父母决定用户财富状态。
      - 不用家庭系统解释替代心理诊断。
      - 不把家族忠诚写成确定结论。

