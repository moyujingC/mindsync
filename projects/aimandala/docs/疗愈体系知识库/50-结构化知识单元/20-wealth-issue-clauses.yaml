domain_definition:
  title: 财富议题
  summary: 财富议题关注人与金钱、价值、资源、世界和行动之间的关系，不直接判断用户有没有钱或能不能赚钱。
  active_user_questions:
    - 我为什么赚不到钱。
    - 我为什么存不住钱。
    - 我为什么总觉得钱不够。
    - 我适合怎样创造财富。
    - 我的财富流动哪里卡住了。
    - 我的金钱关系和家庭、关系、事业有什么关联。
  positive_state:
    - 允许自己拥有财富。
    - 能看见自己的价值，并愿意交换价值。
    - 对金钱有稳定、清明、不紧绷的态度。
    - 有行动力，也有持续性。
    - 能赚钱，也能承载和保存财富。
    - 愿意和世界建立真实链接。
    - 能从热爱、创造、服务和自由出发赚钱。

clauses:
  - id: wealth.low_deservingness
    title: 配得感不足
    provenance:
      source_status: model_scaffold
      validation_status: pending_source_review
      evidence_refs:
        - projects/aimandala/docs/疗愈体系知识库/20-疗愈体系/10-议题层/01-财富议题体系框架.md#51-配得感不足
      needs_backfill_from:
        - ACT就这么简单
        - 心理自助CBT书系
        - 创伤与复原
        - 格式塔心理咨询理论与实践
        - 谁在我家
    summary: 这条线索更像是在看，你是否还在犹豫自己值不值得拥有、被支付、被支持和被看见。
    typical_signals:
      - 对“我配不配”这件事总会多想一步。
      - 拿到结果后，心里还是不太踏实。
      - 常常要先证明自己，才敢真正接住回报。
      - 容易把价值和结果绑得很紧。
    report_language:
      - 从财富议题看，这里更像是在看一段“我值不值得拥有”的拉扯。
      - 你并不一定缺少创造价值的能力，更多像是还在练习怎样稳稳地接住它。
    healing_direction:
      - 先不用急着证明自己，先练习看见自己已经有的价值。
      - 允许自己小范围地接住一点回报或支持。
      - 慢慢分开“我创造了什么”和“我到底值不值得”。
    visual_mapping_candidates:
      - 金多可能映射到求认可、自我评判和外界标准。
      - 土弱或不成片可能映射到承载不足。
    safety:
      avoid:
        - 不写成用户一定赚不到钱。
        - 不写成固定人格缺陷。

  - id: wealth.scarcity_and_insecurity
    title: 匮乏感和安全感不足
    provenance:
      source_status: model_scaffold
      validation_status: pending_source_review
      evidence_refs:
        - projects/aimandala/docs/疗愈体系知识库/20-疗愈体系/10-议题层/01-财富议题体系框架.md#52-匮乏感和安全感不足
      needs_backfill_from:
        - ACT就这么简单
        - 心理自助CBT书系
        - 创伤与复原
        - 格式塔心理咨询理论与实践
        - 谁在我家
    summary: 这条线索更像是在看，钱在你这里是否承担了太多安全感的任务。
    typical_signals:
      - 一碰到钱，心里容易先紧一下。
      - 明明有进账，还是不太能真正放松。
      - 对未来不够用的担心会自己冒出来。
      - 赚钱动力里，恐惧有时比热爱更先说话。
    report_language:
      - 这里更像是安全感在向钱借力，所以钱越重要，内在反而越容易绷紧。
      - 这不一定表示现实资源真的少，也可能是心里长期住着一个“不够用”的预设。
    healing_direction:
      - 先不用急着解决钱的问题，先让身体知道“现在是安全的”。
      - 慢慢看一看，自己对钱的信念是怎样形成的。
      - 允许安全感从身体一点点长回来。
    visual_mapping_candidates:
      - 水火冲突可能映射到情绪消耗行动力。
    safety:
      avoid:
        - 不判断用户真实财务状况。
        - 不承诺通过调整就能获得收入增长。

  - id: wealth.approval_driven_earning
    title: 求认可式赚钱
    provenance:
      source_status: model_scaffold
      validation_status: pending_source_review
      evidence_refs:
        - projects/aimandala/docs/疗愈体系知识库/20-疗愈体系/10-议题层/01-财富议题体系框架.md#53-求认可式赚钱
      needs_backfill_from:
        - ACT就这么简单
        - 心理自助CBT书系
        - 创伤与复原
        - 格式塔心理咨询理论与实践
        - 谁在我家
    summary: 用户可能把赚钱、成绩或客户认可当成证明自己值得的方式。
    typical_signals:
      - 努力是为了被看见、被证明、被认可。
      - 产出价值时很在意外界评价。
      - 达不到标准就自我攻击。
      - 把财富结果等同于“我好不好”。
    report_language:
      - 这条线索像是在提醒你：财富不只是收入问题，也牵动着“我是否被认可”的需要。
      - 当赚钱变成证明自己的方式，行动会变得很用力，也更容易被外界评价牵动。
    healing_direction:
      - 自我价值确认。
      - 放松外界标准。
      - 区分收入结果和自我价值。
    visual_mapping_candidates:
      - 金多可能映射到求认可、自我评判和外界标准。
    safety:
      avoid:
        - 不把努力赚钱批评为错误。
        - 不否定用户的现实目标。

  - id: wealth.emotional_spending
    title: 情绪型漏财
    provenance:
      source_status: model_scaffold
      validation_status: pending_source_review
      evidence_refs:
        - projects/aimandala/docs/疗愈体系知识库/20-疗愈体系/10-议题层/01-财富议题体系框架.md#54-情绪型漏财
      needs_backfill_from:
        - ACT就这么简单
        - 心理自助CBT书系
        - 创伤与复原
        - 格式塔心理咨询理论与实践
        - 谁在我家
    summary: 这条线索更像是在看，消费有没有替情绪做了太多安抚工作。
    typical_signals:
      - 有时候花钱不是为了东西本身，而是为了安顿一下当下的感觉。
      - 开心时想奖励自己，不开心时又想借消费缓一缓。
      - 眼前的感觉会比性价比更快做决定。
      - 情感、家庭或成长压力一上来，支出也容易跟着动。
    report_language:
      - 这里更像是钱在替情绪找出口，所以消费本身未必有问题，关键是它承担了太多安抚功能。
      - 如果情绪一直没被看见，财富流动就容易变成一边进来、一边又被带走。
    healing_direction:
      - 可以先不急着管住消费，先看一看消费前后自己在经历什么。
      - 试着找到一种不靠花钱也能安顿情绪的方式。
      - 允许情绪先被看见，再谈消费。
    visual_mapping_candidates:
      - 外圈红色多可能映射到情绪型漏财。
      - 水火冲突可能映射到情绪消耗行动力。
    safety:
      avoid:
        - 不直接说用户乱花钱。
        - 不做财务管理承诺。

  - id: wealth.low_capacity
    title: 承载力不足
    provenance:
      source_status: model_scaffold
      validation_status: pending_source_review
      evidence_refs:
        - projects/aimandala/docs/疗愈体系知识库/20-疗愈体系/10-议题层/01-财富议题体系框架.md#55-承载力不足
      needs_backfill_from:
        - ACT就这么简单
        - 心理自助CBT书系
        - 创伤与复原
        - 格式塔心理咨询理论与实践
        - 谁在我家
    summary: 这条线索更像是在看，你是否有机会和资源进来，但还需要一个更稳的容器去接住它们。
    typical_signals:
      - 看起来能接到一些机会，但不一定接得住、留得住。
      - 资源一多，内在反而容易更忙、更紧。
      - 收入刚有起色，新的支出或压力就跟着出现。
      - 财富往前走的时候，焦虑也容易一起被带起来。
    report_language:
      - 这不一定是在说你没有财富能力，更像是在说“接住财富”的容器还需要再稳一点。
      - 当承载力还在长的时候，机会和收入来了，内在也可能跟着紧张起来。
    healing_direction:
      - 先让自己有一点点稳定感，再去接更多。
      - 可以从身体稳定和节奏稳定开始。
      - 让资源容器先变小而稳，再慢慢变大。
    visual_mapping_candidates:
      - 土弱或不成片可能映射到承载力不足。
      - 木无根可能映射到成长动力有但滋养不足。
    safety:
      avoid:
        - 不把存不住钱写成定论。
        - 不承诺任何财富保存结果。

  - id: wealth.low_action
    title: 行动力不足
    provenance:
      source_status: model_scaffold
      validation_status: pending_source_review
      evidence_refs:
        - projects/aimandala/docs/疗愈体系知识库/20-疗愈体系/10-议题层/01-财富议题体系框架.md#56-行动力不足
      needs_backfill_from:
        - ACT就这么简单
        - 心理自助CBT书系
        - 创伤与复原
        - 格式塔心理咨询理论与实践
        - 谁在我家
    summary: 用户可能有想法但落地少，行动容易被情绪、关系或自我怀疑打断。
    typical_signals:
      - 想法很多，但落地少。
      - 热情不持续。
      - 容易被情绪和关系拖走。
      - 计划常被外界标准、家庭关系或自我怀疑打断。
    report_language:
      - 财富流动需要行动承接；如果行动一再被打断，价值就很难真正进入现实交换。
      - 这里更像是在提醒你先恢复小步行动，而不是一次性逼自己完成很大的改变。
    healing_direction:
      - 行动力训练。
      - 每天一个低压力小行动。
      - 把计划拆成更小的现实步骤。
    visual_mapping_candidates:
      - 水火冲突可能映射到情绪消耗行动力。
      - 木无根可能映射到成长动力有但滋养不足。
    safety:
      avoid:
        - 不把行动力不足写成懒惰。
        - 不用命令式语气要求用户立刻改变。

  - id: wealth.low_world_connection
    title: 与世界链接不足
    provenance:
      source_status: model_scaffold
      validation_status: pending_source_review
      evidence_refs:
        - projects/aimandala/docs/疗愈体系知识库/20-疗愈体系/10-议题层/01-财富议题体系框架.md#57-与世界链接不足
      needs_backfill_from:
        - ACT就这么简单
        - 心理自助CBT书系
        - 创伤与复原
        - 格式塔心理咨询理论与实践
        - 谁在我家
    summary: 用户可能不愿意打开表达、合作、服务、市场或客户关系，倾向于一个人扛。
    typical_signals:
      - 不信任世界。
      - 不愿意打开人际链接。
      - 倾向于一个人扛。
      - 不愿意向外表达价值。
      - 对赚钱、客户、合作、市场缺少热爱。
    report_language:
      - 财富不是只发生在自己内部，它也需要和世界、他人、资源产生连接。
      - 如果你习惯一个人扛，价值可能已经存在，但还没有充分被表达和交换出去。
    healing_direction:
      - 与世界链接练习。
      - 小范围表达价值。
      - 练习合作、服务和真实呈现。
    visual_mapping_candidates:
      - 外圈状态可作为观察与世界链接的入口。
    safety:
      avoid:
        - 不强迫用户社交或合作。
        - 不把内向或谨慎写成问题。

  - id: wealth.receiving_and_pricing_pressure
    title: 不敢收钱与开价压力
    provenance:
      source_status: model_scaffold
      validation_status: pending_source_review
      evidence_refs:
        - projects/aimandala/docs/疗愈体系知识库/20-疗愈体系/10-议题层/11-财富议题手册.md#611-不敢收钱与开价压力
      needs_backfill_from:
        - 对财富说是
        - 格式塔心理咨询理论与实践
        - 心理自助CBT书系
    summary: 用户可能有价值和能力，但在收费、谈价、收礼或接受支持时容易紧张。
    typical_signals:
      - 不敢报价或谈薪。
      - 收钱时有亏欠感。
      - 接受支持时担心被评价。
      - 容易把自己的价值压低。
    report_language:
      - 这里更像是在提示“收”的动作会变紧：你不是没有价值，而是在把价值拿出来交换时容易退一步。
      - 如果收钱会触发亏欠、怕对方失望或怕被评价，财富流动就容易停在开口之前。
    healing_direction:
      - 练习说出自己的价格和边界。
      - 区分收钱和占别人便宜。
      - 从低压力的小额交换开始。
    visual_mapping_candidates:
      - 中圈缠绕可能映射到关系压力影响收费。
      - 外圈边界破损可能映射到交换边界不稳。
    safety:
      avoid:
        - 不替用户制定价格。
        - 不要求用户立刻涨价或谈判。

  - id: wealth.hardship_earning_belief
    title: 辛苦赚钱信念
    provenance:
      source_status: model_scaffold
      validation_status: pending_source_review
      evidence_refs:
        - projects/aimandala/docs/疗愈体系知识库/20-疗愈体系/10-议题层/11-财富议题手册.md#612-辛苦赚钱信念
      needs_backfill_from:
        - 对财富说是
        - 创伤与复原
        - ACT就这么简单
    summary: 用户可能把辛苦、牺牲、硬扛当成赚钱或获得回报的默认条件。
    typical_signals:
      - 只有很累才觉得自己配得到。
      - 不容易接受轻松、支持或顺流。
      - 把休息体验成不负责任。
      - 赚钱和身体透支绑定。
    report_language:
      - 财富在这里可能和“必须很用力才配得到”绑在一起。
      - 画面如果呈现压迫、厚重或过度填满，可以提示你观察：我是否把轻松和支持排除在财富之外。
    healing_direction:
      - 区分努力和透支。
      - 允许小范围轻松获得。
      - 观察身体是否把休息体验成危险。
    visual_mapping_candidates:
      - 外圈厚重深色可能映射到现实压力和负担感。
      - 画面过满可能映射到没有留出承接和恢复空间。
    safety:
      avoid:
        - 不否定努力。
        - 不鼓励用户放弃现实责任。

  - id: wealth.success_visibility_threat
    title: 有钱危险与成功压力
    provenance:
      source_status: model_scaffold
      validation_status: pending_source_review
      evidence_refs:
        - projects/aimandala/docs/疗愈体系知识库/20-疗愈体系/10-议题层/11-财富议题手册.md#613-有钱危险与成功压力
      needs_backfill_from:
        - 对财富说是
        - 谁在我家
        - 创伤与复原
    summary: 用户可能想要财富和成功，但也担心更多资源带来被看见、被要求、关系变化或压力。
    typical_signals:
      - 靠近机会时后退。
      - 害怕成功后被嫉妒、被要求或被孤立。
      - 想要更多，又担心关系失衡。
      - 被看见时兴奋和紧张并存。
    report_language:
      - 这不一定是在说你不想要财富，也可能是在说“更多”会带来压力。
      - 成功、被看见、被需要，有时会让人同时兴奋和后退。
    healing_direction:
      - 观察成功带来的关系想象。
      - 区分真实风险和旧经验投射。
      - 逐步练习被看见。
    visual_mapping_candidates:
      - 内圈收缩外圈强可能映射到想外放但内在紧张。
      - 外圈明亮但边界厚重可能映射到曝光与防御并存。
    safety:
      avoid:
        - 不把成功恐惧写成定论。
        - 不承诺用户会成功或变有钱。

  - id: wealth.resource_leakage
    title: 保存困难与资源外泄
    provenance:
      source_status: model_scaffold
      validation_status: pending_source_review
      evidence_refs:
        - projects/aimandala/docs/疗愈体系知识库/20-疗愈体系/10-议题层/11-财富议题手册.md#614-保存困难与资源外泄
      needs_backfill_from:
        - 对财富说是
        - 心理自助CBT书系
        - 创伤与复原
    summary: 用户可能有资源进入，但容易被外界需求、关系压力、临时情绪或现实负担带走。
    typical_signals:
      - 钱、时间或精力进来后很快散掉。
      - 容易替别人承担。
      - 难以建立稳定资源容器。
      - 外界需求一来就打乱自己的节奏。
    report_language:
      - 从财富议题看，这里更像是在提示资源容器不够稳。
      - 钱、时间、精力或机会进来以后，可能很快被外界需求、关系消耗或临时压力带走。
    healing_direction:
      - 练习资源边界。
      - 记录资源流入和流出。
      - 先守住一个小范围承接容器。
    visual_mapping_candidates:
      - 外圈缺口破损可能映射到资源外泄。
      - 外圈碎点和留白可能映射到现实流动零散。
    safety:
      avoid:
        - 不判断用户存款或真实支出。
        - 不做财务规划承诺。

  - id: wealth.exchange_boundary_imbalance
    title: 付出失衡与交换边界
    provenance:
      source_status: model_scaffold
      validation_status: pending_source_review
      evidence_refs:
        - projects/aimandala/docs/疗愈体系知识库/20-疗愈体系/10-议题层/11-财富议题手册.md#615-付出失衡与交换边界
      needs_backfill_from:
        - 格式塔心理咨询理论与实践
        - 谁在我家
        - 对财富说是
    summary: 用户可能容易多给、少收、不好意思拒绝，把被喜欢和被认可放在公平交换之前。
    typical_signals:
      - 容易过度付出。
      - 对拒绝和谈边界紧张。
      - 服务、合作或关系里不太会收回报。
      - 害怕坚持价格或条件会破坏关系。
    report_language:
      - 这条关系线索放到财富里，更像是在看交换边界。
      - 你是否容易先照顾别人，再考虑自己的价值、价格和承受范围，值得被温和观察。
    healing_direction:
      - 小范围练习拒绝。
      - 把付出和交换写清楚。
      - 观察讨好和收费之间的关系。
    visual_mapping_candidates:
      - 中圈线条缠绕可能映射到关系拉扯。
      - 外圈边界缺口可能映射到交换边界不清。
    safety:
      avoid:
        - 不指责用户讨好。
        - 不要求用户切断关系。

  - id: wealth.value_expression_block
    title: 价值表达受阻
    provenance:
      source_status: model_scaffold
      validation_status: pending_source_review
      evidence_refs:
        - projects/aimandala/docs/疗愈体系知识库/20-疗愈体系/10-议题层/11-财富议题手册.md#616-价值表达受阻
      needs_backfill_from:
        - ACT就这么简单
        - 格式塔心理咨询理论与实践
        - 对财富说是
    summary: 这条线索更像是在看，你的价值已经存在，但还没有完全被整理成别人能看见、理解并愿意交换的样子。
    typical_signals:
      - 明明有能力，却还没怎么让别人看见。
      - 说到自己能提供什么时，容易先卡一下。
      - 外界还不太容易抓住你的真正价值。
      - 热情是有的，但还没完全长成清晰的交付方式。
    report_language:
      - 你的价值很可能已经在了，只是还在等一个更清楚的表达方式。
      - 财富流动不只靠能力，也需要让别人有机会看见它、理解它、接住它。
    healing_direction:
      - 可以先试着把一个小价值说清楚、讲明白。
      - 不用一下子做很大，先让一个小作品或一个小想法被看见。
      - 练习把自己的能力翻成别人听得懂的话。
    visual_mapping_candidates:
      - 外圈留白多可能映射到对外表达不足。
      - 中心清晰但外圈弱可能映射到内在有价值但外化不足。
    safety:
      avoid:
        - 不把内向写成问题。
        - 不承诺市场反馈或客户结果。

  - id: wealth.scattered_goals
    title: 目标混乱与能量分散
    provenance:
      source_status: model_scaffold
      validation_status: pending_source_review
      evidence_refs:
        - projects/aimandala/docs/疗愈体系知识库/20-疗愈体系/10-议题层/11-财富议题手册.md#617-目标混乱与能量分散
      needs_backfill_from:
        - ACT就这么简单
        - 心理自助CBT书系
    summary: 用户可能同时想抓住太多方向，财富行动缺少主线。
    typical_signals:
      - 想法很多但难以聚焦。
      - 财富目标彼此冲突。
      - 行动容易换方向。
      - 能量被多个目标拉散。
    report_language:
      - 这里更像是在提示财富能量分散：不是没有想法，而是同时想抓住太多方向，反而让行动难以形成稳定主线。
      - 当前更需要先选一个小主轴，而不是同时证明所有可能性。
    healing_direction:
      - 先选一个低风险主线。
      - 暂停同时推进过多目标。
      - 用 7 天观察一个方向是否有能量。
    visual_mapping_candidates:
      - 画面碎点多可能映射到能量分散。
      - 色块分割明显可能映射到取舍两难。
    safety:
      avoid:
        - 不否定多元兴趣。
        - 不替用户做职业或商业决策。

  - id: wealth.difficulty_receiving_support
    title: 接受支持困难
    provenance:
      source_status: model_scaffold
      validation_status: pending_source_review
      evidence_refs:
        - projects/aimandala/docs/疗愈体系知识库/20-疗愈体系/10-议题层/11-财富议题手册.md#618-接受支持困难
      needs_backfill_from:
        - 谁在我家
        - 创伤与复原
        - 对财富说是
    summary: 用户可能习惯一个人扛，不容易接受帮助、资源、合作、礼物、推荐或机会。
    typical_signals:
      - 习惯自己扛。
      - 不太会接受帮助。
      - 害怕欠人情。
      - 只允许自己付出，不太允许被支持。
    report_language:
      - 财富不只来自自己用力，也来自能否接受合适的支持。
      - 如果你只允许自己付出、不太允许被支持，财富流动就容易只剩消耗，不容易形成互惠。
    healing_direction:
      - 练习接受一个小支持。
      - 区分支持和亏欠。
      - 看见合作中的互惠关系。
    visual_mapping_candidates:
      - 边框完整厚重可能映射到防御和自我保护强。
      - 外圈断开可能映射到支持通道不稳定。
    safety:
      avoid:
        - 不要求用户信任所有人。
        - 不否定必要的边界和谨慎。

safety:
  global_avoid:
    - 不把财富解读写成财务预测。
    - 不承诺收入、客户、成交或投资结果。
    - 不把金钱模式写成固定人格缺陷。
    - 不把单一画面信号直接等同于财富结论。
