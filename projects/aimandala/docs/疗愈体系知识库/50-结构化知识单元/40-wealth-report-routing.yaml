visual_signal_routes:
  - signal_id: visual.outer_red_or_fire_excess
    label: 外圈红色或火能量明显
    match_keywords:
      any:
        - [外圈, 红]
        - [外圈, 火]
        - [外圈, 热]
    source_refs:
      - 90-财富议题案例反推.md#外圈红色多
      - 40-组合模式/12-高频组合模式.md#2-火一块一块被金截断
    candidate_clauses:
      - wealth.emotional_spending
      - wealth.low_action
    candidate_modules:
      - wealth.emotion_spending_protective_habits
      - wealth.body_fear_action
    use_as: candidate_mapping
    report_boundary: 只能说可能存在外放、消耗或情绪带动消费，不能直接断言用户现实漏财。

  - signal_id: visual.weak_fire_many
    label: 弱火多
    match_keywords:
      any:
        - [弱火]
        - [火弱]
        - [淡红]
    source_refs:
      - 40-组合模式/12-高频组合模式.md#5-弱火多
    candidate_clauses:
      - wealth.approval_driven_earning
      - wealth.emotional_spending
    candidate_modules:
      - wealth.deservingness_self_worth
      - wealth.emotion_spending_protective_habits
    use_as: candidate_mapping
    report_boundary: 适合表达渴望被看见、被认可或被情绪影响，不能写成固定人格结论。

  - signal_id: visual.metal_excess
    label: 金多
    match_keywords:
      any:
        - [金多]
        - [白色, 多]
        - [金色, 多]
    source_refs:
      - 40-组合模式/12-高频组合模式.md#6-金多
    candidate_clauses:
      - wealth.low_deservingness
      - wealth.approval_driven_earning
    candidate_modules:
      - wealth.deservingness_self_worth
      - wealth.career_value_exchange
    use_as: candidate_mapping
    report_boundary: 适合表达标准、评判和证明压力，不能否定用户努力和现实目标。

  - signal_id: visual.weak_or_fragmented_earth
    label: 土弱或土零散不成片
    match_keywords:
      any:
        - [土弱]
        - [土零散]
        - [不成片]
        - [整体, 不成片]
    source_refs:
      - 90-财富议题案例反推.md#财富承载力不足
      - 40-组合模式/12-高频组合模式.md#7-土零散不成片
    candidate_clauses:
      - wealth.low_capacity
      - wealth.scarcity_and_insecurity
    candidate_modules:
      - wealth.safety_scarcity_control
      - wealth.body_fear_action
    use_as: candidate_mapping
    report_boundary: 只能说承接、稳定和资源容器可能需要加强，不能预测存款或财富结果。

  - signal_id: visual.water_fire_conflict
    label: 水火相冲
    match_keywords:
      any:
        - [水火]
        - [冲突]
        - [红, 蓝]
    source_refs:
      - 40-组合模式/12-高频组合模式.md#8-水火相冲
    candidate_clauses:
      - wealth.low_action
      - wealth.emotional_spending
      - wealth.scarcity_and_insecurity
    candidate_modules:
      - wealth.body_fear_action
      - wealth.emotion_spending_protective_habits
      - wealth.safety_scarcity_control
    use_as: candidate_mapping
    report_boundary: 适合表达热情与恐惧、行动与情绪之间的拉扯，不能写成医学或心理诊断。

  - signal_id: visual.rootless_wood
    label: 木无根
    match_keywords:
      any:
        - [木无根]
        - [无根]
        - [绿色, 漂]
    source_refs:
      - 40-组合模式/12-高频组合模式.md#3-木无根
    candidate_clauses:
      - wealth.low_action
      - wealth.low_capacity
    candidate_modules:
      - wealth.body_fear_action
      - wealth.passion_needs_abundance
    use_as: candidate_mapping
    report_boundary: 适合表达成长动力有但滋养不足，不能写成用户没有能力。

  - signal_id: visual.fragmented_white_or_metal_cut
    label: 白色割裂或金截断
    match_keywords:
      any:
        - [白色, 割裂]
        - [白色, 截断]
        - [割裂]
        - [截断]
    source_refs:
      - 40-组合模式/12-高频组合模式.md#1-白色把其他颜色割裂开
    candidate_clauses:
      - wealth.approval_driven_earning
      - wealth.low_action
    candidate_modules:
      - wealth.deservingness_self_worth
      - wealth.body_fear_action
    use_as: candidate_mapping
    report_boundary: 适合表达标准、信息或行动被打断，不能只凭截断信号生成财富结论。

  - signal_id: visual.outer_world_closed_or_blank
    label: 外圈留白多或对外表达弱
    match_keywords:
      any:
        - [外圈, 留白]
        - [外圈, 空白]
        - [外圈, 表达弱]
    source_refs:
      - 40-组合模式/12-高频组合模式.md#10-紫色单一且留白多
    candidate_clauses:
      - wealth.low_world_connection
      - wealth.low_action
    candidate_modules:
      - wealth.world_connection_market
      - wealth.career_value_exchange
    use_as: candidate_mapping
    report_boundary: 适合表达现实连接、行动或价值交换不足，不能把内向、学习或灵性倾向写成问题。

  - signal_id: visual.inner_contracted_outer_strong
    label: 内圈收缩而外圈强
    match_keywords:
      any:
        - [内圈, 收缩, 外圈]
        - [里圈, 收缩, 外圈]
        - [内圈, 小, 外圈, 强]
    source_refs:
      - 11-财富议题手册.md#613-有钱危险与成功压力
      - 11-财富议题手册.md#33-配得感与自我价值
    candidate_clauses:
      - wealth.success_visibility_threat
      - wealth.low_deservingness
      - wealth.low_capacity
    candidate_modules:
      - wealth.deservingness_self_worth
      - wealth.body_fear_action
      - wealth.world_connection_market
    use_as: candidate_mapping
    report_boundary: 适合表达想向外发展但内在承接紧张，不能断言用户害怕成功。

  - signal_id: visual.middle_tangled_relationship_pull
    label: 中圈缠绕或关系拉扯
    match_keywords:
      any:
        - [中圈, 缠绕]
        - [中圈, 拉扯]
        - [中圈, 断裂]
        - [关系, 拉扯]
    source_refs:
      - 02-画面分析基础.md#中圈气人情绪层
      - 11-财富议题手册.md#615-付出失衡与交换边界
    candidate_clauses:
      - wealth.exchange_boundary_imbalance
      - wealth.receiving_and_pricing_pressure
      - wealth.emotional_spending
    candidate_modules:
      - wealth.world_connection_market
      - wealth.career_value_exchange
      - wealth.emotion_spending_protective_habits
    use_as: candidate_mapping
    report_boundary: 适合把关系拉扯回译为交换边界、开价压力或情绪消耗，不能展开成亲密关系报告。

  - signal_id: visual.outer_boundary_broken
    label: 外圈边界缺口或破损
    match_keywords:
      any:
        - [外圈, 缺口]
        - [外圈, 破损]
        - [边框, 缺口]
        - [边界, 破损]
    source_refs:
      - 02-画面分析基础.md#外圈形地现实层
      - 11-财富议题手册.md#614-保存困难与资源外泄
    candidate_clauses:
      - wealth.resource_leakage
      - wealth.exchange_boundary_imbalance
      - wealth.low_world_connection
    candidate_modules:
      - wealth.safety_scarcity_control
      - wealth.world_connection_market
      - wealth.career_value_exchange
    use_as: candidate_mapping
    report_boundary: 适合表达资源边界和现实承接不稳，不能判断用户真实存款、支出或债务。

  - signal_id: visual.outer_boundary_thick_closed
    label: 外圈边界厚重闭合
    match_keywords:
      any:
        - [外圈, 厚重]
        - [边框, 厚重]
        - [边界, 闭合]
        - [外圈, 闭合]
    source_refs:
      - 02-画面分析基础.md#外圈形地现实层
      - 11-财富议题手册.md#618-接受支持困难
    candidate_clauses:
      - wealth.difficulty_receiving_support
      - wealth.scarcity_and_insecurity
      - wealth.success_visibility_threat
    candidate_modules:
      - wealth.safety_scarcity_control
      - wealth.world_connection_market
      - wealth.parents_family_money_scripts
    use_as: candidate_mapping
    report_boundary: 适合表达防御、谨慎和支持通道收紧，不能把自我保护写成问题。

  - signal_id: visual.fragmented_dots_scattered_energy
    label: 碎点多或能量分散
    match_keywords:
      any:
        - [碎点]
        - [零散, 小点]
        - [能量, 分散]
        - [方向, 分散]
    source_refs:
      - 11-财富议题手册.md#617-目标混乱与能量分散
      - 90-财富议题案例反推.md
    candidate_clauses:
      - wealth.scattered_goals
      - wealth.resource_leakage
      - wealth.low_action
    candidate_modules:
      - wealth.body_fear_action
      - wealth.passion_needs_abundance
      - wealth.safety_scarcity_control
    use_as: candidate_mapping
    report_boundary: 适合表达目标、行动或资源分散，不能替用户做职业或商业取舍。

  - signal_id: visual.center_clear_outer_weak
    label: 中心清晰但外圈弱
    match_keywords:
      any:
        - [中心, 清晰, 外圈, 弱]
        - [内圈, 清晰, 外圈, 留白]
        - [中心, 稳, 外圈, 空]
    source_refs:
      - 11-财富议题手册.md#616-价值表达受阻
      - 11-财富议题手册.md#311-世界链接客户市场与合作
    candidate_clauses:
      - wealth.value_expression_block
      - wealth.low_world_connection
      - wealth.low_action
    candidate_modules:
      - wealth.career_value_exchange
      - wealth.world_connection_market
      - wealth.passion_needs_abundance
    use_as: candidate_mapping
    report_boundary: 适合表达内在价值尚未充分外化，不能承诺市场反馈、客户或成交结果。

  - signal_id: visual.heavy_overfilled_composition
    label: 画面厚重或过度填满
    match_keywords:
      any:
        - [厚重]
        - [过满]
        - [填满]
        - [压迫]
    source_refs:
      - 11-财富议题手册.md#612-辛苦赚钱信念
      - 02-画面分析基础.md#外圈形地现实层
    candidate_clauses:
      - wealth.hardship_earning_belief
      - wealth.scarcity_and_insecurity
      - wealth.low_capacity
    candidate_modules:
      - wealth.safety_scarcity_control
      - wealth.body_fear_action
      - wealth.money_beliefs
    use_as: candidate_mapping
    report_boundary: 适合表达用力、负担和休息困难，不能否定用户现实努力或责任。

  - signal_id: visual.color_blocks_split
    label: 色块分割明显
    match_keywords:
      any:
        - [色块, 分割]
        - [分割, 明显]
        - [取舍, 两难]
        - [内心, 矛盾]
    source_refs:
      - 02-画面分析基础.md#中圈气人情绪层
      - 11-财富议题手册.md#617-目标混乱与能量分散
    candidate_clauses:
      - wealth.scattered_goals
      - wealth.low_action
      - wealth.success_visibility_threat
    candidate_modules:
      - wealth.body_fear_action
      - wealth.passion_needs_abundance
      - wealth.deservingness_self_worth
    use_as: candidate_mapping
    report_boundary: 适合表达取舍两难和行动主线不清，不能替用户做现实选择。

report_section_routes:
  - section_id: wealth.report.overall_intuition
    section_name: 整体直觉
    purpose: 先写第一眼印象，再给后续判断留出画面依据。
    input_sources:
      - visual_observations.overall
      - visual_observations.colors
      - visual_observations.shapes
    preferred_outputs:
      - 画面总感
      - 主色调
      - 圈层整体收缩或外放
    avoid:
      - 不直接下财务判断。
      - 不提前展开根因链。

  - section_id: wealth.report.mainline_confirmation
    section_name: 财富主线确认
    purpose: 说明本次报告围绕的财富状态。
    input_sources:
      - wealth.low_deservingness
      - wealth.scarcity_and_insecurity
      - wealth.low_capacity
      - wealth.low_action
      - wealth.low_world_connection
    preferred_outputs:
      - 配得感
      - 安全感
      - 承载力
      - 行动力
      - 与世界连接
    avoid:
      - 不写成收入高低判断。

  - section_id: wealth.report.circle_reading
    section_name: 三圈财富读法
    purpose: 分别看内圈、中圈、外圈的财富含义。
    input_sources:
      - visual.inner_contracted_outer_strong
      - visual.middle_tangled_relationship_pull
      - visual.outer_boundary_broken
      - visual.outer_boundary_thick_closed
      - visual.outer_world_closed_or_blank
    preferred_outputs:
      - 内圈
      - 中圈
      - 外圈
      - 三圈联动关系
    avoid:
      - 不把三圈读法混成单点结论。

  - section_id: wealth.report.mechanism_analysis
    section_name: 机制拆解
    purpose: 解释财富为何这样卡住。
    input_sources:
      - wealth.low_deservingness
      - wealth.scarcity_and_insecurity
      - wealth.approval_driven_earning
      - wealth.emotional_spending
      - wealth.low_capacity
      - wealth.low_action
      - wealth.low_world_connection
    preferred_outputs:
      - 财富卡点机制
      - 反复出现的模式
      - 现实可感的压力源
    avoid:
      - 不把机制写成定性结论。

  - section_id: wealth.report.emergent_topic_rewrite
    section_name: 浮现议题回译
    purpose: 把关系、家庭、情绪、身体和事业翻回财富主线。
    input_sources:
      - wealth.emergent.self_worth
      - wealth.emergent.family
      - wealth.emergent.relationship
      - wealth.emergent.emotion_regulation
      - wealth.emergent.body_safety
      - wealth.emergent.career_value_expression
    preferred_outputs:
      - 价值交换
      - 金钱脚本
      - 情绪型漏财
      - 承载力
      - 价值表达
    avoid:
      - 不展开成其他主题报告。

  - section_id: wealth.report.real_life_expression
    section_name: 现实表现
    purpose: 把机制翻译成用户现实里可能对得上的样子。
    input_sources:
      - wealth.emotional_spending
      - wealth.low_action
      - wealth.low_capacity
      - wealth.value_expression_block
      - wealth.scattered_goals
    preferred_outputs:
      - 更容易为情绪买单
      - 想行动但行动被打断
      - 有价值但不易外化
      - 现实里更紧绷或更分散
    avoid:
      - 不写财务预测。

  - section_id: wealth.report.growth_window
    section_name: 生机
    purpose: 保留可用力量和下一步出口。
    input_sources:
      - wealth.passion_needs_abundance
      - wealth.value_expression_block
      - wealth.low_action
      - wealth.low_world_connection
    preferred_outputs:
      - 热情
      - 真实需要
      - 表达路径
      - 稳定行动
      - 承载力扩容
    avoid:
      - 不把生机写成承诺结果。

  - section_id: wealth.report.adjustment_suggestions
    section_name: 调整建议
    purpose: 给低风险动作和观察入口。
    input_sources:
      - wealth.safety_scarcity_control
      - wealth.body_fear_action
      - wealth.emotion_spending_protective_habits
      - wealth.world_connection_market
    preferred_outputs:
      - 觉察记录
      - 小步行动
      - 边界练习
      - 支持练习
    avoid:
      - 不替用户做决策。
      - 不扩成完整方案。


  - section_id: wealth.report.next_mandala_exploration
    section_name: 下一次曼陀罗探索建议
    purpose: 基于本次画面中浮现但未完全展开的线索，推荐 0-2 个下一次探索方向。
    input_sources:
      - wealth.emergent.self_worth
      - wealth.emergent.family
      - wealth.emergent.relationship
      - wealth.emergent.emotion_regulation
      - wealth.emergent.body_safety
      - wealth.emergent.career_value_expression
    preferred_outputs:
      - 推荐方向
      - 下次意图
      - 画面依据
      - 本次不展开的原因
    mode_limits:
      lite_max: 1
      pro_max: 2
    selection_rules:
      - 优先推荐与本次财富主线关系最强的浮现机制。
      - 优先推荐画面证据最清楚、但本次报告没有展开完整解读的方向。
      - 用户输入已经提到但本次没有展开的方向优先级提升。
      - 证据不足时可以不推荐。
    avoid:
      - 不制造焦虑式复购。
      - 不说用户一定有父亲、母亲、亲密关系或身体问题。
      - 不同时推荐过多方向。
      - 不把下一次探索建议写成当前报告的确定结论。

clause_report_blocks:
  - clause_id: wealth.low_deservingness
    title: 配得感不足
    primary_sections:
      - 财富主线确认
      - 机制拆解
      - 浮现议题回译
    lite_use: 作为主线或辅助线索，说明是否允许自己拥有、收取和被看见。
    pro_use: 连接内圈状态、自我价值、求认可和收受能力，解释价值进入财富流动前的内在许可。
    expression_focus:
      - 值不值得拥有
      - 是否允许自己被支付
      - 价值能否被稳定接住
    avoid:
      - 不写成用户没有价值。

  - clause_id: wealth.scarcity_and_insecurity
    title: 匮乏感和安全感不足
    primary_sections:
      - 财富主线确认
      - 机制拆解
      - 现实表现
    lite_use: 用于快速命中钱和安全感绑得过紧的状态。
    pro_use: 展开钱如何承载安全、控制、焦虑和身体紧绷，并回到承载力与行动节奏。
    expression_focus:
      - 钱替安全感工作
      - 有资源也不一定安心
      - 越重要越紧绷
    avoid:
      - 不判断用户真实财务安全。

  - clause_id: wealth.approval_driven_earning
    title: 求认可式赚钱
    primary_sections:
      - 机制拆解
      - 浮现议题回译
      - 现实表现
    lite_use: 作为求认可、怕评价或证明自己的辅助解释。
    pro_use: 连接金能量、标准感、价值表达和关系评价，解释行动为什么变用力。
    expression_focus:
      - 收入结果和自我评价绑定
      - 为了被认可而用力
      - 外界标准牵动财富行动
    avoid:
      - 不否定努力赚钱。

  - clause_id: wealth.emotional_spending
    title: 情绪型漏财
    primary_sections:
      - 机制拆解
      - 浮现议题回译
      - 现实表现
      - 调整建议
    lite_use: 可作为 Lite 的主线之一，但必须使用缓冲语气。
    pro_use: 连接火能量、情绪出口、消费安抚、行动中断和资源保存困难。
    expression_focus:
      - 钱替情绪出口工作
      - 消费或拖延承担安抚功能
      - 资源容易被当下感受带走
    avoid:
      - 不写用户乱花钱。

  - clause_id: wealth.low_capacity
    title: 承载力不足
    primary_sections:
      - 财富主线确认
      - 机制拆解
      - 生机
      - 调整建议
    lite_use: 用于表达接住、保存和稳定承载还需要变稳。
    pro_use: 结合土能量、外圈现实状态、身体承接和资源容器，解释有资源但不稳的模式。
    expression_focus:
      - 接住财富的容器
      - 资源进入后的稳定性
      - 承载力扩容
    avoid:
      - 不预测存款、收入或保存结果。

  - clause_id: wealth.low_action
    title: 行动力不足
    primary_sections:
      - 财富主线确认
      - 机制拆解
      - 现实表现
      - 调整建议
    lite_use: 用于解释想法有但落地少，建议只给小步行动。
    pro_use: 连接木火动力、情绪中断、关系牵引和现实执行路径。
    expression_focus:
      - 行动被打断
      - 价值难以进入现实交换
      - 小步恢复行动
    avoid:
      - 不写成懒惰或不努力。

  - clause_id: wealth.low_world_connection
    title: 与世界链接不足
    primary_sections:
      - 财富主线确认
      - 三圈财富读法
      - 生机
    lite_use: 用于提示价值需要被世界看见，但不要求用户外向。
    pro_use: 结合外圈状态、表达路径、市场连接、合作和支持通道。
    expression_focus:
      - 价值需要外化
      - 与人、资源和机会连接
      - 世界能否回应用户的价值
    avoid:
      - 不把内向或谨慎写成问题。

  - clause_id: wealth.receiving_and_pricing_pressure
    title: 不敢收钱与开价压力
    primary_sections:
      - 机制拆解
      - 浮现议题回译
      - 调整建议
    lite_use: 只作为收费、收受和价值交换的提示，不给具体价格建议。
    pro_use: 连接关系评价、价值表达、交换边界和收受能力。
    expression_focus:
      - 收的动作变紧
      - 价值拿出来交换时后退
      - 开价和边界压力
    avoid:
      - 不替用户制定价格。

  - clause_id: wealth.hardship_earning_belief
    title: 辛苦赚钱信念
    primary_sections:
      - 机制拆解
      - 现实表现
      - 调整建议
    lite_use: 作为厚重、过满、压迫感的辅助解释。
    pro_use: 连接身体透支、责任感、安全感和“必须很用力才配得到”的信念。
    expression_focus:
      - 必须辛苦才配得到
      - 休息和支持被排除
      - 努力与透支的边界
    avoid:
      - 不否定现实责任和努力。

  - clause_id: wealth.success_visibility_threat
    title: 有钱危险与成功压力
    primary_sections:
      - 机制拆解
      - 浮现议题回译
      - 现实表现
    lite_use: Lite 中只点到“更多会带来压力”，不展开家庭或关系长链。
    pro_use: 展开成功、被看见、关系变化、防御和内外不一致。
    expression_focus:
      - 想要更多又担心更多
      - 被看见同时兴奋和后退
      - 成功带来的关系想象
    avoid:
      - 不断言用户害怕成功。

  - clause_id: wealth.resource_leakage
    title: 保存困难与资源外泄
    primary_sections:
      - 财富主线确认
      - 三圈财富读法
      - 现实表现
      - 调整建议
    lite_use: 可作为“存不住、散得快”的主线，但不能写成现实财务结论。
    pro_use: 结合外圈缺口、边界、关系消耗、情绪消耗和资源容器。
    expression_focus:
      - 资源进来后容易散
      - 外界需求打乱节奏
      - 建立小范围承接容器
    avoid:
      - 不判断真实存款、支出或债务。

  - clause_id: wealth.exchange_boundary_imbalance
    title: 付出失衡与交换边界
    primary_sections:
      - 机制拆解
      - 浮现议题回译
      - 调整建议
    lite_use: 用于中圈关系拉扯或外圈边界弱时的关系回译。
    pro_use: 展开多给少收、拒绝压力、收费压力和资源互惠。
    expression_focus:
      - 先照顾别人再考虑自己
      - 价值、价格和承受范围
      - 付出与交换是否清楚
    avoid:
      - 不指责用户讨好。

  - clause_id: wealth.value_expression_block
    title: 价值表达受阻
    primary_sections:
      - 财富主线确认
      - 三圈财富读法
      - 生机
      - 调整建议
    lite_use: 作为“有价值但没有外化”的温和主线。
    pro_use: 结合中心清晰、外圈弱、表达路径、作品服务和市场理解。
    expression_focus:
      - 价值已经存在
      - 价值需要被整理成可交换形式
      - 表达路径和交付路径
    avoid:
      - 不承诺客户、成交或市场反馈。

  - clause_id: wealth.scattered_goals
    title: 目标混乱与能量分散
    primary_sections:
      - 机制拆解
      - 现实表现
      - 调整建议
    lite_use: 用于解释能量分散和行动主线不清，建议只给一个小主轴。
    pro_use: 连接碎点、色块分割、多方向拉扯、选择压力和行动不连续。
    expression_focus:
      - 同时想抓太多方向
      - 行动难以形成稳定主线
      - 先选一个低风险方向
    avoid:
      - 不替用户做职业或商业取舍。

  - clause_id: wealth.difficulty_receiving_support
    title: 接受支持困难
    primary_sections:
      - 机制拆解
      - 浮现议题回译
      - 生机
      - 调整建议
    lite_use: 作为边界厚重、自我保护强或支持通道弱的提示。
    pro_use: 连接防御、家庭责任、关系互惠、合作和允许被支持。
    expression_focus:
      - 习惯一个人扛
      - 支持和亏欠的区分
      - 财富也来自合适支持
    avoid:
      - 不要求用户信任所有人。

module_selection:
  lite:
    max_primary_modules: 2
    max_issue_clauses: 2
    required:
      - 至少 3 条画面依据。
      - 至少 1 个财富知识模块。
      - 至少 1 条低压小步建议。
    avoid:
      - 展开复杂根因链。
      - 同时塞入过多 `source_needed` 模块。

  pro:
    max_primary_modules: 5
    max_issue_clauses: 4
    required:
      - 说明核心主轴。
      - 逐圈解释财富相关信号。
      - 连接至少 2 个财富知识模块。
      - 给出阶段性调节方向。
    avoid:
      - 把来源不足模块写成确定机制。
      - 把报告写成完整主题方案或 21 天计划。

ranking_rules:
  - 用户明确问题优先于画面候选信号。
  - 三圈位置影响解释权重：里圈偏内在感受，中圈偏关系与能量流动，外圈偏行动、物质和对外呈现。
  - 多个画面信号共同指向同一条款时，该条款优先级提升。
  - 单一画面信号只能生成候选解释，不生成强结论。
  - source_supported_draft 模块优先于 ai_draft 和 source_needed 模块。
  - source_needed 模块只在用户问题或画面信号高度相关时进入报告，并使用追问式表达。

report_language_rules:
  translation_rule:
    - 先判断当前信号在财富主线中的作用，再决定是否提及其他议题。
    - 浮现议题可以出现，但必须服务于财富解释，不得抢占主叙事。
    - 若提及健康、关系、情绪或家庭，只能写成财富机制的背景，不单独展开成另一份报告。
  required_phrases:
    - 从画面看起来
    - 可能
    - 更像是
    - 值得观察
  avoid_phrases:
    - 你一定
    - 这说明你就是
    - 你的财富一定会
    - 你必须
  evidence_order:
    - 先写画面观察。
    - 再写财富模块解释。
    - 若有浮现议题，先翻译成财富机制，再简短提及背景议题。
    - 再写用户可观察的现实表现。
    - 最后给低风险建议和可选的下一次曼陀罗探索方向。

safety:
  global_avoid:
    - 不判断用户收入、资产、债务、投资前景或职业成败。
    - 不给买卖、辞职、创业、借贷、融资等决策建议。
    - 不把父母、家庭、身体或画面符号写成确定因果。
    - 不把同一作者体系内部观点写成完整疗愈体系共识。
    - 不对创伤、成瘾、债务危机、家庭暴力或自伤风险做 AI 单独处理。
  fallback:
    high_risk: 触发外部专业支持引导，不生成深度财富报告。
    insufficient_visual_evidence: 只输出已确认观察和可能方向，不补写细节。
    theme_unclear: 先确认主题，再进入财富 routing。

quality_checks:
  - 是否明确 `user_theme` 为财富。
  - 是否至少引用一个可见画面信号。
  - 是否说明选中的财富模块或条款。
  - 是否把 `ai_draft` 和 `source_needed` 降级表达。
  - 是否保留 Lite / Pro 边界。
  - 是否避免财务建议、心理诊断和确定性承诺。

next_exploration_recommendations:
  policy:
    lite_max: 1
    pro_max: 2
    allow_none_when_evidence_weak: true
