purpose:
  - 当 `user_theme` 为 `财富` 时，提供主题级检索和组装规则。
  - 把画面信号、财富议题翻译层、财富条款和报告结构接起来。
  - 限制财富报告只生成解读和轻量建议，不输出财务、职业或投资决策。
  - 先锚定财富主议题，再把情绪、关系、身体、家庭等浮现议题翻译回财富主线。

status_policy:
  source_supported_draft: 可以用于报告草稿表达，但必须保留缓冲语气和画面依据。
  ai_draft: 只能作为候选解释或追问线索，不能写成确定结论。
  source_needed: 只能提示为后续探索方向，不应作为核心判断输出。
  cross_source_validated: 当前财富主题暂不使用，后续需由证据长表升级后再开放。

knowledge_modules:
  - module_id: wealth.money_projection
    title: 金钱本质与投射
    handbook_ref: 11-财富议题手册.md#31-金钱本质与投射
    status: source_supported_draft
    report_use: 解释钱承载的安全、自由、尊严、被支持等心理含义。
    output_strength: normal

  - module_id: wealth.money_beliefs
    title: 金钱信念与无意识脚本
    handbook_ref: 11-财富议题手册.md#32-金钱信念与无意识脚本
    status: source_supported_draft
    report_use: 识别辛苦赚钱、有钱危险、更多才安全、钱留不住等脚本。
    output_strength: normal

  - module_id: wealth.deservingness_self_worth
    title: 配得感与自我价值
    handbook_ref: 11-财富议题手册.md#33-配得感与自我价值
    status: source_supported_draft
    report_use: 解释是否允许自己拥有、收取、被支付、被看见。
    output_strength: normal

  - module_id: wealth.safety_scarcity_control
    title: 安全感、匮乏与控制
    handbook_ref: 11-财富议题手册.md#34-安全感匮乏与控制
    status: source_supported_draft
    report_use: 解释钱是否在替安全感工作，以及紧绷和控制感如何影响财富流动。
    output_strength: normal

  - module_id: wealth.parents_family_money_scripts
    title: 父母关系与家庭金钱脚本
    handbook_ref: 11-财富议题手册.md#35-父母关系与家庭金钱脚本
    status: source_supported_draft
    report_use: 连接早期家庭中关于钱、成功、承担、收受和风险的学习。
    output_strength: cautious

  - module_id: wealth.family_loyalty_success_resistance
    title: 家族忠诚与不允许成功
    handbook_ref: 11-财富议题手册.md#36-家族忠诚与不允许成功
    status: ai_draft
    report_use: 作为成功、归属、超过父母或离开原家庭相关的追问线索。
    output_strength: weak

  - module_id: wealth.money_shame_receiving
    title: 金钱羞耻与不敢收钱
    handbook_ref: 11-财富议题手册.md#37-金钱羞耻与不敢收钱
    status: source_supported_draft
    report_use: 作为收费、开价、谈薪、收礼和接受支持相关的探索方向。
    output_strength: cautious

  - module_id: wealth.emotion_spending_protective_habits
    title: 情绪、消费与保护性习惯
    handbook_ref: 11-财富议题手册.md#38-情绪消费与保护性习惯
    status: ai_draft
    report_use: 把漏财、消费和拖延从道德评价降级为情绪和保护功能观察。
    output_strength: cautious

  - module_id: wealth.body_fear_action
    title: 身体连接、恐惧与行动力
    handbook_ref: 11-财富议题手册.md#39-身体连接恐惧与行动力
    status: source_supported_draft
    report_use: 解释想行动但身体收缩、机会来了却退回去等状态。
    output_strength: normal

  - module_id: wealth.career_value_exchange
    title: 事业、能力与价值交换
    handbook_ref: 11-财富议题手册.md#310-事业能力与价值交换
    status: source_supported_draft
    report_use: 连接能力表达、价值交换、服务边界和现实市场。
    output_strength: normal

  - module_id: wealth.world_connection_market
    title: 世界链接、客户、市场与合作
    handbook_ref: 11-财富议题手册.md#311-世界链接客户市场与合作
    status: source_needed
    report_use: 观察用户是否允许自己被世界看见、回应和选择。
    output_strength: weak

  - module_id: wealth.passion_needs_abundance
    title: 热情、真实需要与内在富足
    handbook_ref: 11-财富议题手册.md#312-热情真实需要与内在富足
    status: source_supported_draft
    report_use: 作为财富报告的生命力出口和生机表达来源。
    output_strength: normal

  - module_id: wealth.safety_boundary
    title: 风险边界与不做范围
    handbook_ref: 11-财富议题手册.md#313-风险边界与不做范围
    status: source_supported_draft
    report_use: 限制报告不进入财务建议、心理诊断、投资判断或确定性承诺。
    output_strength: required

