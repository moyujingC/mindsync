  # ===== Action 2 回填：金钱羞耻模块 =====
  # 《对财富说是》第二章：金钱羞耻与不敢收钱
  - evidence_id: wealth.money_shame.say_yes_to_money.spending_on_self_shame_01
    clause_id: wealth.money_shame
    source_id: healing.say_yes_to_money
    source_path: projects/research-center/kb/sources/healing/对财富说是
    source_location: 05-第二章是什么在制约你拥有金钱.md#把钱花在别人身上比花在自己身上更容易
    evidence_type: supports_concept
    support_level: direct
    summary: 第二章明确指出，有些人对钱会产生羞耻感，这种无意识态度会让人在意识层面想赚钱、无意识层面却破坏这一切；把钱花在自己身上会产生愤怒，而花给别人更容易。
    supported_part:
      - mechanism
      - report_language
    status: reviewed
    notes: 直接支持金钱羞耻机制。原文："有些人，他们对钱会产生羞耻感...把金钱花在自己身上，你会感觉愤怒"——这是报告表达"收的动作会触发羞耻、亏欠或被评价的压力"的核心来源。

  - evidence_id: wealth.money_shame.say_yes_to_money.intellectual_moral_shame_01
    clause_id: wealth.money_shame
    source_id: healing.say_yes_to_money
    source_path: projects/research-center/kb/sources/healing/对财富说是
    source_location: 05-第二章是什么在制约你拥有金钱.md#把钱花在别人身上比花在自己身上更容易
    evidence_type: supports_concept
    support_level: direct
    summary: 奥南朵指出，知识分子家庭、灵性家庭和高道德价值感家庭中，常有无意识信念认为"钱是低下的、让人羞耻的"，出身这类家庭的人更容易对钱抱持羞耻态度。
    supported_part:
      - mechanism
      - report_language
    status: reviewed
    notes: 可支持报告中"这种对钱的羞耻感可能来自早年家庭教育中关于金钱和道德的学习"的表达方向。

  - evidence_id: wealth.money_shame.say_yes_to_money.cannot_ask_for_money_01
    clause_id: wealth.money_shame
    source_id: healing.say_yes_to_money
    source_path: projects/research-center/kb/sources/healing/对财富说是
    source_location: 05-第二章是什么在制约你拥有金钱.md#对别人开口要钱是不可以的
    evidence_type: supports_concept
    support_level: direct
    summary: 奥南朵指出，向别人开口要钱是不可能的，源于"骄傲"；另一种无意识态度是"我不值得，我不够好"，负债也被体验为不可以。当无意识中有这些态度，就会限制自己。
    supported_part:
      - mechanism
      - report_language
    status: reviewed
    notes: 直接支持"不敢收钱/不敢开价"的羞恥機制。原文"骄傲"对应报告中的"亏欠感"，"不值得/不够好"对应"被评价的压力"。

  - evidence_id: wealth.money_shame.say_yes_to_money.receiving_support_01
    clause_id: wealth.money_shame
    source_id: healing.say_yes_to_money
    source_path: projects/research-center/kb/sources/healing/对财富说是
    source_location: 05-第二章是什么在制约你拥有金钱.md#把钱花在别人身上比花在自己身上更容易
    evidence_type: supports_concept
    support_level: direct
    summary: 第二章指出有些人把金钱花在别人身上更容易，对自己花钱会愤怒，可直接支持“收受支持困难”和“不敢收钱”相关的财富羞耻机制。
    supported_part:
      - mechanism
      - report_language
    status: reviewed
    notes: 可支持收费、收礼、接受支持等动作的羞耻或亏欠感表达。

  - evidence_id: wealth.money_shame.say_yes_to_money.women_self_worth_01
    clause_id: wealth.money_shame
    source_id: healing.say_yes_to_money
    source_path: projects/research-center/kb/sources/healing/对财富说是
    source_location: 05-第二章是什么在制约你拥有金钱.md#对别人开口要钱是不可以的
    evidence_type: supports_concept
    support_level: direct
    summary: 奥南朵在工作中观察到，由于中国长久以来重男轻女的观念，很多女性缺乏自我认可，在追求大目标时会迟疑、自我破坏。
    supported_part:
      - mechanism
    status: reviewed
    notes: 来源标注为奥南朵工作坊经验，可作为弱支持，不作为跨流派结论。可用于报告表达中"这种不敢收钱的阻力可能和早年成长中的自我认可有关"的低风险提示。

  # ===== Action 3 回填：事业/价值交换模块 =====
  # 《ACT就这么简单》第19章（价值）和第21章（承诺行动）
  - evidence_id: wealth.low_action.act_simple.values_definition_01
    clause_id: wealth.low_action
    source_id: healing.act_simple
    source_path: projects/research-center/kb/sources/healing/ACT就这么简单
    source_location: 27-第19章 知道什么重要.md#价值概述
    evidence_type: supports_concept
    support_level: direct
    summary: ACT将价值定义为"内心最深的渴望，想要如何表现——如何对待自己、他人和周围的世界"，它像内在指南针一样给予引导。当财富行动与真实价值脱节时，行动难以持续。
    supported_part:
      - mechanism
      - healing_direction
    status: reviewed
    notes: 可支持报告中"财富行动需要和真实需要连接"的机制方向。原文"价值是在持续的行动中所渴望表现出的总体特质"——可对应"你的财富目标背后，真正想主张的是什么"。

  - evidence_id: wealth.low_action.act_simple.value_vs_goal_01
    clause_id: wealth.low_action
    source_id: healing.act_simple
    source_path: projects/research-center/kb/sources/healing/ACT就这么简单
    source_location: 27-第19章 知道什么重要.md#价值与目标
    evidence_type: supports_concept
    support_level: direct
    summary: ACT区分价值和目标：目标是将来的、你想要得到或实现的事；价值是此刻以及持续基础上你想要如何表现。财富议题中，"赚更多钱"是目标，"以我想要的方式创造和交换价值"是价值。两者混淆会导致行动力不足。
    supported_part:
      - mechanism
      - report_language
    status: reviewed
    notes: 可支持报告中"你的行动力不足，可能不是因为不努力，而是因为行动和真实价值之间的连接还不够清晰"的表达方向。

  - evidence_id: wealth.value_expression_block.act_simple.commitment_action_01
    clause_id: wealth.value_expression_block
    source_id: healing.act_simple
    source_path: projects/research-center/kb/sources/healing/ACT就这么简单
    source_location: 29-第21章 为所当为.md#什么是承诺行动
    evidence_type: supports_concept
    support_level: direct
    summary: ACT将"承诺行动"定义为"在价值引导和驱动下采取有效行动，包括身体行动和心理行动"，核心是"把价值转换成有效行为模式"。财富中，将"有价值"翻译成"被世界看见并交换"需要承诺行动。
    supported_part:
      - mechanism
      - healing_direction
    status: reviewed
    notes: 可支持报告中"从'有价值'到'被看见'之间，需要把价值翻译成可执行的行动"这一机制说明。

  - evidence_id: wealth.value_expression_block.act_simple.value_problem_solving_01
    clause_id: wealth.value_expression_block
    source_id: healing.act_simple
    source_path: projects/research-center/kb/sources/healing/ACT就这么简单
    source_location: 29-第21章 为所当为.md#正念的、基于价值的问题解决
    evidence_type: supports_practice
    support_level: direct
    summary: ACT解决问题前先做正念和澄清价值工作：先帮助来访者锚定、与无益想法脱钩、接纳情绪，然后联结价值——"面对这个问题时，你想要主张什么？想把生活引向什么价值？"
    supported_part:
      - healing_direction
    status: reviewed
    notes: 可支持报告中低风险觉察方向："在推进财富行动之前，先看看这个行动背后真正想要的是什么"。

  - evidence_id: wealth.value_expression_block.act_simple.smallest_step_01
    clause_id: wealth.value_expression_block
    source_id: healing.act_simple
    source_path: projects/research-center/kb/sources/healing/ACT就这么简单
    source_location: 29-第21章 为所当为.md#行动计划
    evidence_type: supports_practice
    support_level: direct
    summary: ACT的行动计划强调"最小一步"："在接下来的24小时内，你能迈出的最小的、最细微的、最简单的一步是什么？"，帮助来访者聚焦当下而非被长远目标压垮。
    supported_part:
      - healing_direction
    status: reviewed
    notes: 可支持报告中低风险觉察方向："财富行动不一定是要大动作，先从小的、可执行的一步开始"。

  - evidence_id: wealth.career_value_exchange.act_simple.value_goal_01
    clause_id: wealth.career_value_exchange
    source_id: healing.act_simple
    source_path: projects/research-center/kb/sources/healing/ACT就这么简单
    source_location: 27-第19章 知道什么重要.md#价值与目标
    evidence_type: supports_concept
    support_level: direct
    summary: ACT 区分价值与目标，强调价值是持续行动中渴望表现出的总体特质，可直接支持财富报告中把“我有什么价值”翻译成“我如何让世界看见并交换这个价值”。
    supported_part:
      - mechanism
      - report_language
      - healing_direction
    status: reviewed
    notes: 适合作为事业、能力与价值交换模块的主要来源支撑。
