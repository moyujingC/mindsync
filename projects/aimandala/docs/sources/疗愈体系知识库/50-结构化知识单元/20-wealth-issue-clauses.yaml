domain_definition:
  title: 财富议题
  summary: 财富议题关注人与金钱、价值、资源、世界和行动之间的关系，不直接判断用户有没有钱或能不能赚钱。
  active_user_questions:
    - 我为什么赚不到钱。
    - 我为什么存不住钱。
    - 我为什么总觉得钱不够。
    - 我适合怎样创造财富。
    - 我的财富流动哪里卡住了。
    - 我的金钱关系和家庭、关系、事业有什么关联。
  positive_state:
    - 允许自己拥有财富。
    - 能看见自己的价值，并愿意交换价值。
    - 对金钱有稳定、清明、不紧绷的态度。
    - 有行动力，也有持续性。
    - 能赚钱，也能承载和保存财富。
    - 愿意和世界建立真实链接。
    - 能从热爱、创造、服务和自由出发赚钱。

clauses:
  - id: wealth.low_deservingness
    title: 配得感不足
    summary: 用户可能不太允许自己拥有更多，或对自己值得被支付、被支持、被看见有怀疑。
    typical_signals:
      - 觉得自己不值得拥有更多。
      - 拿到结果后仍然不满意。
      - 需要不断证明自己才敢收钱。
      - 对自己的价值有怀疑。
    report_language:
      - 从财富议题来看，这里更像是在说一种“我值不值得拥有”的拉扯。
      - 你可能不是没有能力创造价值，而是内在还没有完全允许自己稳定地接住更多。
    healing_direction:
      - 配得感练习。
      - 自我价值确认。
      - 区分价值创造和自我证明。
    visual_mapping_candidates:
      - 金多可能映射到求认可、自我评判和外界标准。
      - 土弱或不成片可能映射到承载不足。
    safety:
      avoid:
        - 不写成用户一定赚不到钱。
        - 不写成固定人格缺陷。

  - id: wealth.scarcity_and_insecurity
    title: 匮乏感和安全感不足
    summary: 用户可能把钱当成安全感来源，即使有进账也难以真正安心。
    typical_signals:
      - 对钱紧张、焦虑、患得患失。
      - 有进账也不安心。
      - 害怕未来不够用。
      - 赚钱动力来自恐惧，而不是热爱和创造。
    report_language:
      - 这里的财富卡点更像是安全感在向钱借力：钱越重要，内在越容易紧绷。
      - 这不一定代表现实资源真的不足，也可能是内在长期处在“不够用”的预设里。
    healing_direction:
      - 安全感重建。
      - 金钱信念梳理。
      - 身体稳定练习。
    visual_mapping_candidates:
      - 水火冲突可能映射到情绪消耗行动力。
    safety:
      avoid:
        - 不判断用户真实财务状况。
        - 不承诺通过调整就能获得收入增长。

  - id: wealth.approval_driven_earning
    title: 求认可式赚钱
    summary: 用户可能把赚钱、成绩或客户认可当成证明自己值得的方式。
    typical_signals:
      - 努力是为了被看见、被证明、被认可。
      - 产出价值时很在意外界评价。
      - 达不到标准就自我攻击。
      - 把财富结果等同于“我好不好”。
    report_language:
      - 这条线索像是在提醒你：财富不只是收入问题，也牵动着“我是否被认可”的需要。
      - 当赚钱变成证明自己的方式，行动会变得很用力，也更容易被外界评价牵动。
    healing_direction:
      - 自我价值确认。
      - 放松外界标准。
      - 区分收入结果和自我价值。
    visual_mapping_candidates:
      - 金多可能映射到求认可、自我评判和外界标准。
    safety:
      avoid:
        - 不把努力赚钱批评为错误。
        - 不否定用户的现实目标。

  - id: wealth.emotional_spending
    title: 情绪型漏财
    summary: 用户可能通过消费安抚情绪，或让情绪压力影响财富决策。
    typical_signals:
      - 为情绪买单。
      - 开心时奖励性消费，不开心时安抚性消费。
      - 花钱不看性价比，只看当下感觉。
      - 情感、家庭、成长焦虑带动支出。
    report_language:
      - 这里更像是钱在替情绪出口工作：消费本身可能不是问题，问题是它承担了太多安抚功能。
      - 如果情绪没有被看见，财富流动就容易变成一边进入、一边被情绪带走。
    healing_direction:
      - 情绪消费觉察。
      - 记录消费前后的感受。
      - 建立不靠消费也能安抚自己的方式。
    visual_mapping_candidates:
      - 外圈红色多可能映射到情绪型漏财。
      - 水火冲突可能映射到情绪消耗行动力。
    safety:
      avoid:
        - 不直接说用户乱花钱。
        - 不做财务管理承诺。

  - id: wealth.low_capacity
    title: 承载力不足
    summary: 用户可能能创造收入或机会，但接住、保存和稳定承载的能力不足。
    typical_signals:
      - 能赚钱但存不住。
      - 有机会但接不住。
      - 收入提升后很快出现新支出或新压力。
      - 财富增长会带来焦虑，而不是稳定。
    report_language:
      - 这条线索不一定是在说你没有财富能力，更像是在说“接住财富”的容器还需要变稳。
      - 当承载力不足时，机会和收入来了，内在反而可能更紧张。
    healing_direction:
      - 承载力练习。
      - 身体稳定练习。
      - 建立稳定节奏和资源容器。
    visual_mapping_candidates:
      - 土弱或不成片可能映射到承载力不足。
      - 木无根可能映射到成长动力有但滋养不足。
    safety:
      avoid:
        - 不把存不住钱写成定论。
        - 不承诺任何财富保存结果。

  - id: wealth.low_action
    title: 行动力不足
    summary: 用户可能有想法但落地少，行动容易被情绪、关系或自我怀疑打断。
    typical_signals:
      - 想法很多，但落地少。
      - 热情不持续。
      - 容易被情绪和关系拖走。
      - 计划常被外界标准、家庭关系或自我怀疑打断。
    report_language:
      - 财富流动需要行动承接；如果行动一再被打断，价值就很难真正进入现实交换。
      - 这里更像是在提醒你先恢复小步行动，而不是一次性逼自己完成很大的改变。
    healing_direction:
      - 行动力训练。
      - 每天一个低压力小行动。
      - 把计划拆成更小的现实步骤。
    visual_mapping_candidates:
      - 水火冲突可能映射到情绪消耗行动力。
      - 木无根可能映射到成长动力有但滋养不足。
    safety:
      avoid:
        - 不把行动力不足写成懒惰。
        - 不用命令式语气要求用户立刻改变。

  - id: wealth.low_world_connection
    title: 与世界链接不足
    summary: 用户可能不愿意打开表达、合作、服务、市场或客户关系，倾向于一个人扛。
    typical_signals:
      - 不信任世界。
      - 不愿意打开人际链接。
      - 倾向于一个人扛。
      - 不愿意向外表达价值。
      - 对赚钱、客户、合作、市场缺少热爱。
    report_language:
      - 财富不是只发生在自己内部，它也需要和世界、他人、资源产生连接。
      - 如果你习惯一个人扛，价值可能已经存在，但还没有充分被表达和交换出去。
    healing_direction:
      - 与世界链接练习。
      - 小范围表达价值。
      - 练习合作、服务和真实呈现。
    visual_mapping_candidates:
      - 外圈状态可作为观察与世界链接的入口。
    safety:
      avoid:
        - 不强迫用户社交或合作。
        - 不把内向或谨慎写成问题。

safety:
  global_avoid:
    - 不把财富解读写成财务预测。
    - 不承诺收入、客户、成交或投资结果。
    - 不把金钱模式写成固定人格缺陷。
    - 不把单一画面信号直接等同于财富结论。
