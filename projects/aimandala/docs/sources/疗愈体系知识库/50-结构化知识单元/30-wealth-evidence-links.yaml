  - evidence_id: wealth.low_capacity.say_yes_to_money.receive_money_01
    clause_id: wealth.low_capacity
    source_id: healing.say_yes_to_money
    source_path: projects/research-center/kb/sources/healing/对财富说是
    source_location: 90-章节摘要与主题标注.md#第二章
    evidence_type: supports_concept
    support_level: partial
    summary: 第二章摘要列出抓住钱、赶紧花钱、不敢要钱等无意识金钱态度，可部分支持财富承接、持有和稳定流动相关条款。
