  - evidence_id: wealth.scarcity_and_insecurity.say_yes_to_money.money_projection_01
    clause_id: wealth.scarcity_and_insecurity
    source_id: healing.say_yes_to_money
    source_path: projects/research-center/kb/sources/healing/对财富说是
    source_location: 90-章节摘要与主题标注.md#第一章
    evidence_type: supports_concept
    support_level: partial
    summary: 第一章摘要指出人会把身份、安全、自由、尊严、爱和接纳投射到金钱上，可部分支持“安全感借由金钱表达”的机制。
    supported_part:
      - mechanism
    status: draft
    notes: 适合用于解释“钱不只是钱”，但不能判断用户真实财务安全状况。

  - evidence_id: wealth.scarcity_and_insecurity.say_yes_to_money.more_attitude_01
    clause_id: wealth.scarcity_and_insecurity
    source_id: healing.say_yes_to_money
    source_path: projects/research-center/kb/sources/healing/对财富说是
    source_location: 90-章节摘要与主题标注.md#第二章
    evidence_type: supports_concept
    support_level: weak
    summary: 第二章摘要中提到“更多”是一种常见金钱无意识态度，会让人无法享受已经拥有的财富，可弱支持“总觉得不够”的财富焦虑方向。
    supported_part:
      - mechanism
      - report_language
    status: draft
    notes: 与安全感不足相关，但不是直接的临床或心理学证据。

  - evidence_id: wealth.approval_driven_earning.say_yes_to_money.self_worth_01
    clause_id: wealth.approval_driven_earning
    source_id: healing.say_yes_to_money
    source_path: projects/research-center/kb/sources/healing/对财富说是
    source_location: 90-章节摘要与主题标注.md#第一章
    evidence_type: supports_concept
    support_level: weak
    summary: 第一章摘要提到人会把身份、尊严、爱和接纳投射到金钱上，可弱支持财富结果与自我评价、被认可需要相互缠绕的方向。
    supported_part:
      - mechanism
    status: draft
    notes: 只能支持“金钱承载心理投射”的上位机制，不能直接证明求认可式赚钱。

  - evidence_id: wealth.emotional_spending.say_yes_to_money.habit_protection_01
