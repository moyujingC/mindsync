  - evidence_id: wealth.low_action.say_yes_to_money.body_action_01
    clause_id: wealth.low_action
    source_id: healing.say_yes_to_money
    source_path: projects/research-center/kb/sources/healing/对财富说是
    source_location: 90-章节摘要与主题标注.md#第五章
    evidence_type: supports_concept
    support_level: partial
    summary: 第五章摘要指出身体连接、身体姿势、直觉和行动力与财富关系有关，可部分支持行动力条款中的身体连接和财富行动方向。
    supported_part:
      - mechanism
      - healing_direction
    status: draft
    notes: 身体直觉只能作为觉察线索，不能作为高风险决策依据。

  - evidence_id: wealth.low_action.say_yes_to_money.fear_change_01
    clause_id: wealth.low_action
    source_id: healing.say_yes_to_money
    source_path: projects/research-center/kb/sources/healing/对财富说是
    source_location: 90-章节摘要与主题标注.md#第四章
    evidence_type: supports_concept
    support_level: partial
    summary: 第四章摘要聚焦压力、恐惧、目标和改变，认为恐惧会让人生和事业变小，可部分支持行动被恐惧和压力限制的方向。
    supported_part:
      - mechanism
      - report_language
    status: draft
    notes: 产品化时应使用“可能限制行动”，不能写成确定因果。

  - evidence_id: wealth.low_world_connection.say_yes_to_money.passion_need_01
    clause_id: wealth.low_world_connection
    source_id: healing.say_yes_to_money
