    source_location: 90-章节摘要与主题标注.md#第七章
    evidence_type: supports_concept
    support_level: weak
    summary: 第七章摘要提到坏习惯可能是无意识保护策略，可弱支持把消费习惯理解为情绪或保护功能的入口。
