schema:
  evidence_id: 全局唯一证据 ID。
  clause_id: 被支持或被反驳的结构化条款 ID。
  source_id: 来源 ID。
  source_path: 来源路径。
  source_location: 章节、页码、段落或文件位置。
  evidence_type: supports_concept | supports_expression | supports_practice | contradicts | not_applicable
  support_level: direct | partial | weak | conflict
  summary: 对证据关系的简短说明。
  supported_part:
    - mechanism
    - report_language
    - healing_direction
    - safety_boundary
  status: draft | reviewed | accepted | rejected
  notes: 补充说明。

