    source_location: 90-章节摘要与主题标注.md#第六章
    evidence_type: supports_concept
    support_level: weak
    summary: 第六章摘要强调从快乐、热情和真实需要出发，而不是只专注钱本身，可弱支持财富需要与生命力、真实行动和外部交换连接。
    supported_part:
      - mechanism
      - report_language
    status: draft
    notes: 未直接讨论市场、客户或合作关系，只能作为与世界连接的上位启发。

  - evidence_id: wealth.global.say_yes_to_money.safety_boundary_01
    clause_id: wealth
    source_id: healing.say_yes_to_money
    source_path: projects/research-center/kb/sources/healing/对财富说是
    source_location: 91-来源评估与使用边界.md#风险边界素材
    evidence_type: supports_practice
    support_level: direct
    summary: 来源评估明确指出财富疗愈不能替代理财、投资、法律或商业决策，家庭系统解释不能替代心理诊断，AI 应优先使用低风险觉察练习。
    supported_part:
      - safety_boundary
    status: draft
    notes: 这条证据支持财富议题全局安全边界，不支持任何具体财富机制结论。
