  - projects/aimandala/docs/sources/疗愈体系知识库/20-疗愈体系/10-议题层/11-财富议题手册.md
  - projects/aimandala/docs/sources/疗愈体系知识库/20-疗愈体系/10-议题层/90-财富议题案例反推.md
