visual_signal_routes:
  - signal_id: visual.outer_red_or_fire_excess
    label: 外圈红色或火能量明显
    source_refs:
      - 90-财富议题案例反推.md#外圈红色多
      - 12-高频组合模式.md#2-火一块一块被金截断
    candidate_clauses:
      - wealth.emotional_spending
      - wealth.low_action
    candidate_modules:
      - wealth.emotion_spending_protective_habits
      - wealth.body_fear_action
    use_as: candidate_mapping
    report_boundary: 只能说可能存在外放、消耗或情绪带动消费，不能直接断言用户现实漏财。

  - signal_id: visual.weak_fire_many
    label: 弱火多
    source_refs:
      - 12-高频组合模式.md#5-弱火多
    candidate_clauses:
      - wealth.approval_driven_earning
      - wealth.emotional_spending
    candidate_modules:
      - wealth.deservingness_self_worth
      - wealth.emotion_spending_protective_habits
    use_as: candidate_mapping
    report_boundary: 适合表达渴望被看见、被认可或被情绪影响，不能写成固定人格结论。

  - signal_id: visual.metal_excess
    label: 金多
    source_refs:
      - 12-高频组合模式.md#6-金多
    candidate_clauses:
      - wealth.low_deservingness
      - wealth.approval_driven_earning
    candidate_modules:
      - wealth.deservingness_self_worth
      - wealth.career_value_exchange
    use_as: candidate_mapping
    report_boundary: 适合表达标准、评判和证明压力，不能否定用户努力和现实目标。

  - signal_id: visual.weak_or_fragmented_earth
    label: 土弱或土零散不成片
    source_refs:
      - 90-财富议题案例反推.md#财富承载力不足
      - 12-高频组合模式.md#7-土零散不成片
    candidate_clauses:
      - wealth.low_capacity
      - wealth.scarcity_and_insecurity
    candidate_modules:
      - wealth.safety_scarcity_control
      - wealth.body_fear_action
    use_as: candidate_mapping
    report_boundary: 只能说承接、稳定和资源容器可能需要加强，不能预测存款或财富结果。

  - signal_id: visual.water_fire_conflict
    label: 水火相冲
    source_refs:
      - 12-高频组合模式.md#8-水火相冲
    candidate_clauses:
      - wealth.low_action
      - wealth.emotional_spending
      - wealth.scarcity_and_insecurity
    candidate_modules:
      - wealth.body_fear_action
      - wealth.emotion_spending_protective_habits
      - wealth.safety_scarcity_control
    use_as: candidate_mapping
    report_boundary: 适合表达热情与恐惧、行动与情绪之间的拉扯，不能写成医学或心理诊断。

  - signal_id: visual.rootless_wood
    label: 木无根
    source_refs:
      - 12-高频组合模式.md#3-木无根
    candidate_clauses:
      - wealth.low_action
      - wealth.low_capacity
    candidate_modules:
      - wealth.body_fear_action
      - wealth.passion_needs_abundance
    use_as: candidate_mapping
    report_boundary: 适合表达成长动力有但滋养不足，不能写成用户没有能力。

  - signal_id: visual.fragmented_white_or_metal_cut
    label: 白色割裂或金截断
    source_refs:
      - 12-高频组合模式.md#1-白色把其他颜色割裂开
    candidate_clauses:
      - wealth.approval_driven_earning
      - wealth.low_action
    candidate_modules:
      - wealth.deservingness_self_worth
      - wealth.body_fear_action
    use_as: candidate_mapping
    report_boundary: 适合表达标准、信息或行动被打断，不能只凭截断信号生成财富结论。

  - signal_id: visual.outer_world_closed_or_blank
    label: 外圈留白多或对外表达弱
    source_refs:
      - 12-高频组合模式.md#10-紫色单一且留白多
    candidate_clauses:
      - wealth.low_world_connection
      - wealth.low_action
    candidate_modules:
      - wealth.world_connection_market
      - wealth.career_value_exchange
    use_as: candidate_mapping
    report_boundary: 适合表达现实连接、行动或价值交换不足，不能把内向、学习或灵性倾向写成问题。

module_selection:
  lite:
    max_primary_modules: 2
    max_issue_clauses: 2
    required:
      - 至少 3 条画面依据。
      - 至少 1 个财富知识模块。
      - 至少 1 条低压小步建议。
    avoid:
      - 展开复杂根因链。
      - 同时塞入过多 `source_needed` 模块。

  pro:
    max_primary_modules: 5
    max_issue_clauses: 4
    required:
      - 说明核心主轴。
      - 逐圈解释财富相关信号。
      - 连接至少 2 个财富知识模块。
      - 给出阶段性调节方向。
    avoid:
      - 把来源不足模块写成确定机制。
      - 把报告写成完整主题方案或 21 天计划。

ranking_rules:
  - 用户明确问题优先于画面候选信号。
  - 三圈位置影响解释权重：里圈偏内在感受，中圈偏关系与能量流动，外圈偏行动、物质和对外呈现。
  - 多个画面信号共同指向同一条款时，该条款优先级提升。
  - 单一画面信号只能生成候选解释，不生成强结论。
  - source_supported_draft 模块优先于 model_scaffold 和 source_needed 模块。
  - source_needed 模块只在用户问题或画面信号高度相关时进入报告，并使用追问式表达。

report_language_rules:
  required_phrases:
    - 从画面看起来
    - 可能
    - 更像是
    - 值得观察
  avoid_phrases:
    - 你一定
    - 这说明你就是
    - 你的财富一定会
    - 你必须
  evidence_order:
    - 先写画面观察。
    - 再写财富模块解释。
    - 再写用户可观察的现实表现。
    - 最后给低风险建议或下一步入口。

safety:
  global_avoid:
    - 不判断用户收入、资产、债务、投资前景或职业成败。
    - 不给买卖、辞职、创业、借贷、融资等决策建议。
    - 不把父母、家庭、身体或画面符号写成确定因果。
    - 不把同一作者体系内部观点写成完整疗愈体系共识。
    - 不对创伤、成瘾、债务危机、家庭暴力或自伤风险做 AI 单独处理。
  fallback:
    high_risk: 触发外部专业支持引导，不生成深度财富报告。
    insufficient_visual_evidence: 只输出已确认观察和可能方向，不补写细节。
    theme_unclear: 先确认主题，再进入财富 routing。

quality_checks:
  - 是否明确 `user_theme` 为财富。
  - 是否至少引用一个可见画面信号。
  - 是否说明选中的财富模块或条款。
  - 是否把 `model_scaffold` 和 `source_needed` 降级表达。
  - 是否保留 Lite / Pro 边界。
  - 是否避免财务建议、心理诊断和确定性承诺。
