version: 0.1.1
last_updated: 2026-05-11
source_of_truth: projects/research-center/kb/preference-memory/review-patterns.yaml
description: >
  创作者 review 反馈的第一版结构化记录。
  用于承接单次反馈样本、稳定偏好模式和 hard constraints。

review_events:
  - source_id: huang-youcan-high-ticket-01
    reviewed_at: 2026-04-05
    value_type: hybrid
    final_decision: approve_with_notes
    keep:
      - 高客单服务与交付的核心，不只是交付内容，而是用户在你身上获得的状态感、被认真对待感和清晰启发
      - 一人公司或个人型生意的关键，不是堆很多产品，而是围绕少数核心产品，持续向外展示自己真正擅长解决的问题
      - 喜欢表达精准、能让人感觉作者脑子里有完整地图、能把思想讲明白的风格
      - 认同短视频结尾接长文截图的深度承接设计
    watch:
      - 不直接复制行业大V的整体口气和位置感
      - 保留个人分享的活人感
      - 不把男性化表达外壳直接迁移到自己身上
  - source_id: anti-ai-writing-style-2026-05-11
    reviewed_at: 2026-05-11
    value_type: expression_constraint
    final_decision: approve_as_long_lived_constraint
    source:
      - projects/research-center/kb/sources/ai/2026-05-11-SOTA-Sync-这个表达式用了就像在用AI.md
      - user_review: "删掉明显的“不是 X，而是 Y”式对照句，减少空泛强调，把部分句子改成更直接的工程说明。"
    keep:
      - 正式文档应优先使用直接、具体、工程化的表达
      - 写完后自查并删除明显的 AI 写作痕迹
      - 把空泛强调和模板化连接词改成具体说明
    watch:
      - 避免“不是 X，而是 Y”式先否定再重构的弱对照
      - 避免机械三连、夸大语气和节拍器式段落
      - 避免为了显得有洞见而设置的弱对照

stable_patterns:
  - pattern_id: initial-review-as-learning-signal
    pattern_type: workflow
    description: 人工 review 结果应被视为系统学习信号，而不只是审批结果。
    evidence_count: 1
    confidence: 0.7
    last_seen: 2026-04-05
  - pattern_id: precise-but-alive-voice
    pattern_type: expression
    description: 偏好表达精准、思想清楚、能让人感到背后有完整思考图谱，同时保留活人感和个人分享感。
    evidence_count: 1
    confidence: 0.84
    last_seen: 2026-04-05
  - pattern_id: few-core-offers
    pattern_type: judgment
    description: 认可一人公司或个人型生意应围绕少数核心产品，持续展示真正擅长解决的问题。
    evidence_count: 1
    confidence: 0.82
    last_seen: 2026-04-05
  - pattern_id: high-ticket-service-is-state-and-clarity
    pattern_type: judgment
    description: 认可高客单服务与交付的核心不只是交付内容，而是状态感、被认真对待感和清晰启发。
    evidence_count: 1
    confidence: 0.88
    last_seen: 2026-04-05
  - pattern_id: direct-engineering-writing-over-ai-rhythm
    pattern_type: expression
    description: 正式文档偏好直接、具体、工程化的表达；应删掉明显的 AI 写作节奏，包括“不是 X，而是 Y”式弱对照、空泛强调、机械三连和模板化连接词。
    evidence_count: 2
    confidence: 0.9
    last_seen: 2026-05-11

hard_constraints:
  - constraint_id: do-not-assume-user-view
    description: 不要把系统推测自动写成创作者已确认的个人观点。
    last_seen: 2026-04-05
  - constraint_id: no-platform-first-routing
    description: 入口优先判断材料价值类型，不优先按平台或账号分流。
    last_seen: 2026-04-05
  - constraint_id: no-auto-promotion-before-review
    description: 没有人工 review 前，不自动把候选条目升格为正式知识原则。
    last_seen: 2026-04-05
  - constraint_id: no-direct-copy-of-identity-shell
    description: 不直接复制他人的身份感、行业位置感或性别化表达外壳到创作者自己的表达中。
    last_seen: 2026-04-05
  - constraint_id: no-ai-style-weak-contrast
    description: 正式文档、方案、总结和交付说明中，默认避免“不是 X，而是 Y”式先否定再重构的弱对照；只有在确实需要做技术区分时才使用。
    last_seen: 2026-05-11
  - constraint_id: no-generic-emphasis-rhythm
    description: 避免用“核心、关键、真正、显著、系统性、根本”等空泛强调词制造判断感；优先改成具体对象、约束、动作和证据。
    last_seen: 2026-05-11
