  <h2 class="p5" id="calibre_pb_0">第2章　恐怖经历</h2>

  <p class="ziti3">记忆侵扰和禁闭畏缩这两个互相矛盾的反应，会形成一种摆荡于两端的律动。这两个相反心理状态之间的矛盾冲突，也许就是创伤后症候群的最大特征。</p>

  <p class="ziti3">心理创伤的痛苦源于无力感。在受创当时，受害者笼罩在无法抵抗的力量下而感到无助。如果是大自然的力量，我们称作天灾（disasters）；如果是人为的，我们叫它暴行（atrocities）。创伤事件摧毁了人们得以正常生活的安全感，世间的人与事不再可以掌控，也失去关联性与合理性。</p>
