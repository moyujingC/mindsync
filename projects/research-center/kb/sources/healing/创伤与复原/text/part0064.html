  <h2 class="p5" id="calibre_pb_0">第11章　共通性</h2>

  <p class="ziti3">创伤患者在与人产生共通性后，方可休息。她的复原现已完成，如今要面对的，只是她自己的人生。</p>

  <p class="ziti3">创伤事件毁坏了个人和群体之间的联系：创伤患者领会到，其自我感、价值观和人性，都取决于与他人所产生的联系感。群体的团结是对抗恐怖和绝望最有力的防御机制，也最能减轻创伤经历所造成的伤害。创伤使人产生疏离感，群体则使人重获归属感；创伤为人带来羞辱和诬蔑，群体则能作见证和给予肯定；创伤贬低受害者，群体则提升她；创伤摧毁受害者的人性，群体则可以恢复她的人性。</p>
